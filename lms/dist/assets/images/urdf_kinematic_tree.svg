<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <filter id="nodeShadow" x="-3%" y="-5%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="360" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="400" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">URDF / XACRO ROBOT KINEMATIC TREE &amp; JOINT HIERARCHY</text>

  <!-- base_footprint Root Node -->
  <g filter="url(#nodeShadow)">
    <rect x="300" y="50" width="200" height="42" rx="6" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
    <text x="400" y="76" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">base_footprint (Ground)</text>
  </g>

  <!-- Joint: base_joint (fixed) -->
  <path d="M 400 92 L 400 125" stroke="#0284c7" stroke-width="2"/>
  <rect x="330" y="100" width="140" height="18" rx="4" fill="#e0f2fe" stroke="#38bdf8" stroke-width="1"/>
  <text x="400" y="113" font-family="monospace" font-size="10" font-weight="bold" fill="#0369a1" text-anchor="middle">base_joint [fixed]</text>

  <!-- base_link Node -->
  <g filter="url(#nodeShadow)">
    <rect x="300" y="125" width="200" height="42" rx="6" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="400" y="151" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">base_link (Chassis)</text>
  </g>

  <!-- Tree branch lines from base_link -->
  <path d="M 400 167 L 400 190" stroke="#64748b" stroke-width="2"/>
  <path d="M 120 190 L 680 190" stroke="#64748b" stroke-width="2"/>

  <!-- Left drop: left_wheel -->
  <path d="M 120 190 L 120 230" stroke="#64748b" stroke-width="2"/>
  <rect x="50" y="200" width="140" height="18" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="120" y="213" font-family="monospace" font-size="10" font-weight="bold" fill="#065f46" text-anchor="middle">left_wheel_joint [continuous]</text>
  <g filter="url(#nodeShadow)">
    <rect x="40" y="230" width="160" height="50" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="120" y="255" font-family="monospace" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">left_wheel_link</text>
    <text x="120" y="271" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Cylinder (r=0.033, l=0.018)</text>
  </g>

  <!-- Right drop: right_wheel -->
  <path d="M 300 190 L 300 230" stroke="#64748b" stroke-width="2"/>
  <rect x="230" y="200" width="140" height="18" rx="4" fill="#ecfdf5" stroke="#10b981" stroke-width="1"/>
  <text x="300" y="213" font-family="monospace" font-size="10" font-weight="bold" fill="#065f46" text-anchor="middle">right_wheel_joint [continuous]</text>
  <g filter="url(#nodeShadow)">
    <rect x="220" y="230" width="160" height="50" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="2"/>
    <text x="300" y="255" font-family="monospace" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">right_wheel_link</text>
    <text x="300" y="271" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">Cylinder (r=0.033, l=0.018)</text>
  </g>

  <!-- Laser drop: laser_frame -->
  <path d="M 500 190 L 500 230" stroke="#64748b" stroke-width="2"/>
  <rect x="430" y="200" width="140" height="18" rx="4" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="500" y="213" font-family="monospace" font-size="10" font-weight="bold" fill="#92400e" text-anchor="middle">laser_joint [fixed]</text>
  <g filter="url(#nodeShadow)">
    <rect x="420" y="230" width="160" height="50" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text x="500" y="255" font-family="monospace" font-size="12" font-weight="bold" fill="#b45309" text-anchor="middle">laser_frame</text>
    <text x="500" y="271" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">2D LiDAR (360° Ray Scanner)</text>
  </g>

  <!-- IMU drop: imu_link -->
  <path d="M 680 190 L 680 230" stroke="#64748b" stroke-width="2"/>
  <rect x="610" y="200" width="140" height="18" rx="4" fill="#f3e8ff" stroke="#a855f7" stroke-width="1"/>
  <text x="680" y="213" font-family="monospace" font-size="10" font-weight="bold" fill="#6b21a8" text-anchor="middle">imu_joint [fixed]</text>
  <g filter="url(#nodeShadow)">
    <rect x="600" y="230" width="160" height="50" rx="6" fill="#ffffff" stroke="#a855f7" stroke-width="2"/>
    <text x="680" y="255" font-family="monospace" font-size="12" font-weight="bold" fill="#7e22ce" text-anchor="middle">imu_link</text>
    <text x="680" y="271" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" fill="#64748b" text-anchor="middle">6-DOF Inertial Sensor</text>
  </g>

  <!-- Summary info box -->
  <rect x="40" y="300" width="720" height="42" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="400" y="326" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#475569" text-anchor="middle">Joints connect Links: Links carry mass, inertial tensors, and collision meshes; Joints carry spatial offsets &amp; degrees of freedom.</text>
</svg>
