<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <filter id="panelShadow" x="-2%" y="-4%" width="104%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="360" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Left: ROS 1 (Centralized roscore) -->
  <g filter="url(#panelShadow)">
    <rect x="30" y="30" width="350" height="300" rx="10" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
    <text x="205" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#e11d48" text-anchor="middle">ROS 1 (Legacy Master Architecture)</text>

    <!-- Master Node -->
    <rect x="130" y="85" width="150" height="42" rx="6" fill="#e11d48"/>
    <text x="205" y="111" font-family="monospace" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">roscore (Master)</text>

    <!-- Broken / bottleneck arrows -->
    <path d="M 205 127 L 110 180" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,3"/>
    <path d="M 205 127 L 300 180" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,3"/>

    <!-- Nodes -->
    <rect x="55" y="180" width="110" height="40" rx="6" fill="#ffffff" stroke="#e11d48" stroke-width="1.5"/>
    <text x="110" y="205" font-family="monospace" font-size="12" font-weight="bold" fill="#e11d48" text-anchor="middle">/camera_node</text>

    <rect x="245" y="180" width="110" height="40" rx="6" fill="#ffffff" stroke="#e11d48" stroke-width="1.5"/>
    <text x="300" y="205" font-family="monospace" font-size="12" font-weight="bold" fill="#e11d48" text-anchor="middle">/motor_node</text>

    <!-- Failure callout -->
    <rect x="50" y="245" width="310" height="65" rx="6" fill="#ffffff" stroke="#fda4af" stroke-width="1"/>
    <text x="65" y="268" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#e11d48">⚠️ Single Point of Failure:</text>
    <text x="65" y="286" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#475569">If `roscore` crashes, the entire robot stops.</text>
    <text x="65" y="300" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#475569">No native security or multi-robot discovery.</text>
  </g>

  <!-- Right: ROS 2 (Peer-to-Peer DDS) -->
  <g filter="url(#panelShadow)">
    <rect x="420" y="30" width="350" height="300" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="595" y="60" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#059669" text-anchor="middle">ROS 2 Jazzy (DDS Peer-to-Peer)</text>

    <!-- DDS Global Data Space -->
    <rect x="450" y="85" width="290" height="42" rx="6" fill="#059669"/>
    <text x="595" y="111" font-family="monospace" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">DDS Global Data Space (FastDDS)</text>

    <!-- Bi-directional arrows -->
    <path d="M 505 127 L 505 180" stroke="#10b981" stroke-width="2.5"/>
    <path d="M 685 127 L 685 180" stroke="#10b981" stroke-width="2.5"/>

    <!-- Direct peer line -->
    <path d="M 560 200 L 630 200" stroke="#0284c7" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="595" y="195" font-family="monospace" font-size="10" font-weight="bold" fill="#0284c7" text-anchor="middle">Direct Peer</text>

    <!-- Nodes -->
    <rect x="445" y="180" width="120" height="40" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="505" y="205" font-family="monospace" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">/camera_node</text>

    <rect x="625" y="180" width="120" height="40" rx="6" fill="#ffffff" stroke="#059669" stroke-width="1.5"/>
    <text x="685" y="205" font-family="monospace" font-size="12" font-weight="bold" fill="#059669" text-anchor="middle">/motor_node</text>

    <!-- Success callout -->
    <rect x="440" y="245" width="310" height="65" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
    <text x="455" y="268" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#059669">✓ Decentralized &amp; Industrial Grade:</text>
    <text x="455" y="286" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#475569">Zero single points of failure, automatic discovery.</text>
    <text x="455" y="300" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#475569">Tunable QoS (Reliable vs Best-Effort, Real-time).</text>
  </g>
</svg>
