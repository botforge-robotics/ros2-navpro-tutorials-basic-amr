<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="420" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <rect x="20" y="16" width="920" height="38" rx="6" fill="#7c3aed"/>
  <text x="480" y="41" font-family="system-ui, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">
    NAV2 BEHAVIOR TREE: REACTIVE RECOVERY FALLBACK PIPELINE
  </text>

  <!-- Root: RecoveryNode -->
  <g transform="translate(390, 75)" filter="url(#shadow)">
    <rect width="180" height="42" rx="6" fill="#f8fafc" stroke="#7c3aed" stroke-width="2"/>
    <text x="90" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#6d28d9" text-anchor="middle">RecoveryNode (Root)</text>
    <text x="90" y="34" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">Executes Child 1; on Fail -&gt; Child 2</text>
  </g>

  <!-- Connecting Lines -->
  <path d="M 430,117 L 430,145 L 210,145 L 210,170" fill="none" stroke="#64748b" stroke-width="2"/>
  <path d="M 530,117 L 530,145 L 680,145 L 680,170" fill="none" stroke="#64748b" stroke-width="2"/>

  <!-- Child 1: Primary Navigation Pipeline -->
  <g transform="translate(90, 170)" filter="url(#shadow)">
    <rect width="240" height="225" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <rect x="0" y="0" width="240" height="30" rx="6" fill="#16a34a"/>
    <text x="120" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">PRIMARY NAVIGATION PIPELINE</text>

    <g transform="translate(15, 45)">
      <rect width="210" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="105" y="18" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">ComputePathToPose</text>
      <text x="105" y="32" font-family="system-ui, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Global Planner (A* / NavFn)</text>
    </g>

    <g transform="translate(15, 100)">
      <rect width="210" height="42" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="105" y="18" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">FollowPath</text>
      <text x="105" y="32" font-family="system-ui, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Local Controller (DWB / RPP)</text>
    </g>

    <rect x="15" y="155" width="210" height="55" rx="4" fill="#ffffff" stroke="#16a34a"/>
    <text x="105" y="175" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#15803d" text-anchor="middle">SUCCESS STATE</text>
    <text x="105" y="195" font-family="system-ui, sans-serif" font-size="8" fill="#475569" text-anchor="middle">Goal reached within tolerance</text>
  </g>

  <!-- Child 2: Recovery Sequence -->
  <g transform="translate(380, 170)" filter="url(#shadow)">
    <rect width="540" height="225" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
    <rect x="0" y="0" width="540" height="30" rx="6" fill="#dc2626"/>
    <text x="270" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">REACTIVE RECOVERY FALLBACK SEQUENCE (On Controller Failure)</text>

    <!-- Step 1: Clear Costmap -->
    <g transform="translate(20, 50)">
      <rect width="110" height="85" rx="6" fill="#ffffff" stroke="#fca5a5"/>
      <rect x="0" y="0" width="110" height="22" rx="4" fill="#fee2e2"/>
      <text x="55" y="15" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#991b1b" text-anchor="middle">STEP 1: CLEAR</text>
      <text x="55" y="42" font-family="monospace" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">ClearEntire</text>
      <text x="55" y="54" font-family="monospace" font-size="8" font-weight="700" fill="#0f172a" text-anchor="middle">Costmap</text>
      <text x="55" y="72" font-family="system-ui, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">Purge ghost noise</text>
    </g>

    <text x="140" y="95" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">→</text>

    <!-- Step 2: Spin -->
    <g transform="translate(150, 50)">
      <rect width="110" height="85" rx="6" fill="#ffffff" stroke="#fca5a5"/>
      <rect x="0" y="0" width="110" height="22" rx="4" fill="#fee2e2"/>
      <text x="55" y="15" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#991b1b" text-anchor="middle">STEP 2: SPIN</text>
      <text x="55" y="45" font-family="monospace" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Spin 360°</text>
      <text x="55" y="65" font-family="system-ui, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">w = 0.5 rad/s</text>
      <text x="55" y="75" font-family="system-ui, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">Re-scan area</text>
    </g>

    <text x="270" y="95" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">→</text>

    <!-- Step 3: Wait -->
    <g transform="translate(280, 50)">
      <rect width="110" height="85" rx="6" fill="#ffffff" stroke="#fca5a5"/>
      <rect x="0" y="0" width="110" height="22" rx="4" fill="#fee2e2"/>
      <text x="55" y="15" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#991b1b" text-anchor="middle">STEP 3: WAIT</text>
      <text x="55" y="45" font-family="monospace" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Wait (3.0s)</text>
      <text x="55" y="65" font-family="system-ui, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">Let pedestrian</text>
      <text x="55" y="75" font-family="system-ui, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">move out of way</text>
    </g>

    <text x="400" y="95" font-family="system-ui, sans-serif" font-size="14" fill="#94a3b8">→</text>

    <!-- Step 4: Backup -->
    <g transform="translate(410, 50)">
      <rect width="110" height="85" rx="6" fill="#ffffff" stroke="#fca5a5"/>
      <rect x="0" y="0" width="110" height="22" rx="4" fill="#fee2e2"/>
      <text x="55" y="15" font-family="system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#991b1b" text-anchor="middle">STEP 4: BACKUP</text>
      <text x="55" y="45" font-family="monospace" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">Backup (0.3m)</text>
      <text x="55" y="65" font-family="system-ui, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">Reverse out</text>
      <text x="55" y="75" font-family="system-ui, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">of cul-de-sac</text>
    </g>

    <!-- Bottom Re-try Banner -->
    <rect x="20" y="155" width="500" height="55" rx="4" fill="#ffffff" stroke="#dc2626"/>
    <text x="270" y="175" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#dc2626" text-anchor="middle">CYCLE COMPLETION: RETRY GLOBAL PATH PLANNING</text>
    <text x="270" y="195" font-family="system-ui, sans-serif" font-size="8" fill="#475569" text-anchor="middle">If recovery sequence succeeds, re-ticks Primary Navigation. If all fail -&gt; Goal Aborted.</text>
  </g>
</svg>
