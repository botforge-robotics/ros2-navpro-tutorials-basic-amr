<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <defs>
    <radialGradient id="inflationGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="1"/>
      <stop offset="35%" stop-color="#f97316" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#eab308" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05"/>
    </radialGradient>
  </defs>

  <rect width="900" height="300" rx="16" fill="#0f172a"/>
  <text x="450" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">NAV2 COSTMAP 2D: MULTI-LAYER INFLATION ANATOMY</text>

  <!-- Concentric Rings Graphic -->
  <g transform="translate(240, 160)">
    <!-- Inflation Zone (Cost 1 to 253) -->
    <circle cx="0" cy="0" r="110" fill="url(#inflationGrad)" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,4"/>
    <!-- Inscribed Radius (Cost 253: Inscribed collision) -->
    <circle cx="0" cy="0" r="60" fill="#f97316" fill-opacity="0.4" stroke="#f97316" stroke-width="2"/>
    <!-- Lethal Obstacle (Cost 254: Wall / Pillar) -->
    <rect x="-22" y="-22" width="44" height="44" rx="4" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <text x="0" y="5" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">LETHAL</text>
  </g>

  <!-- Legend & Cost Explanation -->
  <g transform="translate(480, 65)">
    <!-- Lethal Row -->
    <rect x="0" y="10" width="20" height="20" rx="4" fill="#ef4444"/>
    <text x="32" y="25" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Lethal Obstacle (Cost 254)</text>
    <text x="32" y="42" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Physical object geometry detected by LiDAR or Static Map.</text>

    <!-- Inscribed Row -->
    <rect x="0" y="65" width="20" height="20" rx="4" fill="#f97316"/>
    <text x="32" y="80" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Inscribed Collision (Cost 253)</text>
    <text x="32" y="97" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Radius equal to robot center-to-chassis boundary. Inevitable collision.</text>

    <!-- Inflation Row -->
    <rect x="0" y="120" width="20" height="20" rx="4" fill="#eab308"/>
    <text x="32" y="135" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Inflation Zone (Cost 1 - 252)</text>
    <text x="32" y="152" fill="#94a3b8" font-family="monospace" font-size="11">Cost = 253 · exp(-α · (distance - r_inscribed))</text>

    <!-- Free Space Row -->
    <rect x="0" y="175" width="20" height="20" rx="4" fill="#3b82f6" fill-opacity="0.3" stroke="#3b82f6"/>
    <text x="32" y="190" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700">Free Space (Cost 0)</text>
    <text x="32" y="207" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Safe traversable floor area where global paths prefer to plan.</text>
  </g>
</svg>
