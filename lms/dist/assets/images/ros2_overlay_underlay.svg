<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <rect width="920" height="280" rx="16" fill="#0f172a"/>
  <text x="460" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">ROS 2 ENVIRONMENT CHAINING: OVERLAY VS. UNDERLAY</text>

  <!-- Overlay Box (Top Priority) -->
  <g transform="translate(110, 58)">
    <rect width="700" height="74" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="20" y="14" width="120" height="24" rx="6" fill="#0284c7"/>
    <text x="80" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">PRIORITY 1</text>
    <text x="160" y="32" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700">WORKSPACE OVERLAY: ~/ros2_ws/install/setup.bash</text>
    <text x="160" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Custom robot nodes, user-compiled packages, interface bindings, and local overrides.</text>
  </g>

  <!-- Arrow pointing up (Overlay inherits from Underlay) -->
  <line x1="460" y1="180" x2="460" y2="135" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="455,138 465,138 460,132" fill="#38bdf8"/>
  <text x="490" y="160" fill="#64748b" font-family="monospace" font-size="11">inherits / chains onto</text>

  <!-- Underlay Box (System Core) -->
  <g transform="translate(110, 182)">
    <rect width="700" height="74" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
    <rect x="20" y="14" width="120" height="24" rx="6" fill="#475569"/>
    <text x="80" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">BASE SYSTEM</text>
    <text x="160" y="32" fill="#cbd5e1" font-family="monospace" font-size="13" font-weight="700">CORE SYSTEM UNDERLAY: /opt/ros/jazzy/setup.bash</text>
    <text x="160" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Standard ROS 2 Jazzy core distribution, Nav2 binaries, rclpy, tf2, and system messages.</text>
  </g>
</svg>
