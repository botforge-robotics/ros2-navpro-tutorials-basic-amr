<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-3%" y="-5%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Outer Canvas Card -->
  <rect width="920" height="340" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- Header Title -->
  <g transform="translate(460, 28)" text-anchor="middle">
    <rect x="-200" y="-16" width="400" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="0" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1">ROS 2 MANAGED LIFECYCLE NODE STATE MACHINE</text>
  </g>

  <!-- State 1: Unconfigured -->
  <g transform="translate(60, 108)" filter="url(#cardShadow)">
    <rect width="180" height="72" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
    <text x="90" y="34" fill="#1e293b" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Unconfigured</text>
    <text x="90" y="54" fill="#64748b" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Node created, unallocated</text>
  </g>

  <!-- Transition 1: configure() -->
  <line x1="240" y1="135" x2="360" y2="135" stroke="#0284c7" stroke-width="2"/>
  <polygon points="355,130 365,135 355,140" fill="#0284c7"/>
  <rect x="265" y="116" width="76" height="16" rx="4" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
  <text x="303" y="128" fill="#0284c7" font-family="ui-monospace, monospace" font-size="10" font-weight="800" text-anchor="middle">configure()</text>

  <!-- Transition Reverse: cleanup() -->
  <line x1="360" y1="155" x2="240" y2="155" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="245,150 235,155 245,160" fill="#94a3b8"/>
  <text x="300" y="174" fill="#64748b" font-family="ui-monospace, monospace" font-size="10" font-weight="600" text-anchor="middle">cleanup()</text>

  <!-- State 2: Inactive -->
  <g transform="translate(370, 108)" filter="url(#cardShadow)">
    <rect width="180" height="72" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <text x="90" y="34" fill="#b45309" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Inactive</text>
    <text x="90" y="54" fill="#78350f" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Configured, hold state</text>
  </g>

  <!-- Transition 2: activate() -->
  <line x1="550" y1="135" x2="670" y2="135" stroke="#059669" stroke-width="2"/>
  <polygon points="665,130 675,135 665,140" fill="#059669"/>
  <rect x="578" y="116" width="68" height="16" rx="4" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
  <text x="612" y="128" fill="#047857" font-family="ui-monospace, monospace" font-size="10" font-weight="800" text-anchor="middle">activate()</text>

  <!-- Transition Reverse: deactivate() -->
  <line x1="670" y1="155" x2="550" y2="155" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="555,150 545,155 555,160" fill="#94a3b8"/>
  <text x="610" y="174" fill="#64748b" font-family="ui-monospace, monospace" font-size="10" font-weight="600" text-anchor="middle">deactivate()</text>

  <!-- State 3: Active -->
  <g transform="translate(680, 108)" filter="url(#cardShadow)">
    <rect width="180" height="72" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="2.5"/>
    <text x="90" y="34" fill="#047857" font-family="system-ui, sans-serif" font-size="14" font-weight="800" text-anchor="middle">Active ⚡</text>
    <text x="90" y="54" fill="#065f46" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Real-time processing active</text>
  </g>

  <!-- Bottom Explanatory Banner -->
  <g transform="translate(60, 228)" filter="url(#cardShadow)">
    <rect width="800" height="72" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="24" y="28" fill="#0284c7" font-family="system-ui, sans-serif" font-size="12" font-weight="800">Role of Nav2 Lifecycle Manager:</text>
    <text x="24" y="49" fill="#334155" font-family="system-ui, sans-serif" font-size="11" font-weight="600">Guarantees deterministic bringup sequence: Map Server loads first ➔ AMCL localizes ➔ Costmaps build ➔ Planner &amp; Controller activate.</text>
  </g>
</svg>