<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <!-- Canvas Background -->
  <rect width="920" height="340" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="460" y="32" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1">NAV2 SIMPLE COMMANDER PYTHON CLIENT ARCHITECTURE</text>

  <!-- Python Script Box -->
  <g transform="translate(310, 50)">
    <rect width="300" height="60" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <text x="150" y="26" fill="#0369a1" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">🐍 BasicNavigator Python API</text>
    <text x="150" y="46" fill="#0f172a" font-family="monospace" font-size="10.5" font-weight="600" text-anchor="middle">from nav2_simple_commander.robot_navigator import BasicNavigator</text>
  </g>

  <!-- Split Connectors -->
  <line x1="460" y1="110" x2="460" y2="135" stroke="#0284c7" stroke-width="2"/>
  <line x1="230" y1="135" x2="690" y2="135" stroke="#0284c7" stroke-width="2"/>

  <line x1="230" y1="135" x2="230" y2="165" stroke="#16a34a" stroke-width="2"/>
  <polygon points="225,163 235,163 230,171" fill="#16a34a"/>

  <line x1="690" y1="135" x2="690" y2="165" stroke="#d97706" stroke-width="2"/>
  <polygon points="685,163 695,163 690,171" fill="#d97706"/>

  <!-- Left: Single Goal Action Client -->
  <g transform="translate(100, 172)">
    <rect width="260" height="85" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="130" y="26" fill="#15803d" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">goToPose(target_pose)</text>
    <text x="130" y="46" fill="#047857" font-family="monospace" font-size="10.5" font-weight="600" text-anchor="middle">Action: /navigate_to_pose</text>
    <text x="130" y="66" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" text-anchor="middle">Single Waypoint Autonomous Transit</text>
  </g>

  <!-- Right: Multi-Goal Action Client -->
  <g transform="translate(560, 172)">
    <rect width="260" height="85" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="130" y="26" fill="#b45309" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle">followWaypoints(poses)</text>
    <text x="130" y="46" fill="#92400e" font-family="monospace" font-size="10.5" font-weight="600" text-anchor="middle">Action: /follow_waypoints</text>
    <text x="130" y="66" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="500" text-anchor="middle">Continuous Route Inspection Loop</text>
  </g>

  <!-- Non-blocking feedback loops -->
  <g transform="translate(100, 275)">
    <rect width="720" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="360" y="26" fill="#0369a1" font-family="monospace" font-size="11.5" font-weight="600" text-anchor="middle">while not nav.isTaskComplete(): feedback = nav.getFeedback()  # Non-blocking async loop</text>
  </g>
</svg>
