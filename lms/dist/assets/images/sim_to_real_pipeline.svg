<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <filter id="simRealShadow" x="-2%" y="-4%" width="104%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="800" height="360" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="400" y="30" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle">SIM-TO-REAL HARDWARE DEPLOYMENT ARCHITECTURE</text>

  <!-- Left: Development Laptop / Host -->
  <g filter="url(#simRealShadow)">
    <rect x="40" y="55" width="330" height="275" rx="8" fill="#f0f9ff" stroke="#38bdf8" stroke-width="2"/>
    <rect x="40" y="55" width="330" height="32" rx="8" fill="#0284c7"/>
    <text x="205" y="77" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Developer Workstation / Cockpit (Host PC)</text>

    <!-- Component 1 -->
    <rect x="60" y="105" width="290" height="42" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <text x="205" y="131" font-family="monospace" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">RViz2 3D Visualization &amp; 2D Goal Pose</text>

    <!-- Component 2 -->
    <rect x="60" y="160" width="290" height="42" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <text x="205" y="186" font-family="monospace" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">NavPro Mission Commander (Python SDK)</text>

    <!-- Component 3 -->
    <rect x="60" y="215" width="290" height="42" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <text x="205" y="241" font-family="monospace" font-size="12" font-weight="bold" fill="#0369a1" text-anchor="middle">SSH &amp; Teleoperation Controller</text>

    <text x="205" y="295" font-family="monospace" font-size="11" font-weight="bold" fill="#0284c7" text-anchor="middle">ROS_DOMAIN_ID = 42</text>
  </g>

  <!-- Bi-directional arrows over Wi-Fi -->
  <path d="M 370 190 L 430 190" stroke="#0284c7" stroke-width="3" stroke-dasharray="5,3"/>
  <polygon points="425,185 435,190 425,195" fill="#0284c7"/>
  <polygon points="375,185 365,190 375,195" fill="#0284c7"/>
  <text x="400" y="175" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="bold" fill="#0284c7" text-anchor="middle">WiFi DDS</text>

  <!-- Right: Physical Mobile Robot (SBC + Microcontroller) -->
  <g filter="url(#simRealShadow)">
    <rect x="430" y="55" width="330" height="275" rx="8" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
    <rect x="430" y="55" width="330" height="32" rx="8" fill="#059669"/>
    <text x="595" y="77" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">Physical Robot (RPi 5 / Jetson Orin Nano)</text>

    <!-- Component 1 -->
    <rect x="450" y="105" width="290" height="42" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="595" y="131" font-family="monospace" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">Nav2 Stack (Smac Planner + DWB Controller)</text>

    <!-- Component 2 -->
    <rect x="450" y="160" width="290" height="42" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="595" y="186" font-family="monospace" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">RPLiDAR USB Driver (/dev/ttyUSB0 → /scan)</text>

    <!-- Component 3 -->
    <rect x="450" y="215" width="290" height="42" rx="6" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5"/>
    <text x="595" y="241" font-family="monospace" font-size="12" font-weight="bold" fill="#047857" text-anchor="middle">Micro-ROS / Serial Motor Driver (/cmd_vel)</text>

    <text x="595" y="295" font-family="monospace" font-size="11" font-weight="bold" fill="#059669" text-anchor="middle">ROS_DOMAIN_ID = 42</text>
  </g>
</svg>
