<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-3%" y="-5%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Outer Canvas Card -->
  <rect width="920" height="340" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- Header Title -->
  <g transform="translate(460, 28)" text-anchor="middle">
    <rect x="-195" y="-16" width="390" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="0" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1">ROS 2 COMMAND-LINE INTROSPECTION ECOSYSTEM</text>
  </g>

  <!-- Row 1: Core Communication Subsystems -->
  <g transform="translate(40, 52)">
    <!-- Box 1: ros2 node -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect width="195" height="100" rx="8" fill="#f0f9ff" stroke="#38bdf8" stroke-width="1.5"/>
      <rect width="195" height="28" rx="8" fill="#0284c7"/>
      <rect y="18" width="195" height="10" fill="#0284c7"/>
      <text x="97" y="19" fill="#ffffff" font-family="ui-monospace, monospace" font-size="12" font-weight="800" text-anchor="middle">ros2 node</text>
      <text x="16" y="52" fill="#0f172a" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">list</text>
      <text x="50" y="52" fill="#475569" font-family="system-ui, sans-serif" font-size="10">- Active nodes</text>
      <text x="16" y="72" fill="#0f172a" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">info</text>
      <text x="50" y="72" fill="#475569" font-family="system-ui, sans-serif" font-size="10">- Graph endpoints</text>
      <text x="16" y="90" fill="#0284c7" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Runtime Process Audit</text>
    </g>

    <!-- Box 2: ros2 topic -->
    <g transform="translate(215, 0)" filter="url(#cardShadow)">
      <rect width="195" height="100" rx="8" fill="#f0fdf4" stroke="#34d399" stroke-width="1.5"/>
      <rect width="195" height="28" rx="8" fill="#059669"/>
      <rect y="18" width="195" height="10" fill="#059669"/>
      <text x="97" y="19" fill="#ffffff" font-family="ui-monospace, monospace" font-size="12" font-weight="800" text-anchor="middle">ros2 topic</text>
      <text x="16" y="52" fill="#0f172a" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">echo</text>
      <text x="50" y="52" fill="#475569" font-family="system-ui, sans-serif" font-size="10">- Stream telemetry</text>
      <text x="16" y="72" fill="#0f172a" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">hz / bw</text>
      <text x="75" y="72" fill="#475569" font-family="system-ui, sans-serif" font-size="10">- Rate &amp; bandwidth</text>
      <text x="16" y="90" fill="#059669" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Continuous Data Stream</text>
    </g>

    <!-- Box 3: ros2 service -->
    <g transform="translate(430, 0)" filter="url(#cardShadow)">
      <rect width="195" height="100" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
      <rect width="195" height="28" rx="8" fill="#d97706"/>
      <rect y="18" width="195" height="10" fill="#d97706"/>
      <text x="97" y="19" fill="#ffffff" font-family="ui-monospace, monospace" font-size="12" font-weight="800" text-anchor="middle">ros2 service</text>
      <text x="16" y="52" fill="#0f172a" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">call</text>
      <text x="50" y="52" fill="#475569" font-family="system-ui, sans-serif" font-size="10">- Sync RPC trigger</text>
      <text x="16" y="72" fill="#0f172a" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">type</text>
      <text x="50" y="72" fill="#475569" font-family="system-ui, sans-serif" font-size="10">- Interface schema</text>
      <text x="16" y="90" fill="#d97706" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Request/Response RPC</text>
    </g>

    <!-- Box 4: ros2 action -->
    <g transform="translate(645, 0)" filter="url(#cardShadow)">
      <rect width="195" height="100" rx="8" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
      <rect width="195" height="28" rx="8" fill="#7c3aed"/>
      <rect y="18" width="195" height="10" fill="#7c3aed"/>
      <text x="97" y="19" fill="#ffffff" font-family="ui-monospace, monospace" font-size="12" font-weight="800" text-anchor="middle">ros2 action</text>
      <text x="16" y="52" fill="#0f172a" font-family="ui-monospace, monospace" font-size="10" font-weight="700">send_goal</text>
      <text x="85" y="52" fill="#475569" font-family="system-ui, sans-serif" font-size="10">- Async mission</text>
      <text x="16" y="72" fill="#0f172a" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">info</text>
      <text x="50" y="72" fill="#475569" font-family="system-ui, sans-serif" font-size="10">- Servers &amp; clients</text>
      <text x="16" y="90" fill="#7c3aed" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Long-running Navigation</text>
    </g>
  </g>

  <!-- Row 2: Configuration & Diagnostics Subsystems -->
  <g transform="translate(40, 172)">
    <!-- Box 5: ros2 param -->
    <g transform="translate(0, 0)" filter="url(#cardShadow)">
      <rect width="195" height="95" rx="8" fill="#fdf2f8" stroke="#f472b6" stroke-width="1.5"/>
      <rect width="195" height="26" rx="8" fill="#db2777"/>
      <rect y="16" width="195" height="10" fill="#db2777"/>
      <text x="97" y="18" fill="#ffffff" font-family="ui-monospace, monospace" font-size="12" font-weight="800" text-anchor="middle">ros2 param</text>
      <text x="16" y="48" fill="#0f172a" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">get / set</text>
      <text x="75" y="48" fill="#475569" font-family="system-ui, sans-serif" font-size="10">- Hot reload</text>
      <text x="16" y="68" fill="#0f172a" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">dump</text>
      <text x="55" y="68" fill="#475569" font-family="system-ui, sans-serif" font-size="10">- Save YAML</text>
      <text x="16" y="86" fill="#db2777" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Dynamic Tuning</text>
    </g>

    <!-- Box 6: ros2 bag -->
    <g transform="translate(215, 0)" filter="url(#cardShadow)">
      <rect width="195" height="95" rx="8" fill="#ecfeff" stroke="#22d3ee" stroke-width="1.5"/>
      <rect width="195" height="26" rx="8" fill="#0891b2"/>
      <rect y="16" width="195" height="10" fill="#0891b2"/>
      <text x="97" y="18" fill="#ffffff" font-family="ui-monospace, monospace" font-size="12" font-weight="800" text-anchor="middle">ros2 bag</text>
      <text x="16" y="48" fill="#0f172a" font-family="ui-monospace, monospace" font-size="10" font-weight="700">record -a</text>
      <text x="80" y="48" fill="#475569" font-family="system-ui, sans-serif" font-size="10">- Flight logs</text>
      <text x="16" y="68" fill="#0f172a" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">play</text>
      <text x="50" y="68" fill="#475569" font-family="system-ui, sans-serif" font-size="10">- Deterministic rerun</text>
      <text x="16" y="86" fill="#0891b2" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Blackbox Telemetry</text>
    </g>

    <!-- Box 7: ros2 daemon -->
    <g transform="translate(430, 0)" filter="url(#cardShadow)">
      <rect width="195" height="95" rx="8" fill="#faf5ff" stroke="#d8b4fe" stroke-width="1.5"/>
      <rect width="195" height="26" rx="8" fill="#9333ea"/>
      <rect y="16" width="195" height="10" fill="#9333ea"/>
      <text x="97" y="18" fill="#ffffff" font-family="ui-monospace, monospace" font-size="12" font-weight="800" text-anchor="middle">ros2 daemon</text>
      <text x="16" y="48" fill="#0f172a" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">status</text>
      <text x="60" y="48" fill="#475569" font-family="system-ui, sans-serif" font-size="10">- DDS cache state</text>
      <text x="16" y="68" fill="#0f172a" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">stop</text>
      <text x="50" y="68" fill="#475569" font-family="system-ui, sans-serif" font-size="10">- Flush ghosts</text>
      <text x="16" y="86" fill="#9333ea" font-family="system-ui, sans-serif" font-size="9" font-weight="700">DDS Background Cache</text>
    </g>

    <!-- Box 8: ros2 doctor -->
    <g transform="translate(645, 0)" filter="url(#cardShadow)">
      <rect width="195" height="95" rx="8" fill="#f0fdf4" stroke="#6ee7b7" stroke-width="1.5"/>
      <rect width="195" height="26" rx="8" fill="#047857"/>
      <rect y="16" width="195" height="10" fill="#047857"/>
      <text x="97" y="18" fill="#ffffff" font-family="ui-monospace, monospace" font-size="12" font-weight="800" text-anchor="middle">ros2 doctor</text>
      <text x="16" y="48" fill="#0f172a" font-family="ui-monospace, monospace" font-size="10" font-weight="700">--report</text>
      <text x="75" y="48" fill="#475569" font-family="system-ui, sans-serif" font-size="10">- Network check</text>
      <text x="16" y="68" fill="#0f172a" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">hello</text>
      <text x="55" y="68" fill="#475569" font-family="system-ui, sans-serif" font-size="10">- DDS connectivity</text>
      <text x="16" y="86" fill="#047857" font-family="system-ui, sans-serif" font-size="9" font-weight="700">Diagnostics &amp; Health</text>
    </g>
  </g>

  <!-- Bottom Tip -->
  <g transform="translate(40, 284)">
    <rect width="840" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="420" y="22" fill="#0284c7" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">💡 Tip: Append --help to any command (e.g. ros2 topic echo --help) to see flags, filters, and formats.</text>
  </g>
</svg>