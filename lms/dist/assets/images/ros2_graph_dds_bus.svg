<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%">
  <rect width="920" height="320" rx="16" fill="#0f172a"/>
  <text x="460" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">ROS 2 DECENTRALIZED COMPUTATIONAL GRAPH &amp; DDS BUS</text>

  <!-- Node 1: Sensor -->
  <g transform="translate(80, 70)">
    <rect width="220" height="70" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="110" y="30" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">Node: /camera_node</text>
    <text x="110" y="50" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Publishes: /camera/image_raw</text>
  </g>

  <!-- Node 2: Detector -->
  <g transform="translate(620, 70)">
    <rect width="220" height="70" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="110" y="30" fill="#10b981" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">Node: /detector_node</text>
    <text x="110" y="50" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Subscribes &amp; Computes BBoxes</text>
  </g>

  <!-- DDS Bus Central Pipe -->
  <g transform="translate(80, 180)">
    <rect width="760" height="46" rx="8" fill="#1e1e38" stroke="#8b5cf6" stroke-width="2"/>
    <text x="380" y="28" fill="#c084fc" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚡ DDS Communication Bus (Peer-to-Peer / Zero Central Bottleneck)</text>
  </g>

  <!-- Vertical Connectors -->
  <line x1="190" y1="140" x2="190" y2="180" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="185,178 195,178 190,186" fill="#38bdf8"/>

  <line x1="730" y1="180" x2="730" y2="140" stroke="#10b981" stroke-width="2"/>
  <polygon points="725,142 735,142 730,134" fill="#10b981"/>

  <!-- Node 3: Planner below DDS -->
  <g transform="translate(350, 246)">
    <rect width="220" height="60" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="110" y="26" fill="#f59e0b" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">Node: /planner_node</text>
    <text x="110" y="44" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Consumes Telemetry &amp; Plans Paths</text>
  </g>

  <line x1="460" y1="226" x2="460" y2="246" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="455,244 465,244 460,250" fill="#f59e0b"/>
</svg>
