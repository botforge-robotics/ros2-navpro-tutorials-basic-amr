<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <rect width="900" height="320" rx="16" fill="#0f172a"/>

  <text x="450" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">DIFFERENTIAL DRIVE ROBOT FORWARD KINEMATICS</text>

  <!-- Robot Top-Down Graphic -->
  <g transform="translate(140, 70)">
    <!-- Chassis -->
    <rect x="60" y="30" width="140" height="150" rx="20" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="130" cy="50" r="16" fill="#38bdf8" opacity="0.3"/>
    <text x="130" y="55" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">FRONT</text>

    <!-- Front Castor Wheel -->
    <rect x="122" y="34" width="16" height="24" rx="4" fill="#64748b"/>

    <!-- Left Wheel -->
    <rect x="36" y="110" width="24" height="60" rx="6" fill="#f59e0b"/>
    <text x="24" y="145" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold" text-anchor="end">v_L</text>
    <path d="M 48 105 L 48 85" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>

    <!-- Right Wheel -->
    <rect x="200" y="110" width="24" height="60" rx="6" fill="#10b981"/>
    <text x="236" y="145" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold">v_R</text>
    <path d="M 212 105 L 212 85" stroke="#10b981" stroke-width="2"/>

    <!-- Track Width L -->
    <line x1="48" y1="180" x2="212" y2="180" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="130" y="196" fill="#94a3b8" font-family="monospace" font-size="11" text-anchor="middle">Track Width: L</text>

    <!-- Center of Axle (Origin) -->
    <circle cx="130" cy="140" r="6" fill="#ef4444"/>
    <text x="130" y="130" fill="#ef4444" font-family="monospace" font-size="9" text-anchor="middle">(x, y, θ)</text>

    <!-- Linear Velocity Vector -->
    <line x1="130" y1="140" x2="130" y2="70" stroke="#ef4444" stroke-width="3"/>
    <polygon points="130,65 125,75 135,75" fill="#ef4444"/>
    <text x="145" y="90" fill="#ef4444" font-family="monospace" font-size="13" font-weight="bold">v</text>

    <!-- Angular Velocity Curve -->
    <path d="M 160 140 A 30 30 0 0 0 130 110" fill="none" stroke="#a855f7" stroke-width="2.5"/>
    <polygon points="130,110 136,116 136,104" fill="#a855f7"/>
    <text x="165" y="125" fill="#a855f7" font-family="monospace" font-size="13" font-weight="bold">ω</text>
  </g>

  <!-- Math Formulation Equations Box -->
  <g transform="translate(480, 70)">
    <rect width="360" height="210" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="24" y="32" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">1. Forward Kinematics (Wheel to Body):</text>
    <text x="36" y="58" fill="#e2e8f0" font-family="monospace" font-size="13">v = (v_R + v_L) / 2</text>
    <text x="36" y="82" fill="#e2e8f0" font-family="monospace" font-size="13">ω = (v_R - v_L) / L</text>

    <text x="24" y="114" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700">2. Inverse Kinematics (Body to Wheel):</text>
    <text x="36" y="140" fill="#f59e0b" font-family="monospace" font-size="13">v_L = v - (ω · L) / 2</text>
    <text x="36" y="164" fill="#10b981" font-family="monospace" font-size="13">v_R = v + (ω · L) / 2</text>

    <text x="24" y="194" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11">Where wheel speed: v_i = ω_wheel · R_radius</text>
  </g>
</svg>
