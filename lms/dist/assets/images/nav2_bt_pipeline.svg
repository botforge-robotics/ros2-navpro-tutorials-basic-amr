<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <rect width="900" height="320" rx="16" fill="#0f172a"/>
  <text x="450" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">NAV2 BEHAVIOR TREE (BT) RECOVERY &amp; NAVIGATION PIPELINE</text>

  <!-- Root Sequence -->
  <g transform="translate(370, 55)">
    <rect width="160" height="42" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="80" y="26" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">Sequence (->)</text>
  </g>

  <!-- Children -->
  <!-- ComputePathToPose -->
  <g transform="translate(100, 140)">
    <rect width="180" height="45" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="90" y="22" fill="#10b981" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">ComputePathToPose</text>
    <text x="90" y="37" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Global Smac/NavFn</text>
  </g>

  <!-- FollowPath -->
  <g transform="translate(360, 140)">
    <rect width="180" height="45" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="90" y="22" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">FollowPath (DWB)</text>
    <text x="90" y="37" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Local Controller 20Hz</text>
  </g>

  <!-- Recovery Fallback -->
  <g transform="translate(620, 140)">
    <rect width="180" height="45" rx="8" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="90" y="22" fill="#f87171" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Recovery Fallback (?)</text>
    <text x="90" y="37" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Triggered on Failure</text>
  </g>

  <!-- Lines from Root -->
  <line x1="410" y1="97" x2="190" y2="140" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="450" y1="97" x2="450" y2="140" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="490" y1="97" x2="710" y2="140" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Sub-Recoveries -->
  <g transform="translate(530, 230)">
    <rect width="110" height="36" rx="6" fill="#1e293b" stroke="#f43f5e"/>
    <text x="55" y="22" fill="#f43f5e" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">ClearCostmap</text>
  </g>
  <g transform="translate(660, 230)">
    <rect width="100" height="36" rx="6" fill="#1e293b" stroke="#f43f5e"/>
    <text x="50" y="22" fill="#f43f5e" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">BackUp (0.3m)</text>
  </g>
  <g transform="translate(780, 230)">
    <rect width="90" height="36" rx="6" fill="#1e293b" stroke="#f43f5e"/>
    <text x="45" y="22" fill="#f43f5e" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">Spin (360°)</text>
  </g>

  <line x1="710" y1="185" x2="585" y2="230" stroke="#ef4444" stroke-width="1.2"/>
  <line x1="710" y1="185" x2="710" y2="230" stroke="#ef4444" stroke-width="1.2"/>
  <line x1="710" y1="185" x2="825" y2="230" stroke="#ef4444" stroke-width="1.2"/>

  <text x="450" y="300" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Status Flow: SUCCESS (Green) continues to next node; FAILURE (Red) trips fallback recovery behaviors.</text>
</svg>
