<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070c18" />
      <stop offset="50%" stop-color="#0b1326" />
      <stop offset="100%" stop-color="#080e1c" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style><![CDATA[
      /* Keyframe animations for SLAM Loop Closure Cycle */
      @keyframes robotMove {
        0% { transform: translate(140px, 340px) rotate(0deg); opacity: 1; }
        25% { transform: translate(140px, 140px) rotate(-90deg); opacity: 1; }
        50% { transform: translate(820px, 140px) rotate(0deg); opacity: 1; }
        75% { transform: translate(820px, 340px) rotate(90deg); opacity: 1; }
        90% { transform: translate(240px, 340px) rotate(180deg); opacity: 1; }
        100% { transform: translate(140px, 340px) rotate(180deg); opacity: 1; }
      }

      @keyframes driftWave {
        0%, 30% { transform: translate(0px, 0px); opacity: 0.3; }
        50%, 75% { transform: translate(25px, -35px); opacity: 0.9; }
        85%, 100% { transform: translate(0px, 0px); opacity: 0.3; }
      }

      @keyframes loopClosurePulse {
        0%, 65% { opacity: 0; stroke-dashoffset: 100; transform: scaleY(0.9); }
        70% { opacity: 1; stroke-dashoffset: 0; }
        85% { opacity: 1; stroke-width: 4px; }
        95%, 100% { opacity: 0; }
      }

      @keyframes snapCorrect {
        0%, 70% { transform: rotate(0deg); }
        80% { transform: rotate(-3.5deg) translate(-12px, 8px); }
        90%, 100% { transform: rotate(0deg) translate(0px, 0px); }
      }

      @keyframes pulseText {
        0%, 25% { opacity: 1; }
        26%, 100% { opacity: 0; }
      }
      @keyframes textPhase2 {
        0%, 26% { opacity: 0; }
        27%, 65% { opacity: 1; }
        66%, 100% { opacity: 0; }
      }
      @keyframes textPhase3 {
        0%, 66% { opacity: 0; }
        67%, 100% { opacity: 1; }
      }

      .animated-robot {
        animation: robotMove 12s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .drift-path {
        animation: driftWave 12s ease-in-out infinite;
      }
      .loop-constraint-line {
        stroke-dasharray: 8, 4;
        animation: loopClosurePulse 12s ease-in-out infinite;
      }
      .snap-wall {
        animation: snapCorrect 12s cubic-bezier(0.34, 1.56, 0.64, 1) infinite;
      }
      .phase-text-1 { animation: pulseText 12s infinite; }
      .phase-text-2 { animation: textPhase2 12s infinite; }
      .phase-text-3 { animation: textPhase3 12s infinite; }
    ]]></style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="540" fill="url(#bgGrad)" rx="16" />
  <rect width="996" height="536" x="2" y="2" fill="none" stroke="#1e293b" stroke-width="2" rx="15" />

  <!-- Grid Pattern -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="80" x2="1000" y2="80" />
    <line x1="0" y1="160" x2="1000" y2="160" />
    <line x1="0" y1="240" x2="1000" y2="240" />
    <line x1="0" y1="320" x2="1000" y2="320" />
    <line x1="0" y1="400" x2="1000" y2="400" />
    <line x1="160" y1="0" x2="160" y2="540" />
    <line x1="320" y1="0" x2="320" y2="540" />
    <line x1="480" y1="0" x2="480" y2="540" />
    <line x1="640" y1="0" x2="640" y2="540" />
    <line x1="800" y1="0" x2="800" y2="540" />
  </g>

  <!-- Title & Algorithm Header -->
  <g transform="translate(50, 42)">
    <rect x="0" y="-12" width="180" height="26" rx="6" fill="rgba(14, 165, 233, 0.15)" stroke="#0ea5e9" stroke-width="1" />
    <text x="90" y="5" text-anchor="middle" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" letter-spacing="0.5px">
      POSE GRAPH SLAM ENGINE
    </text>
    <text x="195" y="6" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="800">
      Ceres Non-Linear Optimization &amp; Loop Closure Dynamics
    </text>
    <text x="0" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">
      Watch accumulated dead-reckoning drift correct as Ceres scan-matching binds Pose N back to Pose 0
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- WAREHOUSE RECTANGULAR CORRIDOR & GRAPH SLAM NODES                         -->
  <!-- ========================================================================= -->
  <!-- Outer True Wall Boundaries -->
  <g class="snap-wall" transform-origin="480px 240px">
    <rect x="90" y="90" width="820" height="300" rx="6" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="8,6" opacity="0.6" />
    <rect x="180" y="180" width="640" height="120" rx="6" fill="none" stroke="#334155" stroke-width="4" stroke-dasharray="8,6" opacity="0.6" />
    <text x="500" y="112" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11" font-weight="700">TRUE WAREHOUSE WALL GEOMETRY (METRIC GROUND-TRUTH)</text>
  </g>

  <!-- Drifted Trajectory Trace (Amber dashed line) -->
  <g class="drift-path">
    <path d="M 140,340 L 140,140 L 820,120 L 845,360 L 220,375" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,4" />
    <!-- Drift error annotation -->
    <g transform="translate(620, 390)">
      <rect x="-10" y="-14" width="220" height="24" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
      <text x="100" y="3" text-anchor="middle" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11" font-weight="700">
        ⚠️ Cumulative Odometry Drift: ε(x, y, θ)
      </text>
    </g>
  </g>

  <!-- True Optimizing Trajectory Trace (Cyan solid line) -->
  <path d="M 140,340 L 140,140 L 820,140 L 820,340 L 140,340" fill="none" stroke="#0ea5e9" stroke-width="2.5" opacity="0.5" />

  <!-- Pose Graph Nodes along loop -->
  <!-- Pose 0 (Origin) -->
  <g transform="translate(140, 340)">
    <circle r="16" fill="#0f172a" stroke="#10b981" stroke-width="3" filter="url(#glowGreen)" />
    <circle r="6" fill="#10b981" />
    <text x="-25" y="30" fill="#34d399" font-family="ui-monospace, monospace" font-size="11" font-weight="800">Pose 0 [Start]</text>
  </g>

  <!-- Pose 1 (Corner 1) -->
  <g transform="translate(140, 140)">
    <circle r="12" fill="#0f172a" stroke="#0ea5e9" stroke-width="2" />
    <circle r="4" fill="#38bdf8" />
    <text x="-40" y="-18" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="10.5">Pose 1</text>
  </g>

  <!-- Pose 2 (Corner 2) -->
  <g transform="translate(820, 140)">
    <circle r="12" fill="#0f172a" stroke="#0ea5e9" stroke-width="2" />
    <circle r="4" fill="#38bdf8" />
    <text x="18" y="-18" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="10.5">Pose 2</text>
  </g>

  <!-- Pose 3 (Corner 3) -->
  <g transform="translate(820, 340)">
    <circle r="12" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
    <circle r="4" fill="#fbbf24" />
    <text x="18" y="24" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="10.5">Pose 3 [Drifting]</text>
  </g>

  <!-- Pose N (Loop Return) -->
  <g transform="translate(220, 340)">
    <circle r="14" fill="#0f172a" stroke="#a855f7" stroke-width="2.5" />
    <circle r="5" fill="#c084fc" />
    <text x="-15" y="32" fill="#c084fc" font-family="ui-monospace, monospace" font-size="11" font-weight="800">Pose N</text>
  </g>

  <!-- Ceres Loop Closure Constraint Arc (Spring relaxation) -->
  <path d="M 220,340 C 200,310 160,310 140,340" fill="none" stroke="#10b981" stroke-width="3.5" class="loop-constraint-line" filter="url(#glowGreen)" />
  <g transform="translate(180, 290)">
    <rect x="-80" y="-14" width="160" height="26" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5" class="loop-constraint-line" />
    <text x="0" y="4" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11" font-weight="900" class="loop-constraint-line">
      ⚡ LOOP CLOSURE EDGE
    </text>
  </g>

  <!-- Active AMR Robot Model moving dynamically -->
  <g class="animated-robot">
    <!-- Robot Chassis -->
    <rect x="-18" y="-14" width="36" height="28" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1.8" />
    <!-- Wheels -->
    <rect x="-10" y="-18" width="20" height="4" rx="2" fill="#0f172a" stroke="#94a3b8" />
    <rect x="-10" y="14" width="20" height="4" rx="2" fill="#0f172a" stroke="#94a3b8" />
    <!-- LiDAR Beams Sweeping -->
    <circle cx="0" cy="0" r="5" fill="#ef4444" filter="url(#glowRed)" />
    <path d="M 0,0 L 40,-25 L 40,25 Z" fill="rgba(56, 189, 248, 0.25)" stroke="#38bdf8" stroke-width="1" />
  </g>

  <!-- ========================================================================= -->
  <!-- INTERACTIVE CYCLE STATUS STRIP (BOTTOM)                                    -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 445)">
    <rect width="900" height="65" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />

    <!-- Phase 1 Text -->
    <g class="phase-text-1" transform="translate(25, 38)">
      <circle cx="0" cy="-6" r="6" fill="#38bdf8" />
      <text x="18" y="-2" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="13" font-weight="700">
        Phase 1: Local Odometry Integration &amp; Dead-Reckoning
      </text>
      <text x="440" y="-2" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">
        Wheel encoders + IMU compute incremental Δx, Δy. Slippage slowly accumulates spatial drift.
      </text>
    </g>

    <!-- Phase 2 Text -->
    <g class="phase-text-2" transform="translate(25, 38)">
      <circle cx="0" cy="-6" r="6" fill="#f59e0b" />
      <text x="18" y="-2" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="13" font-weight="700">
        Phase 2: Ceres Correlative Scan-Matching &amp; Loop Detection
      </text>
      <text x="440" y="-2" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">
        LiDAR scan at Pose N matches historical scan from Pose 0. Ceres builds a loop closure edge.
      </text>
    </g>

    <!-- Phase 3 Text -->
    <g class="phase-text-3" transform="translate(25, 38)">
      <circle cx="0" cy="-6" r="6" fill="#10b981" />
      <text x="18" y="-2" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="700">
        Phase 3: Non-Linear Least Squares Relaxation: Map Snaps Straight!
      </text>
      <text x="440" y="-2" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">
        Solver minimizes residual error Σ e_ij^T Ω_ij e_ij, pulling bent walls back into metric square truth.
      </text>
    </g>
  </g>
</svg>
