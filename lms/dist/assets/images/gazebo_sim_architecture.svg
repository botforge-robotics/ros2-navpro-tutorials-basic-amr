<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-3%" y="-5%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Outer Canvas Card -->
  <rect width="920" height="340" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- Header Title -->
  <g transform="translate(460, 28)" text-anchor="middle">
    <rect x="-215" y="-16" width="430" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="0" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1">GAZEBO PHYSICS SIMULATION &amp; ROS 2 BRIDGE ARCHITECTURE</text>
  </g>

  <!-- Level 1: ROS 2 Bus (Top) -->
  <g transform="translate(100, 52)" filter="url(#cardShadow)">
    <rect width="720" height="58" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <rect x="16" y="15" width="140" height="28" rx="6" fill="#0284c7"/>
    <text x="86" y="33" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">ROS 2 DDS BUS</text>
    <text x="180" y="34" fill="#0369a1" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Topics: /cmd_vel (Commands)  &lt;====&gt;  /odom, /scan, /imu (Telemetry)</text>
  </g>

  <!-- Bidirectional arrows to gzserver -->
  <g transform="translate(430, 110)">
    <line x1="0" y1="0" x2="0" y2="46" stroke="#059669" stroke-width="2.5"/>
    <polygon points="-5,8 5,8 0,0" fill="#059669"/>
    <polygon points="-5,38 5,38 0,46" fill="#059669"/>
    <rect x="12" y="12" width="150" height="20" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1"/>
    <text x="87" y="26" fill="#047857" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">gazebo_ros_pkgs Plugins</text>
  </g>

  <!-- Level 2: GZSERVER Physics Engine -->
  <g transform="translate(100, 156)" filter="url(#cardShadow)">
    <rect width="720" height="72" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
    <rect x="16" y="17" width="120" height="38" rx="6" fill="#d97706"/>
    <text x="76" y="41" fill="#ffffff" font-family="ui-monospace, monospace" font-size="12" font-weight="800" text-anchor="middle">GZSERVER</text>
    <text x="160" y="34" fill="#b45309" font-family="system-ui, sans-serif" font-size="12" font-weight="800">ODE / Bullet Rigid-Body Physics Engine (1000 Hz Integration)</text>
    <text x="160" y="54" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5">Surface contact friction (mu1/mu2), motor inertia, gravity -9.81 m/s², ray-tracing LiDAR</text>
  </g>

  <!-- Arrow down to GZCLIENT -->
  <g transform="translate(460, 228)">
    <line x1="0" y1="0" x2="0" y2="30" stroke="#7c3aed" stroke-width="2"/>
    <polygon points="-5,22 5,22 0,30" fill="#7c3aed"/>
    <rect x="12" y="6" width="130" height="18" rx="9" fill="#ffffff" stroke="#ddd6fe" stroke-width="1"/>
    <text x="77" y="19" fill="#6d28d9" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">OpenGL Scene Graph</text>
  </g>

  <!-- Level 3: GZCLIENT GUI -->
  <g transform="translate(100, 260)" filter="url(#cardShadow)">
    <rect width="720" height="58" rx="10" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="16" y="15" width="120" height="28" rx="6" fill="#7c3aed"/>
    <text x="76" y="33" fill="#ffffff" font-family="ui-monospace, monospace" font-size="12" font-weight="800" text-anchor="middle">GZCLIENT</text>
    <text x="160" y="35" fill="#475569" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600">Interactive Qt 3D Viewport GUI (Robot Model, Shadows, Sensor Rays, Orbit Camera)</text>
  </g>
</svg>