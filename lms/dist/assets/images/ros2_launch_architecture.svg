<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-3%" y="-5%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Outer Canvas Card -->
  <rect width="920" height="340" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- Header Title -->
  <g transform="translate(460, 28)" text-anchor="middle">
    <rect x="-195" y="-16" width="390" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="0" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1">ROS 2 PYTHON LAUNCH SYSTEM EXECUTION ARCHITECTURE</text>
  </g>

  <!-- Root: LaunchDescription -->
  <g transform="translate(300, 48)" filter="url(#cardShadow)">
    <rect width="320" height="56" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <text x="160" y="25" fill="#0369a1" font-family="ui-monospace, monospace" font-size="13.5" font-weight="800" text-anchor="middle">generate_launch_description()</text>
    <text x="160" y="43" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Returns: LaunchDescription([actions...])</text>
  </g>

  <!-- Connector branches -->
  <line x1="460" y1="104" x2="460" y2="135" stroke="#0284c7" stroke-width="2"/>
  <line x1="160" y1="135" x2="760" y2="135" stroke="#0284c7" stroke-width="2"/>

  <line x1="160" y1="135" x2="160" y2="165" stroke="#0284c7" stroke-width="2"/>
  <polygon points="155,163 165,163 160,171" fill="#0284c7"/>

  <line x1="460" y1="135" x2="460" y2="165" stroke="#0284c7" stroke-width="2"/>
  <polygon points="455,163 465,163 460,171" fill="#0284c7"/>

  <line x1="760" y1="135" x2="760" y2="165" stroke="#0284c7" stroke-width="2"/>
  <polygon points="755,163 765,163 760,171" fill="#0284c7"/>

  <!-- Action 1: DeclareLaunchArgument (Amber) -->
  <g transform="translate(55, 172)" filter="url(#cardShadow)">
    <rect width="210" height="94" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <rect width="210" height="24" rx="8" fill="#fef3c7"/>
    <rect y="14" width="210" height="10" fill="#fef3c7"/>
    <text x="105" y="17" fill="#b45309" font-family="ui-monospace, monospace" font-size="11" font-weight="800" text-anchor="middle">DeclareLaunchArgument</text>
    <text x="14" y="43" fill="#1e293b" font-family="ui-monospace, monospace" font-size="10" font-weight="600">name: 'use_sim_time'</text>
    <text x="14" y="60" fill="#475569" font-family="ui-monospace, monospace" font-size="9.5">default_value: 'true'</text>
    <text x="14" y="78" fill="#b45309" font-family="system-ui, sans-serif" font-size="9" font-weight="700">CLI runtime argument flag</text>
  </g>

  <!-- Action 2: Node Action (Driver - Emerald) -->
  <g transform="translate(355, 172)" filter="url(#cardShadow)">
    <rect width="210" height="94" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
    <rect width="210" height="24" rx="8" fill="#dcfce7"/>
    <rect y="14" width="210" height="10" fill="#dcfce7"/>
    <text x="105" y="17" fill="#047857" font-family="ui-monospace, monospace" font-size="11" font-weight="800" text-anchor="middle">Node Action (Driver)</text>
    <text x="14" y="43" fill="#1e293b" font-family="ui-monospace, monospace" font-size="10" font-weight="600">package: 'nexus_amr_basics'</text>
    <text x="14" y="60" fill="#475569" font-family="ui-monospace, monospace" font-size="9.5">executable: 'motor_driver'</text>
    <text x="14" y="78" fill="#047857" font-family="system-ui, sans-serif" font-size="9" font-weight="700">output: 'screen' (STDOUT)</text>
  </g>

  <!-- Action 3: Node Action (Limiter / Remap - Purple) -->
  <g transform="translate(655, 172)" filter="url(#cardShadow)">
    <rect width="210" height="94" rx="8" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect width="210" height="24" rx="8" fill="#ede9fe"/>
    <rect y="14" width="210" height="10" fill="#ede9fe"/>
    <text x="105" y="17" fill="#6d28d9" font-family="ui-monospace, monospace" font-size="11" font-weight="800" text-anchor="middle">Node Action + Remap</text>
    <text x="14" y="43" fill="#1e293b" font-family="ui-monospace, monospace" font-size="10" font-weight="600">executable: 'teleop_limiter'</text>
    <text x="14" y="60" fill="#475569" font-family="ui-monospace, monospace" font-size="9.5">parameters: [yaml_config]</text>
    <text x="14" y="78" fill="#6d28d9" font-family="ui-monospace, monospace" font-size="9" font-weight="700">remappings: [('/cmd_vel', ...)]</text>
  </g>

  <!-- Bottom Tip Banner -->
  <g transform="translate(55, 282)">
    <rect width="810" height="34" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="405" y="22" fill="#0284c7" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" text-anchor="middle">💡 Dynamic Python scripts allow programmatic os.path resolution, LaunchConfiguration substitutions, and nested Includes.</text>
  </g>
</svg>