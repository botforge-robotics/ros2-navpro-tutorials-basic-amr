<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-3%" y="-5%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Outer Canvas Card -->
  <rect width="920" height="380" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- Header Title -->
  <g transform="translate(460, 28)" text-anchor="middle">
    <rect x="-200" y="-16" width="400" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="0" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1">NAV2 SERVER SUBSYSTEM &amp; COSTMAP ARCHITECTURE</text>
  </g>

  <!-- BT Navigator Central Brain -->
  <g transform="translate(330, 48)" filter="url(#cardShadow)">
    <rect width="260" height="58" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <text x="130" y="26" fill="#0369a1" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">🧠 BT Navigator</text>
    <text x="130" y="45" fill="#475569" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Behavior Tree XML Execution Engine</text>
  </g>

  <!-- Connection Lines from BT Navigator to Servers -->
  <line x1="460" y1="106" x2="460" y2="135" stroke="#0284c7" stroke-width="2"/>
  <line x1="200" y1="135" x2="720" y2="135" stroke="#0284c7" stroke-width="2"/>

  <line x1="200" y1="135" x2="200" y2="160" stroke="#0284c7" stroke-width="2"/>
  <polygon points="195,158 205,158 200,166" fill="#0284c7"/>

  <line x1="460" y1="135" x2="460" y2="160" stroke="#0284c7" stroke-width="2"/>
  <polygon points="455,158 465,158 460,166" fill="#0284c7"/>

  <line x1="720" y1="135" x2="720" y2="160" stroke="#0284c7" stroke-width="2"/>
  <polygon points="715,158 725,158 720,166" fill="#0284c7"/>

  <!-- Server 1: Planner Server -->
  <g transform="translate(80, 168)" filter="url(#cardShadow)">
    <rect width="240" height="76" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
    <text x="120" y="26" fill="#047857" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Planner Server</text>
    <text x="120" y="46" fill="#1e293b" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Global Path: NavFn / Smac 2D / A*</text>
    <text x="120" y="63" fill="#047857" font-family="ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="middle">nav2_msgs/ComputePathToPose</text>
  </g>

  <!-- Server 2: Controller Server -->
  <g transform="translate(340, 168)" filter="url(#cardShadow)">
    <rect width="240" height="76" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="120" y="26" fill="#b45309" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Controller Server</text>
    <text x="120" y="46" fill="#1e293b" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Local Path Tracking: DWB / RPP</text>
    <text x="120" y="63" fill="#b45309" font-family="ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="middle">Publishes: /cmd_vel (20 Hz)</text>
  </g>

  <!-- Server 3: Behavior / Recovery Server -->
  <g transform="translate(600, 168)" filter="url(#cardShadow)">
    <rect width="240" height="76" rx="10" fill="#fff1f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="120" y="26" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="13" font-weight="800" text-anchor="middle">Behavior Server</text>
    <text x="120" y="46" fill="#1e293b" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Recoveries: Spin, BackUp, Wait</text>
    <text x="120" y="63" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Clears costmaps when stuck</text>
  </g>

  <!-- Connections down to Costmaps -->
  <line x1="200" y1="244" x2="200" y2="282" stroke="#10b981" stroke-width="2"/>
  <polygon points="195,280 205,280 200,288" fill="#10b981"/>

  <line x1="460" y1="244" x2="460" y2="282" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="455,280 465,280 460,288" fill="#f59e0b"/>

  <!-- Costmap 1: Global Costmap -->
  <g transform="translate(80, 288)" filter="url(#cardShadow)">
    <rect width="240" height="66" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
    <text x="120" y="24" fill="#047857" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Global Costmap</text>
    <text x="120" y="43" fill="#475569" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Static warehouse map + static inflation</text>
    <text x="120" y="57" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Full Facility Dimensions</text>
  </g>

  <!-- Costmap 2: Local Costmap -->
  <g transform="translate(340, 288)" filter="url(#cardShadow)">
    <rect width="240" height="66" rx="8" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="120" y="24" fill="#b45309" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Local Costmap</text>
    <text x="120" y="43" fill="#475569" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Rolling window 3x3m + obstacle layer</text>
    <text x="120" y="57" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Dynamic Obstacle Clearing (LiDAR)</text>
  </g>

  <!-- Sensor Input Callout -->
  <g transform="translate(600, 288)" filter="url(#cardShadow)">
    <rect width="240" height="66" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="120" y="24" fill="#0284c7" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Sensor Inputs (/scan, /tf)</text>
    <text x="120" y="43" fill="#475569" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">2D LiDAR laser scan updates</text>
    <text x="120" y="57" fill="#0284c7" font-family="system-ui, sans-serif" font-size="9" font-weight="700" text-anchor="middle">Feeds live obstacles into Local Costmap</text>
  </g>
</svg>