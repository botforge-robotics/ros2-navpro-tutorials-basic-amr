<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" width="100%" height="100%">
  <rect width="920" height="380" rx="16" fill="#0f172a"/>
  <text x="460" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">NAV2 SERVER SUBSYSTEM &amp; COSTMAP ARCHITECTURE</text>

  <!-- BT Navigator Central Brain -->
  <g transform="translate(330, 50)">
    <rect width="260" height="56" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="130" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">🧠 BT Navigator</text>
    <text x="130" y="44" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Behavior Tree XML Execution Engine</text>
  </g>

  <!-- Connection Lines from BT Navigator to Servers -->
  <line x1="460" y1="106" x2="460" y2="135" stroke="#38bdf8" stroke-width="2"/>
  <line x1="200" y1="135" x2="720" y2="135" stroke="#38bdf8" stroke-width="2"/>

  <line x1="200" y1="135" x2="200" y2="160" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="195,158 205,158 200,166" fill="#38bdf8"/>

  <line x1="460" y1="135" x2="460" y2="160" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="455,158 465,158 460,166" fill="#38bdf8"/>

  <line x1="720" y1="135" x2="720" y2="160" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="715,158 725,158 720,166" fill="#38bdf8"/>

  <!-- Server 1: Planner Server -->
  <g transform="translate(80, 168)">
    <rect width="240" height="74" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="120" y="26" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Planner Server</text>
    <text x="120" y="44" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle">Global Path: NavFn / Smac 2D / A*</text>
    <text x="120" y="60" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">nav2_msgs/ComputePathToPose</text>
  </g>

  <!-- Server 2: Controller Server -->
  <g transform="translate(340, 168)">
    <rect width="240" height="74" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="120" y="26" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Controller Server</text>
    <text x="120" y="44" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle">Local Path Tracking: DWB / RPP</text>
    <text x="120" y="60" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">Publishes: /cmd_vel (20 Hz)</text>
  </g>

  <!-- Server 3: Behavior / Recovery Server -->
  <g transform="translate(600, 168)">
    <rect width="240" height="74" rx="10" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
    <text x="120" y="26" fill="#ef4444" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">Behavior Server</text>
    <text x="120" y="44" fill="#e2e8f0" font-family="sans-serif" font-size="10" text-anchor="middle">Recoveries: Spin, BackUp, Wait</text>
    <text x="120" y="60" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">Clears costmaps when stuck</text>
  </g>

  <!-- Connections down to Costmaps -->
  <line x1="200" y1="242" x2="200" y2="280" stroke="#10b981" stroke-width="2"/>
  <polygon points="195,278 205,278 200,286" fill="#10b981"/>

  <line x1="460" y1="242" x2="460" y2="280" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="455,278 465,278 460,286" fill="#f59e0b"/>

  <!-- Costmap 1: Global Costmap -->
  <g transform="translate(80, 288)">
    <rect width="240" height="64" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1"/>
    <text x="120" y="24" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Global Costmap</text>
    <text x="120" y="42" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Static warehouse map + static inflation</text>
    <text x="120" y="55" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">Resolution: 0.05m / Full Map Area</text>
  </g>

  <!-- Costmap 2: Local Costmap -->
  <g transform="translate(340, 288)">
    <rect width="240" height="64" rx="8" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
    <text x="120" y="24" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Local Costmap</text>
    <text x="120" y="42" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Dynamic 3m x 3m Rolling Window</text>
    <text x="120" y="55" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">Live LiDAR returns for immediate avoidance</text>
  </g>

  <!-- Base Local Controller to Robot HW -->
  <g transform="translate(600, 288)">
    <rect width="240" height="64" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
    <text x="120" y="24" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Robot Actuation Hardware</text>
    <text x="120" y="42" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Differential Drive Mobile Base</text>
    <text x="120" y="55" fill="#64748b" font-family="monospace" font-size="9" text-anchor="middle">Executes wheel speed commands</text>
  </g>
</svg>
