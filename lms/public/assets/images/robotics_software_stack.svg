<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="layerApp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="layerRos" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="layerOs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="cardShadow" x="-2%" y="-4%" width="104%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="320" rx="12" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="400" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">THE AUTONOMOUS ROBOTICS SOFTWARE STACK</text>

  <!-- Layer 1: Application Layer -->
  <g filter="url(#cardShadow)">
    <rect x="50" y="52" width="700" height="68" rx="8" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <rect x="50" y="52" width="8" height="68" rx="4" fill="url(#layerApp)"/>
    <text x="75" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#0284c7">Layer 3: Autonomous Application Layer</text>
    <text x="75" y="102" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">Nav2 Path Planning (Smac/DWB) • SLAM Toolbox (2D LiDAR Mapping) • Computer Vision • Mission DAGs</text>
  </g>

  <!-- Arrow down 1 -->
  <path d="M 400 120 L 400 134" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  <polygon points="396,132 400,138 404,132" fill="#0284c7"/>

  <!-- Layer 2: Middleware Layer -->
  <g filter="url(#cardShadow)">
    <rect x="50" y="140" width="700" height="68" rx="8" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5"/>
    <rect x="50" y="140" width="8" height="68" rx="4" fill="url(#layerRos)"/>
    <text x="75" y="166" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#2563eb">Layer 2: ROS 2 Jazzy Middleware (DDS Protocol)</text>
    <text x="75" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">Object-Oriented Python Nodes (rclpy) • Pub/Sub Topics • RPC Services • Action Servers • TF2 Transforms</text>
  </g>

  <!-- Arrow down 2 -->
  <path d="M 400 208 L 400 222" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
  <polygon points="396,220 400,226 404,220" fill="#2563eb"/>

  <!-- Layer 3: Operating System -->
  <g filter="url(#cardShadow)">
    <rect x="50" y="228" width="700" height="68" rx="8" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5"/>
    <rect x="50" y="228" width="8" height="68" rx="4" fill="url(#layerOs)"/>
    <text x="75" y="254" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#059669">Layer 1: Operating System &amp; Linux Foundation (Ubuntu 24.04 LTS)</text>
    <text x="75" y="278" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#64748b">Bash Terminal CLI • Filesystem Hierarchy • File Permissions (chmod +x) • Process Signals (kill/pkill) • Hardware USB</text>
  </g>
</svg>
