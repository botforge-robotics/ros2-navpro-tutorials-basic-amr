<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <rect width="920" height="340" rx="16" fill="#0f172a"/>
  <text x="460" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">ROS 2 COMMAND-LINE INTROSPECTION ECOSYSTEM</text>

  <!-- Row 1: Core Communication Subsystems -->
  <g transform="translate(40, 55)">
    <!-- Box 1: ros2 node -->
    <g transform="translate(0, 0)">
      <rect width="195" height="100" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
      <rect width="195" height="28" rx="8" fill="#0284c7"/>
      <rect y="18" width="195" height="10" fill="#0284c7"/>
      <text x="97" y="19" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">ros2 node</text>
      <text x="16" y="52" fill="#e2e8f0" font-family="monospace" font-size="10">list</text>
      <text x="50" y="52" fill="#94a3b8" font-family="sans-serif" font-size="10">- Active nodes</text>
      <text x="16" y="72" fill="#e2e8f0" font-family="monospace" font-size="10">info</text>
      <text x="50" y="72" fill="#94a3b8" font-family="sans-serif" font-size="10">- Graph endpoints</text>
      <text x="16" y="90" fill="#64748b" font-family="sans-serif" font-size="9">Runtime Process Audit</text>
    </g>

    <!-- Box 2: ros2 topic -->
    <g transform="translate(215, 0)">
      <rect width="195" height="100" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <rect width="195" height="28" rx="8" fill="#059669"/>
      <rect y="18" width="195" height="10" fill="#059669"/>
      <text x="97" y="19" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">ros2 topic</text>
      <text x="16" y="52" fill="#e2e8f0" font-family="monospace" font-size="10">echo</text>
      <text x="50" y="52" fill="#94a3b8" font-family="sans-serif" font-size="10">- Stream telemetry</text>
      <text x="16" y="72" fill="#e2e8f0" font-family="monospace" font-size="10">hz / bw</text>
      <text x="75" y="72" fill="#94a3b8" font-family="sans-serif" font-size="10">- Rate &amp; bandwidth</text>
      <text x="16" y="90" fill="#64748b" font-family="sans-serif" font-size="9">Continuous Data Stream</text>
    </g>

    <!-- Box 3: ros2 service -->
    <g transform="translate(430, 0)">
      <rect width="195" height="100" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
      <rect width="195" height="28" rx="8" fill="#d97706"/>
      <rect y="18" width="195" height="10" fill="#d97706"/>
      <text x="97" y="19" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">ros2 service</text>
      <text x="16" y="52" fill="#e2e8f0" font-family="monospace" font-size="10">call</text>
      <text x="50" y="52" fill="#94a3b8" font-family="sans-serif" font-size="10">- Sync RPC trigger</text>
      <text x="16" y="72" fill="#e2e8f0" font-family="monospace" font-size="10">type</text>
      <text x="50" y="72" fill="#94a3b8" font-family="sans-serif" font-size="10">- Interface schema</text>
      <text x="16" y="90" fill="#64748b" font-family="sans-serif" font-size="9">Request/Response RPC</text>
    </g>

    <!-- Box 4: ros2 action -->
    <g transform="translate(645, 0)">
      <rect width="195" height="100" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
      <rect width="195" height="28" rx="8" fill="#7c3aed"/>
      <rect y="18" width="195" height="10" fill="#7c3aed"/>
      <text x="97" y="19" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">ros2 action</text>
      <text x="16" y="52" fill="#e2e8f0" font-family="monospace" font-size="10">send_goal</text>
      <text x="85" y="52" fill="#94a3b8" font-family="sans-serif" font-size="10">- Async mission</text>
      <text x="16" y="72" fill="#e2e8f0" font-family="monospace" font-size="10">info</text>
      <text x="50" y="72" fill="#94a3b8" font-family="sans-serif" font-size="10">- Servers &amp; clients</text>
      <text x="16" y="90" fill="#64748b" font-family="sans-serif" font-size="9">Long-running Navigation</text>
    </g>
  </g>

  <!-- Row 2: Configuration & Diagnostics Subsystems -->
  <g transform="translate(40, 175)">
    <!-- Box 5: ros2 param -->
    <g transform="translate(0, 0)">
      <rect width="195" height="95" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
      <rect width="195" height="26" rx="8" fill="#db2777"/>
      <rect y="16" width="195" height="10" fill="#db2777"/>
      <text x="97" y="18" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">ros2 param</text>
      <text x="16" y="48" fill="#e2e8f0" font-family="monospace" font-size="10">get / set</text>
      <text x="75" y="48" fill="#94a3b8" font-family="sans-serif" font-size="10">- Hot reload</text>
      <text x="16" y="68" fill="#e2e8f0" font-family="monospace" font-size="10">dump</text>
      <text x="55" y="68" fill="#94a3b8" font-family="sans-serif" font-size="10">- Save YAML</text>
      <text x="16" y="86" fill="#64748b" font-family="sans-serif" font-size="9">Dynamic Tuning</text>
    </g>

    <!-- Box 6: ros2 bag -->
    <g transform="translate(215, 0)">
      <rect width="195" height="95" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1.5"/>
      <rect width="195" height="26" rx="8" fill="#0891b2"/>
      <rect y="16" width="195" height="10" fill="#0891b2"/>
      <text x="97" y="18" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">ros2 bag</text>
      <text x="16" y="48" fill="#e2e8f0" font-family="monospace" font-size="10">record -a</text>
      <text x="80" y="48" fill="#94a3b8" font-family="sans-serif" font-size="10">- Flight logs</text>
      <text x="16" y="68" fill="#e2e8f0" font-family="monospace" font-size="10">play</text>
      <text x="50" y="68" fill="#94a3b8" font-family="sans-serif" font-size="10">- Deterministic rerun</text>
      <text x="16" y="86" fill="#64748b" font-family="sans-serif" font-size="9">Blackbox Telemetry</text>
    </g>

    <!-- Box 7: ros2 daemon -->
    <g transform="translate(430, 0)">
      <rect width="195" height="95" rx="8" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
      <rect width="195" height="26" rx="8" fill="#9333ea"/>
      <rect y="16" width="195" height="10" fill="#9333ea"/>
      <text x="97" y="18" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">ros2 daemon</text>
      <text x="16" y="48" fill="#e2e8f0" font-family="monospace" font-size="10">status</text>
      <text x="60" y="48" fill="#94a3b8" font-family="sans-serif" font-size="10">- DDS cache state</text>
      <text x="16" y="68" fill="#e2e8f0" font-family="monospace" font-size="10">stop</text>
      <text x="50" y="68" fill="#94a3b8" font-family="sans-serif" font-size="10">- Flush ghosts</text>
      <text x="16" y="86" fill="#64748b" font-family="sans-serif" font-size="9">DDS Background Cache</text>
    </g>

    <!-- Box 8: ros2 doctor -->
    <g transform="translate(645, 0)">
      <rect width="195" height="95" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <rect width="195" height="26" rx="8" fill="#047857"/>
      <rect y="16" width="195" height="10" fill="#047857"/>
      <text x="97" y="18" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold" text-anchor="middle">ros2 doctor</text>
      <text x="16" y="48" fill="#e2e8f0" font-family="monospace" font-size="10">--report</text>
      <text x="75" y="48" fill="#94a3b8" font-family="sans-serif" font-size="10">- Network check</text>
      <text x="16" y="68" fill="#e2e8f0" font-family="monospace" font-size="10">hello</text>
      <text x="55" y="68" fill="#94a3b8" font-family="sans-serif" font-size="10">- DDS connectivity</text>
      <text x="16" y="86" fill="#64748b" font-family="sans-serif" font-size="9">Diagnostics &amp; Health</text>
    </g>
  </g>

  <!-- Bottom Tip -->
  <g transform="translate(40, 288)">
    <rect width="840" height="34" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="420" y="22" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">Tip: Append --help to any command (e.g. ros2 topic echo --help) to see flags, filters, and formats.</text>
  </g>
</svg>
