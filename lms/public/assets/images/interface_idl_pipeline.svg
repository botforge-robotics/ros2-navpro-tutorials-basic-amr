<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-3%" y="-5%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Outer Canvas Card -->
  <rect width="920" height="360" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- Header Title -->
  <g transform="translate(460, 28)" text-anchor="middle">
    <rect x="-200" y="-16" width="400" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="0" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1">ROS 2 INTERFACE (IDL) COMPILATION &amp; BINDING PIPELINE</text>
  </g>

  <!-- Top Package Box (CMake IDL Definition Package) -->
  <g transform="translate(180, 52)" filter="url(#cardShadow)">
    <rect width="560" height="124" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <rect x="16" y="12" width="210" height="26" rx="6" fill="#0284c7"/>
    <text x="121" y="29" fill="#ffffff" font-family="ui-monospace, monospace" font-size="12" font-weight="800" text-anchor="middle">nexus_amr_interfaces (CMake)</text>
    
    <!-- Sub-files inside package -->
    <g transform="translate(20, 50)">
      <rect width="160" height="56" rx="6" fill="#ffffff" stroke="#38bdf8" stroke-width="1.5"/>
      <text x="12" y="24" fill="#0284c7" font-family="ui-monospace, monospace" font-size="11" font-weight="800">📄 msg/</text>
      <text x="16" y="42" fill="#0f172a" font-family="ui-monospace, monospace" font-size="10" font-weight="700">RobotStatus.msg</text>
    </g>
    <g transform="translate(200, 50)">
      <rect width="160" height="56" rx="6" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
      <text x="12" y="24" fill="#047857" font-family="ui-monospace, monospace" font-size="11" font-weight="800">⚡ srv/</text>
      <text x="16" y="42" fill="#0f172a" font-family="ui-monospace, monospace" font-size="10" font-weight="700">SetSpeedMode.srv</text>
    </g>
    <g transform="translate(380, 50)">
      <rect width="160" height="56" rx="6" fill="#ffffff" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="12" y="24" fill="#b45309" font-family="ui-monospace, monospace" font-size="11" font-weight="800">🎯 action/</text>
      <text x="16" y="42" fill="#0f172a" font-family="ui-monospace, monospace" font-size="10" font-weight="700">Patrol.action</text>
    </g>
  </g>

  <!-- Arrow down to rosidl compiler -->
  <line x1="460" y1="176" x2="460" y2="200" stroke="#0284c7" stroke-width="2.5"/>
  <polygon points="455,198 465,198 460,206" fill="#0284c7"/>

  <!-- rosidl Generator Center -->
  <g transform="translate(320, 206)" filter="url(#cardShadow)">
    <rect width="280" height="36" rx="8" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
    <text x="140" y="23" fill="#ffffff" font-family="ui-monospace, monospace" font-size="12.5" font-weight="800" text-anchor="middle">rosidl_generate_interfaces()</text>
  </g>

  <!-- Split arrows -->
  <path d="M 370 242 L 370 262 L 240 262 L 240 276" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="235,274 245,274 240,282" fill="#64748b"/>

  <path d="M 550 242 L 550 262 L 680 262 L 680 276" fill="none" stroke="#10b981" stroke-width="2"/>
  <polygon points="675,274 685,274 680,282" fill="#10b981"/>

  <!-- Left: C++ Bindings -->
  <g transform="translate(100, 282)" filter="url(#cardShadow)">
    <rect width="280" height="62" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="140" y="24" fill="#334155" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">C++ Headers (rclcpp)</text>
    <text x="140" y="46" fill="#0f172a" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600" text-anchor="middle">#include &lt;nexus_amr_interfaces/msg/robot_status.hpp&gt;</text>
  </g>

  <!-- Right: Python Bindings -->
  <g transform="translate(540, 282)" filter="url(#cardShadow)">
    <rect width="280" height="62" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.8"/>
    <text x="140" y="24" fill="#047857" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" text-anchor="middle">Python Bindings (rclpy)</text>
    <text x="140" y="46" fill="#065f46" font-family="ui-monospace, monospace" font-size="10" font-weight="800" text-anchor="middle">from nexus_amr_interfaces.msg import RobotStatus</text>
  </g>
</svg>