<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 360" width="100%" height="100%">
  <rect width="920" height="360" rx="16" fill="#0f172a"/>
  <text x="460" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">ROS 2 INTERFACE (IDL) COMPILATION &amp; BINDING PIPELINE</text>

  <!-- Top Package Box -->
  <g transform="translate(180, 55)">
    <rect width="560" height="120" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="16" y="14" width="160" height="26" rx="6" fill="#0284c7"/>
    <text x="96" y="31" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">navpro_interfaces (CMake)</text>
    
    <!-- Sub-files inside package -->
    <g transform="translate(20, 52)">
      <rect width="160" height="50" rx="6" fill="#0f172a" stroke="#475569"/>
      <text x="12" y="22" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">📄 msg/</text>
      <text x="16" y="38" fill="#e2e8f0" font-family="monospace" font-size="10">RobotStatus.msg</text>
    </g>
    <g transform="translate(200, 52)">
      <rect width="160" height="50" rx="6" fill="#0f172a" stroke="#475569"/>
      <text x="12" y="22" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold">⚡ srv/</text>
      <text x="16" y="38" fill="#e2e8f0" font-family="monospace" font-size="10">SetSpeedMode.srv</text>
    </g>
    <g transform="translate(380, 52)">
      <rect width="160" height="50" rx="6" fill="#0f172a" stroke="#475569"/>
      <text x="12" y="22" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">🎯 action/</text>
      <text x="16" y="38" fill="#e2e8f0" font-family="monospace" font-size="10">Patrol.action</text>
    </g>
  </g>

  <!-- Arrow down to rosidl compiler -->
  <line x1="460" y1="175" x2="460" y2="200" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="455,198 465,198 460,206" fill="#38bdf8"/>

  <!-- rosidl Generator Center -->
  <g transform="translate(320, 204)">
    <rect width="280" height="34" rx="8" fill="#0284c7" stroke="#38bdf8"/>
    <text x="140" y="22" fill="#ffffff" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">rosidl_generate_interfaces()</text>
  </g>

  <!-- Split arrows -->
  <path d="M 370 238 L 370 260 L 240 260 L 240 275" fill="none" stroke="#64748b" stroke-width="2"/>
  <polygon points="235,273 245,273 240,281" fill="#64748b"/>

  <path d="M 550 238 L 550 260 L 680 260 L 680 275" fill="none" stroke="#10b981" stroke-width="2"/>
  <polygon points="675,273 685,273 680,281" fill="#10b981"/>

  <!-- Left: C++ Bindings -->
  <g transform="translate(100, 280)">
    <rect width="280" height="60" rx="8" fill="#1e293b" stroke="#64748b"/>
    <text x="140" y="24" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">C++ Headers (rclcpp)</text>
    <text x="140" y="44" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">#include &lt;navpro_interfaces/msg/robot_status.hpp&gt;</text>
  </g>

  <!-- Right: Python Bindings -->
  <g transform="translate(540, 280)">
    <rect width="280" height="60" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="140" y="24" fill="#10b981" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">Python Bindings (rclpy)</text>
    <text x="140" y="44" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">from navpro_interfaces.msg import RobotStatus</text>
  </g>
</svg>
