<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- DDS Bus Glowing Gradient -->
    <linearGradient id="ddsGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="shadowBox" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <style>
      @keyframes dashMove {
        from { stroke-dashoffset: 48; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes dashMoveReverse {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 48; }
      }
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      @keyframes radarRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes floatChassis {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-3px); }
      }
      .animated-flow-cyan {
        stroke-dasharray: 6 6;
        animation: dashMove 1.5s linear infinite;
      }
      .animated-flow-purple {
        stroke-dasharray: 6 6;
        animation: dashMove 1.8s linear infinite;
      }
      .animated-flow-emerald {
        stroke-dasharray: 6 6;
        animation: dashMove 1.5s linear infinite;
      }
      .radar-arm {
        transform-origin: 35px 36px;
        animation: radarRotate 2.5s linear infinite;
      }
      .pulse-beacon {
        animation: pulseNode 1.8s ease-in-out infinite;
      }
      .robot-chassis {
        animation: floatChassis 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1000" height="480" rx="14" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Subtle Blueprint Grid Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="4 4">
    <line x1="40" y1="50" x2="960" y2="50" />
    <line x1="40" y1="240" x2="960" y2="240" />
    <line x1="40" y1="360" x2="960" y2="360" />
    <line x1="340" y1="50" x2="340" y2="240" />
    <line x1="660" y1="50" x2="660" y2="240" />
  </g>

  <!-- Main Banner Header -->
  <text x="500" y="30" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="1.2">
    THE LIVING ROBOT: ROS 2 MOTION ARCHITECTURE &amp; DATA HIGHWAY
  </text>
  <text x="500" y="46" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" text-anchor="middle">
    Asynchronous Peer-to-Peer DDS Bus • Zero Central Master • Sub-Millisecond Shared Memory
  </text>

  <!-- ========================================================================= -->
  <!-- ZONE 1: SENSORY PERCEPTION (LEFT - SENSES) -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 60)" filter="url(#shadowBox)">
    <!-- Zone Container Box -->
    <rect width="280" height="175" rx="10" fill="url(#cardGrad)" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="280" height="28" rx="10" fill="#0369a1" fill-opacity="0.3"/>
    <text x="140" y="19" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.5">
      1. SENSORY PERCEPTION (SENSES)
    </text>

    <!-- Sensor 1: 2D LiDAR -->
    <g transform="translate(15, 38)">
      <rect width="250" height="60" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="35" cy="30" r="18" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
      <circle cx="35" cy="30" r="13" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="35" y1="30" x2="35" y2="15" stroke="#38bdf8" stroke-width="2" class="radar-arm" style="transform-origin: 35px 30px;"/>
      <circle cx="35" cy="30" r="3" fill="#38bdf8"/>
      
      <text x="68" y="24" fill="#f1f5f9" font-family="monospace" font-size="11" font-weight="700">/lidar_node</text>
      <text x="68" y="38" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Publishes: /scan</text>
      <text x="68" y="50" fill="#94a3b8" font-family="monospace" font-size="8.5">sensor_msgs/LaserScan (10 Hz)</text>
      <circle cx="236" cy="18" r="4" fill="#10b981" class="pulse-beacon"/>
    </g>

    <!-- Sensor 2: RGB-D Camera / IMU -->
    <g transform="translate(15, 105)">
      <rect width="250" height="58" rx="6" fill="#1e293b" stroke="#06b6d4" stroke-width="1"/>
      <rect x="20" y="18" width="28" height="20" rx="4" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5"/>
      <circle cx="34" cy="28" r="5" fill="#0891b2"/>
      
      <text x="68" y="24" fill="#f1f5f9" font-family="monospace" font-size="11" font-weight="700">/camera_node &amp; /imu_node</text>
      <text x="68" y="38" fill="#22d3ee" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Publishes: /image_raw, /imu/data</text>
      <text x="68" y="50" fill="#94a3b8" font-family="monospace" font-size="8.5">Image (30 FPS) • IMU (100 Hz)</text>
      <circle cx="236" cy="18" r="4" fill="#10b981" class="pulse-beacon"/>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- ZONE 2: COGNITION & PLANNING (CENTER - BRAIN) -->
  <!-- ========================================================================= -->
  <g transform="translate(360, 60)" filter="url(#shadowBox)">
    <rect width="280" height="175" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5"/>
    <rect width="280" height="28" rx="10" fill="#4338ca" fill-opacity="0.3"/>
    <text x="140" y="19" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.5">
      2. COGNITION &amp; NAVIGATION (BRAIN)
    </text>

    <!-- Sub-node 1: SLAM Mapping -->
    <g transform="translate(15, 38)">
      <rect width="250" height="60" rx="6" fill="#1e293b" stroke="#6366f1" stroke-width="1"/>
      <text x="16" y="24" fill="#e0e7ff" font-family="monospace" font-size="11" font-weight="700">/slam_toolbox</text>
      <text x="16" y="38" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Subscribes: /scan &amp; /odom</text>
      <text x="16" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">Builds /map • Tracks Pose (map → odom)</text>
      <circle cx="236" cy="18" r="4" fill="#10b981" class="pulse-beacon"/>
    </g>

    <!-- Sub-node 2: Nav2 Planner / Controller -->
    <g transform="translate(15, 105)">
      <rect width="250" height="58" rx="6" fill="#1e293b" stroke="#a855f7" stroke-width="1"/>
      <text x="16" y="24" fill="#f3e8ff" font-family="monospace" font-size="11" font-weight="700">/controller_server (Nav2)</text>
      <text x="16" y="38" fill="#c084fc" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Publishes: /cmd_vel</text>
      <text x="16" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">Global Costmap • DWB Trajectory Generator</text>
      <circle cx="236" cy="18" r="4" fill="#10b981" class="pulse-beacon"/>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- ZONE 3: ACTUATION & LOCOMOTION (RIGHT - MUSCLES) -->
  <!-- ========================================================================= -->
  <g transform="translate(680, 60)" filter="url(#shadowBox)">
    <rect width="280" height="175" rx="10" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5"/>
    <rect width="280" height="28" rx="10" fill="#065f46" fill-opacity="0.3"/>
    <text x="140" y="19" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="0.5">
      3. ACTUATION &amp; MOTORS (MUSCLES)
    </text>

    <!-- Motor Controller Node -->
    <g transform="translate(15, 38)">
      <rect width="250" height="60" rx="6" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="16" y="24" fill="#f1f5f9" font-family="monospace" font-size="11" font-weight="700">/diff_drive_controller</text>
      <text x="16" y="38" fill="#34d399" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600">Subscribes: /cmd_vel</text>
      <text x="16" y="50" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="8.5">Calculates Left &amp; Right Wheel RPM</text>
      <circle cx="236" cy="18" r="4" fill="#10b981" class="pulse-beacon"/>
    </g>

    <!-- Physical AMR Base Icon (Clean & Spacious) -->
    <g transform="translate(75, 108)" class="robot-chassis">
      <rect width="130" height="52" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5"/>
      <!-- Left wheel -->
      <rect x="-8" y="10" width="10" height="32" rx="3" fill="#047857" stroke="#10b981" stroke-width="1"/>
      <!-- Right wheel -->
      <rect x="128" y="10" width="10" height="32" rx="3" fill="#047857" stroke="#10b981" stroke-width="1"/>
      <!-- Heading Arrow -->
      <path d="M 65 36 L 65 14 M 59 20 L 65 13 L 71 20" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="65" y="46" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">NAVPRO AMR</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- CLEAR VERTICAL DATA PIPES (BETWEEN NODES AND DDS HIGHWAY) -->
  <!-- ========================================================================= -->

  <!-- Pipe 1: Senses -> DDS (Emits /scan down) -->
  <path d="M 180 235 L 180 270" fill="none" stroke="#38bdf8" stroke-width="2.5" class="animated-flow-cyan"/>
  <polygon points="176,266 180,274 184,266" fill="#38bdf8"/>
  <rect x="190" y="244" width="60" height="18" rx="4" fill="#0284c7" fill-opacity="0.25"/>
  <text x="220" y="256" fill="#38bdf8" font-family="monospace" font-size="8.5" font-weight="700" text-anchor="middle">/scan ↓</text>

  <!-- Pipe 2: DDS -> Brain (Telemetry up into SLAM) -->
  <path d="M 440 270 L 440 235" fill="none" stroke="#818cf8" stroke-width="2.5" class="animated-flow-purple"/>
  <polygon points="436,243 440,235 444,243" fill="#818cf8"/>
  <rect x="450" y="244" width="70" height="18" rx="4" fill="#4f46e5" fill-opacity="0.25"/>
  <text x="485" y="256" fill="#a5b4fc" font-family="monospace" font-size="8.5" font-weight="700" text-anchor="middle">telemetry ↑</text>

  <!-- Pipe 3: Brain -> DDS (Nav2 emits /cmd_vel down) -->
  <path d="M 560 235 L 560 270" fill="none" stroke="#c084fc" stroke-width="2.5" class="animated-flow-purple"/>
  <polygon points="556,266 560,274 564,266" fill="#c084fc"/>
  <rect x="570" y="244" width="75" height="18" rx="4" fill="#9333ea" fill-opacity="0.25"/>
  <text x="607" y="256" fill="#d8b4fe" font-family="monospace" font-size="8.5" font-weight="700" text-anchor="middle">/cmd_vel ↓</text>

  <!-- Pipe 4: DDS -> Muscles (diff_drive receives /cmd_vel up) -->
  <path d="M 820 270 L 820 235" fill="none" stroke="#10b981" stroke-width="2.5" class="animated-flow-emerald"/>
  <polygon points="816,243 820,235 824,243" fill="#10b981"/>
  <rect x="830" y="244" width="75" height="18" rx="4" fill="#059669" fill-opacity="0.25"/>
  <text x="867" y="256" fill="#34d399" font-family="monospace" font-size="8.5" font-weight="700" text-anchor="middle">/cmd_vel ↑</text>

  <!-- ========================================================================= -->
  <!-- ZONE 4: THE DDS NERVOUS SYSTEM (DEDICATED CENTRAL HIGHWAY) -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 275)" filter="url(#glowPurple)">
    <rect width="920" height="64" rx="10" fill="#13122b" stroke="url(#ddsGrad)" stroke-width="2"/>
    <text x="460" y="26" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12.5" font-weight="800" text-anchor="middle" letter-spacing="1">
      ⚡ DDS COMMUNICATION HIGHWAY (DATA DISTRIBUTION SERVICE • PEER-TO-PEER)
    </text>
    <text x="460" y="46" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">
      Zero Master Bottleneck • Automatic UDP Multicast Discovery • Configurable QoS Policies • Sub-Millisecond Shared Memory
    </text>

    <!-- Animated Longitudinal Data Stream -->
    <line x1="80" y1="56" x2="840" y2="56" stroke="#38bdf8" stroke-width="2" class="animated-flow-cyan" opacity="0.8"/>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM ROW: 4 ARCHITECTURAL PILLARS SUMMARY -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 365)">
    <!-- Badge 1: Plumbing -->
    <g transform="translate(0, 0)">
      <rect width="215" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <text x="14" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="800">1. THE PLUMBING</text>
      <text x="14" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">DDS Pub/Sub • Services • Actions</text>
    </g>

    <!-- Badge 2: Tools -->
    <g transform="translate(235, 0)">
      <rect width="215" height="50" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1"/>
      <text x="14" y="22" fill="#a5b4fc" font-family="system-ui, sans-serif" font-size="11" font-weight="800">2. THE TOOLS</text>
      <text x="14" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">RViz2 • Gazebo • ros2 bag • CLI</text>
    </g>

    <!-- Badge 3: Capabilities -->
    <g transform="translate(470, 0)">
      <rect width="215" height="50" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1"/>
      <text x="14" y="22" fill="#e879f9" font-family="system-ui, sans-serif" font-size="11" font-weight="800">3. CAPABILITIES</text>
      <text x="14" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Nav2 • SLAM Toolbox • TF2 Trees</text>
    </g>

    <!-- Badge 4: Ecosystem -->
    <g transform="translate(705, 0)">
      <rect width="215" height="50" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1"/>
      <text x="14" y="22" fill="#34d399" font-family="system-ui, sans-serif" font-size="11" font-weight="800">4. ECOSYSTEM</text>
      <text x="14" y="38" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9.5">Open Source • Hardware Vendor SDKs</text>
    </g>
  </g>

  <!-- Footnote -->
  <text x="500" y="445" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">
    Autonomous Closed-Loop: Perception (Senses) → DDS (Nerves) → Nav2/SLAM (Brain) → Diff-Drive (Muscles) → Physical Wheel Motion
  </text>
</svg>
