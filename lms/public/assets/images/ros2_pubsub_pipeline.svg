<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <text x="450" y="32" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1">ROS 2 JAZZY PUBLISH-SUBSCRIBE COMPUTATIONAL GRAPH</text>

  <!-- Publisher Node Box -->
  <g transform="translate(60, 60)" filter="url(#shadow)">
    <rect width="210" height="155" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="210" height="34" rx="12" fill="#0284c7"/>
    <rect y="22" width="210" height="12" fill="#0284c7"/>
    <text x="105" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">NODE: /talker_node</text>
    
    <text x="18" y="62" fill="#475569" font-family="monospace" font-size="10.5">create_timer(1.0, cb)</text>
    <text x="18" y="85" fill="#0369a1" font-family="monospace" font-size="10.5" font-weight="600">create_publisher()</text>
    <text x="18" y="108" fill="#0f172a" font-family="monospace" font-size="10.5">msg.data = "Hello"</text>
    <text x="18" y="131" fill="#15803d" font-family="monospace" font-size="10.5" font-weight="700">self.pub.publish(msg)</text>
  </g>

  <!-- Topic Bus -->
  <g transform="translate(335, 75)" filter="url(#shadow)">
    <rect width="230" height="125" rx="12" fill="#faf5ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect width="230" height="32" rx="12" fill="#8b5cf6"/>
    <rect y="20" width="230" height="12" fill="#8b5cf6"/>
    <text x="115" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">TOPIC: /cmd_vel</text>
    
    <text x="18" y="58" fill="#6d28d9" font-family="monospace" font-size="11" font-weight="700">geometry_msgs/Twist</text>
    <text x="18" y="78" fill="#475569" font-family="system-ui, sans-serif" font-size="10" font-weight="600">QoS: Reliable / KeepLast(10)</text>
    <text x="18" y="98" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">DDS: FastDDS Shared Mem</text>
  </g>

  <!-- Subscriber Node Box -->
  <g transform="translate(630, 60)" filter="url(#shadow)">
    <rect width="210" height="155" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <rect width="210" height="34" rx="12" fill="#16a34a"/>
    <rect y="22" width="210" height="12" fill="#16a34a"/>
    <text x="105" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">NODE: /listener_node</text>
    
    <text x="18" y="62" fill="#15803d" font-family="monospace" font-size="10.5" font-weight="600">create_subscription()</text>
    <text x="18" y="85" fill="#475569" font-family="monospace" font-size="10.5">callback(msg):</text>
    <text x="32" y="108" fill="#0f172a" font-family="monospace" font-size="10.5">v = msg.linear.x</text>
    <text x="32" y="131" fill="#b45309" font-family="monospace" font-size="10.5" font-weight="700">drive_motors(v)</text>
  </g>

  <!-- Flow Arrows -->
  <path d="M 270 137 L 330 137" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="5,4" fill="none"/>
  <polygon points="335,137 325,132 325,142" fill="#0284c7"/>
  <circle cx="300" cy="137" r="4" fill="#0284c7"/>

  <path d="M 565 137 L 625 137" stroke="#16a34a" stroke-width="2.5" stroke-dasharray="5,4" fill="none"/>
  <polygon points="630,137 620,132 620,142" fill="#16a34a"/>
  <circle cx="595" cy="137" r="4" fill="#16a34a"/>

  <text x="300" y="123" fill="#0284c7" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Publish</text>
  <text x="595" y="123" fill="#16a34a" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" text-anchor="middle">Receive</text>

  <!-- Bottom Bar Info -->
  <text x="450" y="252" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">
    Anonymous &amp; Asynchronous: Publisher and Subscriber communicate purely via DDS without direct node-to-node coupling.
  </text>
</svg>
