<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="100%">
  <defs>
    <linearGradient id="pubGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="topicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" rx="16" fill="#0f172a"/>
  
  <!-- Grid pattern -->
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="1"/>
  </pattern>
  <rect width="900" height="280" rx="16" fill="url(#grid)"/>

  <!-- Title -->
  <text x="450" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">ROS 2 JAZZY PUBLISH-SUBSCRIBE COMPUTATIONAL GRAPH</text>

  <!-- Publisher Node Box -->
  <g transform="translate(60, 65)" filter="url(#shadow)">
    <rect width="200" height="150" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect width="200" height="36" rx="12" fill="url(#pubGrad)"/>
    <rect y="24" width="200" height="12" fill="url(#pubGrad)"/>
    <text x="100" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">NODE: /talker_node</text>
    
    <text x="20" y="65" fill="#94a3b8" font-family="monospace" font-size="11">create_timer(1.0, cb)</text>
    <text x="20" y="88" fill="#38bdf8" font-family="monospace" font-size="11">create_publisher()</text>
    <text x="20" y="110" fill="#cbd5e1" font-family="monospace" font-size="11">msg.data = "Hello"</text>
    <text x="20" y="132" fill="#22c55e" font-family="monospace" font-size="11">self.pub.publish(msg)</text>
  </g>

  <!-- Topic Bus -->
  <g transform="translate(340, 85)" filter="url(#shadow)">
    <rect width="220" height="110" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="2"/>
    <rect width="220" height="32" rx="12" fill="url(#topicGrad)"/>
    <rect y="20" width="220" height="12" fill="url(#topicGrad)"/>
    <text x="110" y="22" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">TOPIC: /cmd_vel</text>
    
    <text x="20" y="58" fill="#c084fc" font-family="monospace" font-size="11">geometry_msgs/Twist</text>
    <text x="20" y="78" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">QoS: Reliable / KeepLast(10)</text>
    <text x="20" y="96" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">DDS: FastDDS Shared Mem</text>
  </g>

  <!-- Subscriber Node Box -->
  <g transform="translate(640, 65)" filter="url(#shadow)">
    <rect width="200" height="150" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="200" height="36" rx="12" fill="url(#subGrad)"/>
    <rect y="24" width="200" height="12" fill="url(#subGrad)"/>
    <text x="100" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">NODE: /listener_node</text>
    
    <text x="20" y="65" fill="#34d399" font-family="monospace" font-size="11">create_subscription()</text>
    <text x="20" y="88" fill="#94a3b8" font-family="monospace" font-size="11">callback(msg):</text>
    <text x="35" y="110" fill="#cbd5e1" font-family="monospace" font-size="11">v = msg.linear.x</text>
    <text x="35" y="132" fill="#f59e0b" font-family="monospace" font-size="11">drive_motors(v)</text>
  </g>

  <!-- Flow Arrows -->
  <path d="M 260 140 L 330 140" stroke="#3b82f6" stroke-width="3" stroke-dasharray="6,4" fill="none"/>
  <polygon points="335,140 325,134 325,146" fill="#3b82f6"/>
  <circle cx="295" cy="140" r="4" fill="#60a5fa"/>

  <path d="M 560 140 L 630 140" stroke="#10b981" stroke-width="3" stroke-dasharray="6,4" fill="none"/>
  <polygon points="635,140 625,134 625,146" fill="#10b981"/>
  <circle cx="595" cy="140" r="4" fill="#34d399"/>

  <text x="295" y="125" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Publish</text>
  <text x="595" y="125" fill="#34d399" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Receive</text>

  <!-- Bottom Bar Info -->
  <text x="450" y="245" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Anonymous &amp; Asynchronous: Publisher and Subscriber do not know each other exists.</text>
</svg>
