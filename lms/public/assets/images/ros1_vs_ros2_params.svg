<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <!-- Soft Shadows -->
    <filter id="panelShadow" x="-2%" y="-3%" width="104%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="nodeShadow" x="-4%" y="-6%" width="108%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Outer Canvas Card -->
  <rect width="1000" height="480" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Title & Badge Banner -->
  <g transform="translate(500, 36)" text-anchor="middle">
    <!-- Pill Badge -->
    <rect x="-120" y="-18" width="240" height="24" rx="12" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <text x="0" y="-2" fill="#0284c7" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1.5">PARAMETER ARCHITECTURE</text>
    
    <!-- Title -->
    <text x="0" y="25" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">ROS 1 Centralized vs. ROS 2 Distributed Parameter Model</text>
  </g>

  <!-- ========================================================================= -->
  <!-- LEFT PANEL: ROS 1 (CENTRALIZED ARCHITECTURE)                              -->
  <!-- ========================================================================= -->
  <g transform="translate(40, 85)" filter="url(#panelShadow)">
    <!-- Panel Background (Soft Rose) -->
    <rect width="440" height="365" rx="14" fill="#fff1f2" stroke="#fecdd3" stroke-width="1.5"/>
    
    <!-- Panel Header Pill -->
    <rect x="24" y="16" width="105" height="22" rx="11" fill="#ffe4e6" stroke="#f43f5e" stroke-width="1"/>
    <text x="76" y="31" fill="#e11d48" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">LEGACY ROS 1</text>
    <text x="138" y="32" fill="#881337" font-family="system-ui, sans-serif" font-size="15" font-weight="800">Centralized Master Server</text>

    <!-- Master Server Box -->
    <g transform="translate(30, 52)" filter="url(#nodeShadow)">
      <rect width="380" height="70" rx="10" fill="#ffffff" stroke="#f43f5e" stroke-width="1.5"/>
      <!-- Header strip -->
      <rect width="380" height="28" rx="10" fill="#e11d48"/>
      <rect y="16" width="380" height="12" fill="#e11d48"/>
      <text x="190" y="19" fill="#ffffff" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">roscore (Master XML-RPC Server)</text>
      
      <!-- Content -->
      <text x="16" y="46" fill="#475569" font-family="monospace" font-size="10">/robot/max_vel: 1.5</text>
      <text x="150" y="46" fill="#475569" font-family="monospace" font-size="10">/camera/fps: 30</text>
      <text x="270" y="46" fill="#475569" font-family="monospace" font-size="10">/global_name: 42</text>
      <text x="190" y="62" fill="#e11d48" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">Shared Flat Global Dictionary in Master Memory</text>
    </g>

    <!-- Communication Link Arrows (Polling / XML-RPC Bottleneck) -->
    <g>
      <line x1="130" y1="122" x2="130" y2="166" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,3"/>
      <polygon points="126,162 134,162 130,169" fill="#f43f5e"/>
      <text x="75" y="148" fill="#e11d48" font-family="system-ui, sans-serif" font-size="9" font-weight="700">XML-RPC Poll</text>

      <line x1="310" y1="122" x2="310" y2="166" stroke="#f43f5e" stroke-width="2" stroke-dasharray="4,3"/>
      <polygon points="306,162 314,162 310,169" fill="#f43f5e"/>
      <text x="320" y="148" fill="#e11d48" font-family="system-ui, sans-serif" font-size="9" font-weight="700">XML-RPC Poll</text>
    </g>

    <!-- Client Nodes -->
    <g transform="translate(30, 172)">
      <!-- Node 1 -->
      <g filter="url(#nodeShadow)">
        <rect width="175" height="66" rx="8" fill="#ffffff" stroke="#fecdd3" stroke-width="1.5"/>
        <rect width="175" height="22" rx="8" fill="#fff1f2"/>
        <rect y="12" width="175" height="10" fill="#fff1f2"/>
        <text x="87" y="16" fill="#e11d48" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Node: /camera_node</text>
        <text x="12" y="38" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">No local parameter cache</text>
        <text x="12" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Queries master on startup</text>
      </g>

      <!-- Node 2 -->
      <g transform="translate(205, 0)" filter="url(#nodeShadow)">
        <rect width="175" height="66" rx="8" fill="#ffffff" stroke="#fecdd3" stroke-width="1.5"/>
        <rect width="175" height="22" rx="8" fill="#fff1f2"/>
        <rect y="12" width="175" height="10" fill="#fff1f2"/>
        <text x="87" y="16" fill="#e11d48" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Node: /motor_node</text>
        <text x="12" y="38" fill="#64748b" font-family="system-ui, sans-serif" font-size="10">No local parameter cache</text>
        <text x="12" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9">Queries master on startup</text>
      </g>
    </g>

    <!-- Limitations Callout Box -->
    <g transform="translate(30, 256)">
      <rect width="380" height="88" rx="8" fill="#ffffff" stroke="#f43f5e" stroke-width="1"/>
      <text x="16" y="22" fill="#e11d48" font-family="system-ui, sans-serif" font-size="11" font-weight="800">⚠️ Architectural Vulnerabilities:</text>
      <text x="16" y="42" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5">• <tspan font-weight="700" fill="#0f172a">Single Point of Failure:</tspan> If roscore crashes, all parameters disappear</text>
      <text x="16" y="58" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5">• <tspan font-weight="700" fill="#0f172a">Flat Global Space:</tspan> Two robots cannot use same parameter name</text>
      <text x="16" y="74" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5">• <tspan font-weight="700" fill="#0f172a">No Built-in Callbacks:</tspan> Nodes must poll or use dynamic_reconfigure</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT PANEL: ROS 2 (DISTRIBUTED NODE ARCHITECTURE)                       -->
  <!-- ========================================================================= -->
  <g transform="translate(520, 85)" filter="url(#panelShadow)">
    <!-- Panel Background (Soft Emerald) -->
    <rect width="440" height="365" rx="14" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5"/>
    
    <!-- Panel Header Pill -->
    <rect x="24" y="16" width="120" height="22" rx="11" fill="#dcfce7" stroke="#10b981" stroke-width="1"/>
    <text x="84" y="31" fill="#059669" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">MODERN ROS 2</text>
    <text x="154" y="32" fill="#065f46" font-family="system-ui, sans-serif" font-size="15" font-weight="800">Node-Scoped Distributed Model</text>

    <!-- Node 1 (Camera) -->
    <g transform="translate(30, 52)" filter="url(#nodeShadow)">
      <rect width="380" height="80" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
      <!-- Header strip -->
      <rect width="380" height="26" rx="10" fill="#059669"/>
      <rect y="14" width="380" height="12" fill="#059669"/>
      <text x="190" y="18" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Node: /camera_node (Self-Contained Parameter Server)</text>
      
      <!-- Parameter Store Inside Node -->
      <rect x="14" y="34" width="352" height="38" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="26" y="50" fill="#047857" font-family="monospace" font-size="10" font-weight="700">Scoped Params:</text>
      <text x="130" y="50" fill="#334155" font-family="monospace" font-size="9.5">fps: 30 (int)</text>
      <text x="225" y="50" fill="#334155" font-family="monospace" font-size="9.5">exposure: 0.05 (float)</text>
      <text x="26" y="65" fill="#059669" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">⚡ on_set_parameters callback</text>
      <text x="200" y="65" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">(Real-time event notification)</text>
    </g>

    <!-- Bi-directional Peer DDS Services -->
    <g transform="translate(0, 134)">
      <line x1="220" y1="0" x2="220" y2="16" stroke="#059669" stroke-width="2"/>
      <polygon points="216,4 224,4 220,0" fill="#059669"/>
      <polygon points="216,12 224,12 220,16" fill="#059669"/>
      <text x="228" y="11" fill="#047857" font-family="monospace" font-size="8.5" font-weight="700">Peer DDS Service Bus (No Central Broker)</text>
    </g>

    <!-- Node 2 (Motor) -->
    <g transform="translate(30, 154)" filter="url(#nodeShadow)">
      <rect width="380" height="80" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="1.5"/>
      <!-- Header strip -->
      <rect width="380" height="26" rx="10" fill="#059669"/>
      <rect y="14" width="380" height="12" fill="#059669"/>
      <text x="190" y="18" fill="#ffffff" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Node: /motor_node (Self-Contained Parameter Server)</text>
      
      <!-- Parameter Store Inside Node -->
      <rect x="14" y="34" width="352" height="38" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="26" y="50" fill="#047857" font-family="monospace" font-size="10" font-weight="700">Scoped Params:</text>
      <text x="130" y="50" fill="#334155" font-family="monospace" font-size="9.5">max_speed: 1.5 (float)</text>
      <text x="270" y="50" fill="#334155" font-family="monospace" font-size="9.5">wheel_radius: 0.06</text>
      <text x="26" y="65" fill="#059669" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700">⚡ on_set_parameters callback</text>
      <text x="200" y="65" fill="#64748b" font-family="system-ui, sans-serif" font-size="9.5">(Dynamic validation &amp; range guard)</text>
    </g>

    <!-- Key Advantages Callout Box -->
    <g transform="translate(30, 256)">
      <rect width="380" height="88" rx="8" fill="#ffffff" stroke="#10b981" stroke-width="1"/>
      <text x="16" y="22" fill="#047857" font-family="system-ui, sans-serif" font-size="11" font-weight="800">🌟 Modern ROS 2 Advantages:</text>
      <text x="16" y="42" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">• <tspan font-weight="700" fill="#0f172a">Zero Single Point of Failure:</tspan> Each node owns its parameter registry</text>
      <text x="16" y="58" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">• <tspan font-weight="700" fill="#0f172a">Scoped Namespaces:</tspan> /amr_1/max_speed and /amr_2/max_speed co-exist</text>
      <text x="16" y="74" fill="#334155" font-family="system-ui, sans-serif" font-size="10.5">• <tspan font-weight="700" fill="#0f172a">Type Safety &amp; Realtime Events:</tspan> Built-in range descriptors &amp; callbacks</text>
    </g>
  </g>
</svg>