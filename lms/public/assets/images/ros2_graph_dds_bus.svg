<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%">
  <!-- Canvas Background -->
  <rect width="920" height="320" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="460" y="32" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1">ROS 2 DECENTRALIZED COMPUTATIONAL GRAPH &amp; DDS BUS</text>

  <!-- Node 1: Sensor -->
  <g transform="translate(80, 68)">
    <rect width="220" height="70" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="110" y="28" fill="#0369a1" font-family="monospace" font-size="12.5" font-weight="700" text-anchor="middle">Node: /camera_node</text>
    <text x="110" y="48" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Publishes: /camera/image_raw</text>
  </g>

  <!-- Node 2: Detector -->
  <g transform="translate(620, 68)">
    <rect width="220" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <text x="110" y="28" fill="#15803d" font-family="monospace" font-size="12.5" font-weight="700" text-anchor="middle">Node: /detector_node</text>
    <text x="110" y="48" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Subscribes &amp; Computes BBoxes</text>
  </g>

  <!-- DDS Bus Central Pipe -->
  <g transform="translate(80, 175)">
    <rect width="760" height="46" rx="8" fill="#faf5ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="380" y="28" fill="#6d28d9" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">⚡ DDS Communication Bus (Peer-to-Peer / Zero Central Bottleneck)</text>
  </g>

  <!-- Vertical Connectors -->
  <line x1="190" y1="138" x2="190" y2="175" stroke="#0284c7" stroke-width="2"/>
  <polygon points="185,173 195,173 190,181" fill="#0284c7"/>

  <line x1="730" y1="175" x2="730" y2="138" stroke="#16a34a" stroke-width="2"/>
  <polygon points="725,140 735,140 730,132" fill="#16a34a"/>

  <!-- Node 3: Planner below DDS -->
  <g transform="translate(350, 244)">
    <rect width="220" height="60" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
    <text x="110" y="26" fill="#b45309" font-family="monospace" font-size="12.5" font-weight="700" text-anchor="middle">Node: /planner_node</text>
    <text x="110" y="44" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Consumes Telemetry &amp; Plans Paths</text>
  </g>

  <line x1="460" y1="221" x2="460" y2="244" stroke="#d97706" stroke-width="2"/>
  <polygon points="455,242 465,242 460,248" fill="#d97706"/>
</svg>
