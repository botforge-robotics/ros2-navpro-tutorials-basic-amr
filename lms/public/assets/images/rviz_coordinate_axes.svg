<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 520" width="100%" height="100%">
  <defs>
    <!-- Arrow Markers (Light Theme Optimized) -->
    <marker id="arrowRed" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#dc2626" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#16a34a" />
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 10 5 L 0 8.5 z" fill="#2563eb" />
    </marker>

    <!-- Drop Shadow for Cards -->
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Background Canvas: Clean Light Theme -->
  <rect width="1160" height="520" fill="#ffffff" rx="16" />
  <rect width="1158" height="518" x="1" y="1" fill="none" stroke="#e2e8f0" stroke-width="1.5" rx="15" />

  <!-- Subtle Precision Grid -->
  <g opacity="0.55" stroke="#e2e8f0" stroke-width="1">
    <line x1="0" y1="100" x2="1160" y2="100" />
    <line x1="0" y1="200" x2="1160" y2="200" />
    <line x1="0" y1="300" x2="1160" y2="300" />
    <line x1="0" y1="400" x2="1160" y2="400" />
    <line x1="190" y1="0" x2="190" y2="520" />
    <line x1="380" y1="0" x2="380" y2="520" />
    <line x1="580" y1="0" x2="580" y2="520" stroke-dasharray="6,6" stroke="#cbd5e1" stroke-width="1.5" />
    <line x1="770" y1="0" x2="770" y2="520" />
    <line x1="960" y1="0" x2="960" y2="520" />
  </g>

  <!-- ========================================================================= -->
  <!-- HEADER: TITLE & THE GOLDEN MNEMONIC (RGB = XYZ)                           -->
  <!-- ========================================================================= -->
  <g transform="translate(580, 45)" text-anchor="middle">
    <text y="-8" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="-0.01em">
      ROS 2 Coordinate Frame Standard (REP 103)
    </text>
    
    <!-- Mnemonic Pill (Light Card) -->
    <g transform="translate(0, 24)" filter="url(#cardShadow)">
      <rect x="-270" y="-17" width="540" height="34" rx="17" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <text y="6" font-family="system-ui, sans-serif" font-size="13.5" font-weight="700">
        <tspan fill="#64748b">The Golden Rule: </tspan>
        <tspan fill="#0f172a" font-weight="800">RGB = XYZ  →</tspan>
        <tspan fill="#dc2626" font-weight="800">  RED = +X</tspan>
        <tspan fill="#94a3b8">  |  </tspan>
        <tspan fill="#16a34a" font-weight="800">GREEN = +Y</tspan>
        <tspan fill="#94a3b8">  |  </tspan>
        <tspan fill="#2563eb" font-weight="800">BLUE = +Z</tspan>
      </text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- LEFT SIDE: ONLY XYZ AXIS WITH LABELS & RIGHT-HAND RULE TEXT               -->
  <!-- ========================================================================= -->
  <!-- Z is vertical up, Y is horizontal left (90 deg perpendicular), X is forward-down-right -->
  <g transform="translate(290, 270)">
    <!-- 90 Degree Perpendicular Right-Angle Marker between +Z and +Y -->
    <path d="M 0,-24 L -24,-24 L -24,0" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3" />
    <circle cx="-12" cy="-12" r="2" fill="#64748b" />
    <text x="-30" y="-30" text-anchor="middle" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="700">90°</text>

    <!-- +Z AXIS (Blue - Points Straight UP) -->
    <!-- Starting exactly at origin (0, 0) -->
    <line x1="0" y1="0" x2="0" y2="-155" stroke="#2563eb" stroke-width="5.5" stroke-linecap="round" marker-end="url(#arrowBlue)" />
    <g transform="translate(0, -170)" filter="url(#cardShadow)">
      <rect x="-75" y="-15" width="150" height="30" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800">
        +Z : Thumb (Up)
      </text>
    </g>

    <!-- +Y AXIS (Green - Points Horizontal LEFT -> Exactly PERPENDICULAR to Z!) -->
    <!-- Starting exactly at origin (0, 0) -->
    <line x1="0" y1="0" x2="-155" y2="0" stroke="#16a34a" stroke-width="5.5" stroke-linecap="round" marker-end="url(#arrowGreen)" />
    <g transform="translate(-170, 0)" filter="url(#cardShadow)">
      <rect x="-140" y="-15" width="140" height="30" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
      <text x="-70" y="5" text-anchor="middle" fill="#15803d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800">
        +Y : Index (Left)
      </text>
    </g>

    <!-- +X AXIS (Red - Points Forward Towards Viewer: Middle Finger) -->
    <!-- Starting exactly at origin (0, 0) -->
    <line x1="0" y1="0" x2="130" y2="85" stroke="#dc2626" stroke-width="5.5" stroke-linecap="round" marker-end="url(#arrowRed)" />
    <g transform="translate(135, 85)" filter="url(#cardShadow)">
      <rect x="8" y="-15" width="175" height="30" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
      <text x="95" y="5" text-anchor="middle" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="12" font-weight="800">
        +X : Middle Finger (Forward)
      </text>
    </g>

    <!-- Shared Origin Node at (0, 0) -->
    <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="#0284c7" stroke-width="3" />
    <text x="0" y="24" text-anchor="middle" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="700">Origin (0,0,0)</text>

    <!-- Left Side Label: Right Hand Rule Text -->
    <g transform="translate(0, 185)" text-anchor="middle" filter="url(#cardShadow)">
      <rect x="-160" y="-20" width="320" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <text y="3" fill="#0284c7" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800" letter-spacing="0.04em">
        RIGHT-HAND RULE
      </text>
      <text y="28" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="600">
        Middle Finger = +X  •  Index = +Y  •  Thumb = +Z
      </text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- RIGHT SIDE: SAME ROBOT IMAGE (NO LINK NAMES, Z AXIS ALIGNED AT ORIGIN)     -->
  <!-- ========================================================================= -->
  <g transform="translate(835, 270)">
    <!-- Robot Top-Down View -->
    <!-- Chassis Body (Light Theme Architectural Styling) -->
    <rect x="-70" y="-55" width="140" height="110" rx="20" fill="#f8fafc" stroke="#0284c7" stroke-width="2.5" />
    
    <!-- Front Direction Chevron -->
    <path d="M 70,-22 L 88,0 L 70,22 Z" fill="#0284c7" />
    <text x="70" y="-30" text-anchor="middle" fill="#0284c7" font-family="system-ui, sans-serif" font-size="10" font-weight="800">FRONT</text>

    <!-- Left Wheel (Port-side, Top) -->
    <rect x="-35" y="-72" width="70" height="15" rx="4" fill="#334155" stroke="#16a34a" stroke-width="2" />

    <!-- Right Wheel (Starboard-side, Bottom) -->
    <rect x="-35" y="57" width="70" height="15" rx="4" fill="#334155" stroke="#64748b" stroke-width="2" />

    <!-- Top LiDAR Scanner Dome -->
    <circle cx="24" cy="0" r="16" fill="#1e293b" stroke="#0284c7" stroke-width="2" />
    <circle cx="24" cy="0" r="5" fill="#dc2626" />

    <!-- +X FORWARD ARROW (Red) Starting exactly at (0, 0) -->
    <line x1="0" y1="0" x2="140" y2="0" stroke="#dc2626" stroke-width="5.5" stroke-linecap="round" marker-end="url(#arrowRed)" />
    <g transform="translate(145, 0)" filter="url(#cardShadow)">
      <rect x="8" y="-15" width="125" height="30" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5" />
      <text x="70" y="5" text-anchor="middle" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800">
        +X : Forward
      </text>
    </g>

    <!-- +Y LEFT ARROW (Green) Starting exactly at (0, 0) -->
    <line x1="0" y1="0" x2="0" y2="-130" stroke="#16a34a" stroke-width="5.5" stroke-linecap="round" marker-end="url(#arrowGreen)" />
    <g transform="translate(0, -145)" filter="url(#cardShadow)">
      <rect x="-65" y="-15" width="130" height="30" rx="6" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" fill="#15803d" font-family="system-ui, sans-serif" font-size="12.5" font-weight="800">
        +Y : Left (Port)
      </text>
    </g>

    <!-- +Z AXIS ALIGNED EXACTLY AT (0, 0) ORIGIN -->
    <!-- Concentric Blue Ring & Point-Out-Of-Page Marker directly at (0, 0) -->
    <circle cx="0" cy="0" r="18" fill="rgba(37, 99, 235, 0.08)" stroke="#2563eb" stroke-width="2" stroke-dasharray="3,3" />
    <!-- Counter-Clockwise Yaw Rotation Arrow directly around origin -->
    <path d="M -15,-10 A 18 18 0 1 1 15,-10" fill="none" stroke="#2563eb" stroke-width="2" />
    <polygon points="15,-14 20,-8 13,-6" fill="#2563eb" />

    <!-- Shared Origin Node Circle at (0, 0) -->
    <circle cx="0" cy="0" r="8" fill="#ffffff" stroke="#2563eb" stroke-width="3" />
    <circle cx="0" cy="0" r="3.5" fill="#2563eb" />

    <!-- +Z Callout Badge connected to Origin -->
    <g transform="translate(-80, -35)" filter="url(#cardShadow)">
      <rect x="-65" y="-14" width="130" height="28" rx="6" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5" />
      <text x="0" y="5" text-anchor="middle" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800">
        +Z : Up (Yaw ⤾)
      </text>
      <line x1="50" y1="14" x2="70" y2="27" stroke="#2563eb" stroke-width="1.5" />
    </g>

    <!-- Right Side Label: Vehicle Frame Text (Clean, no link names) -->
    <g transform="translate(0, 185)" text-anchor="middle" filter="url(#cardShadow)">
      <rect x="-160" y="-20" width="320" height="34" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
      <text y="3" fill="#15803d" font-family="system-ui, sans-serif" font-size="13.5" font-weight="800" letter-spacing="0.04em">
        AMR ROBOT FRAME
      </text>
      <text y="28" fill="#475569" font-family="system-ui, sans-serif" font-size="12" font-weight="600">
        +X = Forward Motion  •  +Y = Left  •  +Z = Up (Yaw Rotation)
      </text>
    </g>
  </g>
</svg>