<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <rect width="920" height="340" rx="16" fill="#0f172a"/>
  <text x="460" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">ROS 2 PYTHON LAUNCH SYSTEM EXECUTION ARCHITECTURE</text>

  <!-- Root: LaunchDescription -->
  <g transform="translate(300, 50)">
    <rect width="320" height="54" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="160" y="24" fill="#38bdf8" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">generate_launch_description()</text>
    <text x="160" y="42" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Returns: LaunchDescription([actions...])</text>
  </g>

  <!-- Connector branches -->
  <line x1="460" y1="104" x2="460" y2="135" stroke="#38bdf8" stroke-width="2"/>
  <line x1="160" y1="135" x2="760" y2="135" stroke="#38bdf8" stroke-width="2"/>

  <line x1="160" y1="135" x2="160" y2="165" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="155,163 165,163 160,171" fill="#38bdf8"/>

  <line x1="460" y1="135" x2="460" y2="165" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="455,163 465,163 460,171" fill="#38bdf8"/>

  <line x1="760" y1="135" x2="760" y2="165" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="755,163 765,163 760,171" fill="#38bdf8"/>

  <!-- Action 1: DeclareLaunchArgument -->
  <g transform="translate(60, 172)">
    <rect width="200" height="90" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="100" y="24" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">DeclareLaunchArgument</text>
    <text x="100" y="44" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">name: 'use_sim_time'</text>
    <text x="100" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">default_value: 'true'</text>
    <text x="100" y="76" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">CLI runtime flag</text>
  </g>

  <!-- Action 2: Node Action (Driver) -->
  <g transform="translate(360, 172)">
    <rect width="200" height="90" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="100" y="24" fill="#10b981" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Node Action</text>
    <text x="100" y="44" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">package: 'navpro_basics'</text>
    <text x="100" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">executable: 'motor_driver'</text>
    <text x="100" y="76" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">output: 'screen'</text>
  </g>

  <!-- Action 3: Node Action (Limiter / Remap) -->
  <g transform="translate(660, 172)">
    <rect width="200" height="90" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="100" y="24" fill="#a78bfa" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Node Action + Remap</text>
    <text x="100" y="44" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">executable: 'teleop_limiter'</text>
    <text x="100" y="60" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">parameters: [yaml_config]</text>
    <text x="100" y="76" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">remappings: [('/cmd_vel', ...)]</text>
  </g>

  <g transform="translate(60, 280)">
    <rect width="800" height="34" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="400" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Dynamic Python scripts allow os.path resolution, LaunchConfiguration lookups, and nested Includes.</text>
  </g>
</svg>
