<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="420" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <rect x="20" y="16" width="920" height="38" rx="6" fill="#0f172a"/>
  <text x="480" y="41" font-family="system-ui, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">
    NAV2 COSTMAP 2D: LAYERED ARCHITECTURE &amp; EXPONENTIAL INFLATION SAFETY ZONES
  </text>

  <!-- Left Side: Top-Down Visual Slices -->
  <g transform="translate(40, 75)" filter="url(#shadow)">
    <rect width="400" height="320" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="200" y="24" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">TOP-DOWN 2D COSTMAP CROSS-SECTION</text>

    <!-- Zone 4: Free Space -->
    <rect x="30" y="45" width="340" height="250" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text x="200" y="65" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">FREE SPACE (Cost = 0)</text>

    <!-- Zone 3: Inflation Layer -->
    <rect x="70" y="80" width="260" height="180" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="200" y="100" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#b45309" text-anchor="middle">INFLATION BUFFER (Cost = 252 - 1)</text>

    <!-- Zone 2: Inscribed Footprint -->
    <rect x="110" y="115" width="180" height="110" rx="6" fill="#fed7aa" stroke="#ea580c" stroke-width="1.5"/>
    <text x="200" y="135" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#c2410c" text-anchor="middle">INSCRIBED ZONE (Cost = 253)</text>

    <!-- Zone 1: Lethal Obstacle -->
    <rect x="150" y="150" width="100" height="40" rx="4" fill="#ef4444" stroke="#991b1b" stroke-width="1.5"/>
    <text x="200" y="174" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#ffffff" text-anchor="middle">LETHAL (254)</text>

    <!-- Robot Center Marker -->
    <circle cx="200" cy="210" r="4" fill="#0284c7"/>
    <text x="200" y="228" font-family="monospace" font-size="8" font-weight="700" fill="#0369a1" text-anchor="middle">AMR center</text>
  </g>

  <!-- Right Side: Zone Specifications Table -->
  <g transform="translate(470, 75)" filter="url(#shadow)">
    <rect width="450" height="320" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
    
    <!-- Row 1: Lethal -->
    <g transform="translate(20, 20)">
      <rect width="18" height="18" rx="3" fill="#ef4444"/>
      <text x="28" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#dc2626">1. Lethal Obstacle (Cost 254)</text>
      <text x="28" y="32" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">Physical obstacle hit by LiDAR ray. Passing here guarantees a crash.</text>
    </g>

    <!-- Row 2: Inscribed -->
    <g transform="translate(20, 75)">
      <rect width="18" height="18" rx="3" fill="#ea580c"/>
      <text x="28" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c2410c">2. Inscribed Obstacle (Cost 253)</text>
      <text x="28" y="32" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">Distance &lt; robot inscribed radius (r = 0.22m). Collision imminent.</text>
    </g>

    <!-- Row 3: Inflation Layer -->
    <g transform="translate(20, 130)">
      <rect width="18" height="18" rx="3" fill="#f59e0b"/>
      <text x="28" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b45309">3. Inflation Layer (Cost 252 - 1)</text>
      <text x="28" y="30" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">Smooth exponential safety gradient: cost decreases with distance d:</text>
      <rect x="28" y="36" width="380" height="24" rx="4" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="36" y="52" font-family="monospace" font-size="9" fill="#0369a1">cost = exp(-cost_scaling_factor * (d - r_inscribed)) * 253</text>
    </g>

    <!-- Row 4: Free Space -->
    <g transform="translate(20, 215)">
      <rect width="18" height="18" rx="3" fill="#16a34a"/>
      <text x="28" y="14" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#15803d">4. Free Space (Cost 0)</text>
      <text x="28" y="32" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">Unobstructed floor space where AMR maneuvers at full speed.</text>
    </g>

    <!-- Nexus AMR Footprint Rule -->
    <rect x="20" y="260" width="410" height="45" rx="6" fill="#eff6ff" stroke="#93c5fd"/>
    <text x="30" y="278" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#1d4ed8">NEXUS AMR CONFIGURATION RULE:</text>
    <text x="30" y="293" font-family="system-ui, sans-serif" font-size="8.5" fill="#1e40af">Use footprint: [[0.20,0.15],[-0.20,0.15],[-0.20,-0.15],[0.20,-0.15]] instead of round radius!</text>
  </g>
</svg>
