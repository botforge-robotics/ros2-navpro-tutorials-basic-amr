<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#0a1020" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="glowRed" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style><![CDATA[
      @keyframes arcRollout {
        0% { stroke-dashoffset: 400; opacity: 0.3; }
        50% { stroke-dashoffset: 0; opacity: 1; }
        85% { stroke-dashoffset: 0; opacity: 1; }
        100% { stroke-dashoffset: 400; opacity: 0.3; }
      }

      @keyframes pulseOptimal {
        0%, 100% { stroke-width: 4.5px; filter: drop-shadow(0 0 4px #10b981); }
        50% { stroke-width: 6.5px; filter: drop-shadow(0 0 10px #34d399); }
      }

      @keyframes publishVelocityPulse {
        0%, 40% { opacity: 0; transform: translateY(6px); }
        50%, 85% { opacity: 1; transform: translateY(0px); }
        95%, 100% { opacity: 0; transform: translateY(-4px); }
      }

      .animated-rollout {
        stroke-dasharray: 400;
        animation: arcRollout 6s ease-in-out infinite;
      }

      .optimal-arc {
        animation: pulseOptimal 2s ease-in-out infinite, arcRollout 6s ease-in-out infinite;
        stroke-dasharray: 400;
      }

      .cmd-vel-dispatch {
        animation: publishVelocityPulse 6s ease-in-out infinite;
      }
    ]]></style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="540" fill="url(#bgGrad)" rx="16" />
  <rect width="996" height="536" x="2" y="2" fill="none" stroke="#1e293b" stroke-width="2" rx="15" />

  <!-- Title & Header -->
  <g transform="translate(50, 42)">
    <rect x="0" y="-12" width="180" height="26" rx="6" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-width="1" />
    <text x="90" y="5" text-anchor="middle" fill="#34d399" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" letter-spacing="0.5px">
      DWB LOCAL CONTROLLER
    </text>
    <text x="195" y="6" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="18" font-weight="800">
      Forward Trajectory Rollouts &amp; Critic Scoring Engine (20 Hz)
    </text>
    <text x="0" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12">
      Simulates admissible (vx, ωz) velocity pairs, scores with critics, and outputs optimal /cmd_vel
    </text>
  </g>

  <!-- ========================================================================= -->
  <!-- MAIN SIMULATION CANVAS: GLOBAL PATH, TRAJECTORY ROLLOUTS & OBSTACLES      -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 95)">
    <!-- Arena Container -->
    <rect width="900" height="345" rx="12" fill="#070c18" stroke="#1e293b" stroke-width="1.5" />

    <!-- Grid Floor -->
    <g stroke="#1e293b" stroke-width="1" opacity="0.5">
      <line x1="0" y1="70" x2="900" y2="70" />
      <line x1="0" y1="140" x2="900" y2="140" />
      <line x1="0" y1="210" x2="900" y2="210" />
      <line x1="0" y1="280" x2="900" y2="280" />
      <line x1="150" y1="0" x2="150" y2="345" />
      <line x1="300" y1="0" x2="300" y2="345" />
      <line x1="450" y1="0" x2="450" y2="345" />
      <line x1="600" y1="0" x2="600" y2="345" />
      <line x1="750" y1="0" x2="750" y2="345" />
    </g>

    <!-- Global Plan Reference Spline (/plan from Global Planner) -->
    <path d="M 120,240 C 260,240 380,120 540,110 C 680,100 760,180 840,180" fill="none" stroke="#0ea5e9" stroke-width="4" stroke-dasharray="8,6" opacity="0.8" />
    <g transform="translate(580, 85)">
      <rect x="-80" y="-12" width="160" height="24" rx="4" fill="#0f172a" stroke="#0ea5e9" stroke-width="1" />
      <text x="0" y="4" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11" font-weight="700">Global Plan (/plan)</text>
    </g>

    <!-- Warehouse Obstacle (Pallet Rack) causing Collision -->
    <g transform="translate(420, 210)">
      <rect width="110" height="75" rx="6" fill="#1e1b2e" stroke="#ef4444" stroke-width="2" />
      <line x1="0" y1="0" x2="110" y2="75" stroke="#ef4444" stroke-width="1" opacity="0.4" />
      <line x1="110" y1="0" x2="0" y2="75" stroke="#ef4444" stroke-width="1" opacity="0.4" />
      <!-- Inflation Bubble -->
      <rect x="-20" y="-20" width="150" height="115" rx="12" fill="none" stroke="#f97316" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.6" />
      <text x="55" y="42" text-anchor="middle" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="800">
        OBSTACLE
      </text>
      <text x="55" y="58" text-anchor="middle" fill="#f87171" font-family="monospace" font-size="9.5">Cost: 254</text>
    </g>

    <!-- ================= CANDIDATE TRAJECTORY ROLLOUT ARCS ================= -->
    <!-- Arc 1: Colliding straight-right arc (Red, BaseObstacle Critic Fails) -->
    <path d="M 120,240 C 250,240 360,260 440,260" fill="none" stroke="#ef4444" stroke-width="2.5" class="animated-rollout" opacity="0.8" />
    <circle cx="440" cy="260" r="5" fill="#ef4444" filter="url(#glowRed)" />
    <g transform="translate(470, 290)">
      <rect x="-70" y="-12" width="140" height="22" rx="4" fill="#0f172a" stroke="#ef4444" stroke-width="1" />
      <text x="0" y="3" text-anchor="middle" fill="#f87171" font-family="system-ui, sans-serif" font-size="10" font-weight="800">
        ❌ BaseObstacle: ∞
      </text>
    </g>

    <!-- Arc 2: Sharp Right (Red, Colliding) -->
    <path d="M 120,240 C 240,240 330,290 420,285" fill="none" stroke="#ef4444" stroke-width="2" class="animated-rollout" opacity="0.6" />

    <!-- Arc 3: Extreme Left Divergence (Amber, High PathAlign / PathDist Penalty) -->
    <path d="M 120,240 C 200,240 240,60 380,45" fill="none" stroke="#f59e0b" stroke-width="2.2" class="animated-rollout" opacity="0.7" />
    <g transform="translate(380, 35)">
      <text x="0" y="0" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10" font-weight="700">⚠️ High PathAlign Penalty</text>
    </g>

    <!-- Arc 4: Moderate Left (Amber, Sub-optimal) -->
    <path d="M 120,240 C 220,240 270,110 420,95" fill="none" stroke="#f59e0b" stroke-width="2" class="animated-rollout" opacity="0.7" />

    <!-- Arc 5: Mild Left (Amber, Acceptable but slower progress) -->
    <path d="M 120,240 C 240,240 300,160 460,140" fill="none" stroke="#eab308" stroke-width="2" class="animated-rollout" opacity="0.7" />

    <!-- Arc 6: OPTIMAL CHOSEN TRAJECTORY (Emerald Green) -->
    <!-- Hugs the curve cleanly, avoids obstacle inflation, maximizes progress -->
    <path d="M 120,240 C 260,240 350,145 510,130" fill="none" stroke="#10b981" stroke-width="5" class="optimal-arc" filter="url(#glowGreen)" />
    <circle cx="510" cy="130" r="7" fill="#10b981" filter="url(#glowGreen)" />
    
    <!-- Winning Critic Score Callout Badge -->
    <g class="cmd-vel-dispatch" transform="translate(490, 160)">
      <rect x="-10" y="-14" width="230" height="42" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1.8" />
      <text x="105" y="2" text-anchor="middle" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="11.5" font-weight="900">
        ⭐ OPTIMAL TRAJECTORY WINNER
      </text>
      <text x="105" y="20" text-anchor="middle" fill="#ecfdf5" font-family="ui-monospace, monospace" font-size="10.5" font-weight="700">
        /cmd_vel: vx=0.45 m/s | ωz=+0.12 rad/s
      </text>
    </g>

    <!-- Starting AMR Robot Model (at x=120, y=240) -->
    <g transform="translate(120, 240)">
      <!-- Robot Body -->
      <rect x="-24" y="-18" width="48" height="36" rx="8" fill="#0284c7" stroke="#38bdf8" stroke-width="2" />
      <!-- Drive Wheels -->
      <rect x="-14" y="-23" width="28" height="5" rx="2" fill="#0f172a" stroke="#94a3b8" stroke-width="1.2" />
      <rect x="-14" y="18" width="28" height="5" rx="2" fill="#0f172a" stroke="#94a3b8" stroke-width="1.2" />
      <!-- Front Direction Bumper -->
      <polygon points="24,-10 32,0 24,10" fill="#38bdf8" />
      <!-- Top LiDAR -->
      <circle r="7" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" />
      <circle r="3" fill="#ef4444" />
      <text x="0" y="38" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10.5" font-weight="800">AMR (20 Hz)</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- BOTTOM STRIP: 4 DWB CRITICS EXPLANATION MATRIX                            -->
  <!-- ========================================================================= -->
  <g transform="translate(50, 455)">
    <rect width="900" height="65" rx="10" fill="#0f172a" stroke="#1e293b" stroke-width="1.5" />

    <g transform="translate(20, 20)" font-family="system-ui, sans-serif">
      <!-- Critic 1: BaseObstacle -->
      <g transform="translate(0, 0)">
        <text x="0" y="8" fill="#ef4444" font-size="11.5" font-weight="800">1. BaseObstacleCritic</text>
        <text x="0" y="25" fill="#94a3b8" font-size="10.5">Discards collisions (cost ≥ 253)</text>
      </g>

      <!-- Critic 2: PathAlign -->
      <g transform="translate(215, 0)">
        <text x="0" y="8" fill="#38bdf8" font-size="11.5" font-weight="800">2. PathAlignCritic</text>
        <text x="0" y="25" fill="#94a3b8" font-size="10.5">Tracks global path closely</text>
      </g>

      <!-- Critic 3: GoalAlign -->
      <g transform="translate(430, 0)">
        <text x="0" y="8" fill="#f59e0b" font-size="11.5" font-weight="800">3. GoalAlignCritic</text>
        <text x="0" y="25" fill="#94a3b8" font-size="10.5">Aligns heading with goal yaw</text>
      </g>

      <!-- Critic 4: Oscillation -->
      <g transform="translate(645, 0)">
        <text x="0" y="8" fill="#10b981" font-size="11.5" font-weight="800">4. OscillationCritic</text>
        <text x="0" y="25" fill="#94a3b8" font-size="10.5">Suppresses steering chatter</text>
      </g>
    </g>
  </g>
</svg>
