<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 280" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-2%" y="-5%" width="104%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Outer Canvas Card -->
  <rect width="920" height="280" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- Header Title -->
  <g transform="translate(460, 28)" text-anchor="middle">
    <rect x="-180" y="-16" width="360" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="0" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1">ROS 2 ENVIRONMENT CHAINING: OVERLAY VS. UNDERLAY</text>
  </g>

  <!-- Overlay Box (Top Priority - Custom Workspace) -->
  <g transform="translate(110, 52)" filter="url(#cardShadow)">
    <rect width="700" height="78" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <rect x="18" y="14" width="110" height="24" rx="6" fill="#0284c7"/>
    <text x="73" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">PRIORITY 1</text>
    
    <text x="148" y="31" fill="#0369a1" font-family="ui-monospace, monospace" font-size="13" font-weight="800">WORKSPACE OVERLAY: ~/ros2_ws/install/setup.bash</text>
    <text x="148" y="55" fill="#334155" font-family="system-ui, sans-serif" font-size="11.5">Custom robot nodes, user-compiled packages, interface bindings, and local package overrides.</text>
    <circle cx="675" cy="39" r="10" fill="#e0f2fe"/>
    <text x="675" y="43" fill="#0284c7" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">↑</text>
  </g>

  <!-- Arrow pointing up (Overlay inherits from Underlay) -->
  <g transform="translate(460, 130)">
    <line x1="0" y1="46" x2="0" y2="10" stroke="#0284c7" stroke-width="2.5" stroke-dasharray="4,3"/>
    <polygon points="-5,12 5,12 0,4" fill="#0284c7"/>
    
    <rect x="-75" y="20" width="150" height="20" rx="10" fill="#ffffff" stroke="#bae6fd" stroke-width="1.5"/>
    <text x="0" y="34" fill="#0284c7" font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">inherits / chains onto</text>
  </g>

  <!-- Underlay Box (System Core - Pre-installed ROS 2) -->
  <g transform="translate(110, 180)" filter="url(#cardShadow)">
    <rect width="700" height="78" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
    <rect x="18" y="14" width="110" height="24" rx="6" fill="#475569"/>
    <text x="73" y="30" fill="#ffffff" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">BASE SYSTEM</text>
    
    <text x="148" y="31" fill="#1e293b" font-family="ui-monospace, monospace" font-size="13" font-weight="800">CORE SYSTEM UNDERLAY: /opt/ros/jazzy/setup.bash</text>
    <text x="148" y="55" fill="#475569" font-family="system-ui, sans-serif" font-size="11.5">Standard ROS 2 Jazzy core distribution, Nav2 binaries, rclpy, tf2, and system messages.</text>
    <circle cx="675" cy="39" r="10" fill="#e2e8f0"/>
    <text x="675" y="43" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="700" text-anchor="middle">⚙️</text>
  </g>
</svg>