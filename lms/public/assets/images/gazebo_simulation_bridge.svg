<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <rect x="20" y="16" width="920" height="40" rx="6" fill="#0284c7"/>
  <text x="480" y="41" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">
    GAZEBO SIMULATION BRIDGE: ODE PHYSICS ENGINE &lt;---&gt; ROS 2 DDS MIDDLEWARE
  </text>

  <!-- Left: Gazebo Physics World -->
  <g transform="translate(30, 75)" filter="url(#shadow)">
    <rect width="270" height="335" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="270" height="34" rx="6" fill="#334155"/>
    <text x="135" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">GAZEBO ODE PHYSICS ENGINE</text>

    <text x="20" y="60" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0f172a">Simulated World Mechanics:</text>
    <text x="20" y="80" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">• Rigid Body Inertia Tensors (Ixx, Iyy, Izz)</text>
    <text x="20" y="98" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">• Gravity Vector: (0, 0, -9.81 m/s²)</text>
    <text x="20" y="116" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">• Drive Wheel Friction: mu1=1.2, mu2=1.2</text>
    <text x="20" y="134" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">• Passive Caster Friction: mu=0.001</text>
    <text x="20" y="152" font-family="system-ui, sans-serif" font-size="9.5" fill="#475569">• ODE Solver Step Size: 0.001s (1000 Hz)</text>

    <!-- Visual 3D Robot Silhouette -->
    <rect x="35" y="180" width="200" height="135" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="60" y="210" width="150" height="75" rx="4" fill="#e0f2fe" stroke="#0284c7" stroke-width="1.5"/>
    <text x="135" y="248" font-family="monospace" font-size="11" font-weight="700" fill="#0369a1" text-anchor="middle">nexus_amr (URDF)</text>
    <text x="135" y="265" font-family="system-ui, sans-serif" font-size="8.5" fill="#64748b" text-anchor="middle">40x30x14cm • 8.0kg</text>
    <!-- Wheels -->
    <rect x="48" y="225" width="12" height="45" rx="2" fill="#1e293b"/>
    <rect x="210" y="225" width="12" height="45" rx="2" fill="#1e293b"/>
    <!-- LiDAR -->
    <circle cx="135" cy="200" r="14" fill="#f97316"/>
  </g>

  <!-- Center: Plugins Bridge -->
  <g transform="translate(340, 75)" filter="url(#shadow)">
    <rect width="280" height="335" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="34" rx="6" fill="#16a34a"/>
    <text x="140" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">ROS 2 GAZEBO PLUGINS</text>

    <g transform="translate(15, 50)">
      <rect width="250" height="75" rx="6" fill="#ffffff" stroke="#16a34a" stroke-width="1"/>
      <text x="125" y="18" font-family="monospace" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">libgazebo_ros_diff_drive.so</text>
      <text x="12" y="36" font-family="system-ui, sans-serif" font-size="9" fill="#475569">• Subscribes: /cmd_vel (Twist)</text>
      <text x="12" y="50" font-family="system-ui, sans-serif" font-size="9" fill="#475569">• Applies wheel torques to joints</text>
      <text x="12" y="64" font-family="system-ui, sans-serif" font-size="9" fill="#475569">• Integrates &amp; publishes: /odom, TF</text>
    </g>

    <g transform="translate(15, 140)">
      <rect width="250" height="75" rx="6" fill="#ffffff" stroke="#f97316" stroke-width="1"/>
      <text x="125" y="18" font-family="monospace" font-size="10" font-weight="700" fill="#c2410c" text-anchor="middle">libgazebo_ros_ray_sensor.so</text>
      <text x="12" y="36" font-family="system-ui, sans-serif" font-size="9" fill="#475569">• Casts 360 rays across 8.0m range</text>
      <text x="12" y="50" font-family="system-ui, sans-serif" font-size="9" fill="#475569">• Computes ray-obstacle collisions</text>
      <text x="12" y="64" font-family="system-ui, sans-serif" font-size="9" fill="#475569">• Streams /scan (LaserScan) @ 10 Hz</text>
    </g>

    <g transform="translate(15, 230)">
      <rect width="250" height="75" rx="6" fill="#ffffff" stroke="#9333ea" stroke-width="1"/>
      <text x="125" y="18" font-family="monospace" font-size="10" font-weight="700" fill="#7e22ce" text-anchor="middle">libgazebo_ros_camera.so</text>
      <text x="12" y="36" font-family="system-ui, sans-serif" font-size="9" fill="#475569">• Optical frustum rendering (640x480)</text>
      <text x="12" y="50" font-family="system-ui, sans-serif" font-size="9" fill="#475569">• REP 103 optical frame rotation</text>
      <text x="12" y="64" font-family="system-ui, sans-serif" font-size="9" fill="#475569">• Streams /camera/image_raw @ 30 FPS</text>
    </g>
  </g>

  <!-- Right: ROS 2 Nodes & Topics -->
  <g transform="translate(660, 75)" filter="url(#shadow)">
    <rect width="270" height="335" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="0" y="0" width="270" height="34" rx="6" fill="#2563eb"/>
    <text x="135" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">ROS 2 DDS COMPUTATIONAL GRAPH</text>

    <g transform="translate(15, 50)">
      <rect width="240" height="55" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="120" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">Nav2 Controller / Teleop</text>
      <text x="120" y="38" font-family="monospace" font-size="9.5" fill="#2563eb" text-anchor="middle">──► /cmd_vel ──►</text>
    </g>

    <g transform="translate(15, 120)">
      <rect width="240" height="55" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="120" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">SLAM Toolbox (L18)</text>
      <text x="120" y="38" font-family="monospace" font-size="9.5" fill="#15803d" text-anchor="middle">◄── /scan &amp; /odom ◄──</text>
    </g>

    <g transform="translate(15, 190)">
      <rect width="240" height="55" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="120" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">Costmap 2D (L19)</text>
      <text x="120" y="38" font-family="monospace" font-size="9.5" fill="#0369a1" text-anchor="middle">◄── /scan + footprint ◄──</text>
    </g>

    <g transform="translate(15, 260)">
      <rect width="240" height="55" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="120" y="18" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">RViz2 / OpenCV Vision</text>
      <text x="120" y="38" font-family="monospace" font-size="9.5" fill="#7e22ce" text-anchor="middle">◄── /camera/image_raw ◄──</text>
    </g>
  </g>

  <!-- Connectors -->
  <line x1="300" y1="120" x2="340" y2="120" stroke="#16a34a" stroke-width="2"/>
  <line x1="300" y1="210" x2="340" y2="210" stroke="#f97316" stroke-width="2"/>
  <line x1="300" y1="300" x2="340" y2="300" stroke="#9333ea" stroke-width="2"/>

  <line x1="620" y1="120" x2="660" y2="120" stroke="#16a34a" stroke-width="2"/>
  <line x1="620" y1="210" x2="660" y2="210" stroke="#f97316" stroke-width="2"/>
  <line x1="620" y1="300" x2="660" y2="300" stroke="#9333ea" stroke-width="2"/>
</svg>
