<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="100%" height="100%">
  <defs>
    <filter id="winShadow" x="-2%" y="-3%" width="104%" height="108%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="800" height="380" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Terminator Window Frame -->
  <g filter="url(#winShadow)">
    <rect x="25" y="25" width="750" height="330" rx="8" fill="#0f172a"/>
    <!-- Window Titlebar -->
    <path d="M 25 33 A 8 8 0 0 1 33 25 L 767 25 A 8 8 0 0 1 775 33 L 775 58 L 25 58 Z" fill="#1e293b"/>
    <circle cx="45" cy="42" r="5.5" fill="#f43f5e"/>
    <circle cx="63" cy="42" r="5.5" fill="#f59e0b"/>
    <circle cx="81" cy="42" r="5.5" fill="#10b981"/>
    <text x="400" y="46" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#94a3b8" text-anchor="middle">Terminator — 4-Pane Robotics Workflow (Ctrl+Shift+O / Ctrl+Shift+E)</text>

    <!-- Pane 1: Top Left (Bringup Launch) -->
    <rect x="35" y="68" width="365" height="135" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <rect x="35" y="68" width="365" height="24" fill="#1e293b"/>
    <text x="45" y="84" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8">Pane 1: Bringup / Gazebo Simulation</text>
    <text x="45" y="112" font-family="monospace" font-size="12" fill="#e2e8f0">$ ros2 launch navpro_gazebo sim_world.launch.py</text>
    <text x="45" y="132" font-family="monospace" font-size="11" fill="#10b981">[INFO] [gzserver]: Spawning navpro robot at (0, 0, 0)...</text>
    <text x="45" y="152" font-family="monospace" font-size="11" fill="#64748b">[INFO] [robot_state_publisher]: Published URDF to /robot_description</text>

    <!-- Pane 2: Top Right (Teleop Twist) -->
    <rect x="410" y="68" width="355" height="135" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <rect x="410" y="68" width="355" height="24" fill="#1e293b"/>
    <text x="420" y="84" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8">Pane 2: Teleoperation &amp; Manual Drive</text>
    <text x="420" y="112" font-family="monospace" font-size="12" fill="#e2e8f0">$ ros2 run teleop_twist_keyboard teleop_twist_keyboard</text>
    <text x="420" y="132" font-family="monospace" font-size="11" fill="#f59e0b">Moving around: u i o / j k l / m , .</text>
    <text x="420" y="152" font-family="monospace" font-size="11" fill="#64748b">Publishing geometry_msgs/Twist on /cmd_vel</text>

    <!-- Pane 3: Bottom Left (RViz2) -->
    <rect x="35" y="213" width="365" height="130" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <rect x="35" y="213" width="365" height="24" fill="#1e293b"/>
    <text x="45" y="229" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8">Pane 3: RViz2 Sensor Visualization</text>
    <text x="45" y="257" font-family="monospace" font-size="12" fill="#e2e8f0">$ rviz2 -d src/navpro_description/rviz/robot.rviz</text>
    <text x="45" y="277" font-family="monospace" font-size="11" fill="#10b981">[INFO] [rviz2]: Stereo view active, Fixed Frame: odom</text>
    <text x="45" y="297" font-family="monospace" font-size="11" fill="#64748b">[INFO] [rviz2]: LaserScan: 360 beams received on /scan</text>

    <!-- Pane 4: Bottom Right (Topic Echo & CLI) -->
    <rect x="410" y="213" width="355" height="130" fill="#090d16" stroke="#334155" stroke-width="1"/>
    <rect x="410" y="213" width="355" height="24" fill="#1e293b"/>
    <text x="420" y="229" font-family="monospace" font-size="11" font-weight="bold" fill="#38bdf8">Pane 4: Live Telemetry &amp; CLI Debugging</text>
    <text x="420" y="257" font-family="monospace" font-size="12" fill="#e2e8f0">$ ros2 topic echo /cmd_vel</text>
    <text x="420" y="277" font-family="monospace" font-size="11" fill="#38bdf8">linear: {x: 0.5, y: 0.0, z: 0.0}</text>
    <text x="420" y="297" font-family="monospace" font-size="11" fill="#38bdf8">angular: {x: 0.0, y: 0.0, z: 0.25}</text>
  </g>
</svg>
