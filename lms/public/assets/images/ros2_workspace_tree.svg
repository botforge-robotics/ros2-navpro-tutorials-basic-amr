<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="100%">
  <defs>
    <linearGradient id="wsTreeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="wsBoxShadow" x="-3%" y="-6%" width="106%" height="116%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="880" height="430" rx="12" fill="url(#wsTreeBg)" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Diagram Header -->
  <text x="440" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="0.5">ROS 2 WORKSPACE FILESYSTEM HIERARCHY (~/ros2_ws)</text>
  <text x="440" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#64748b" text-anchor="middle">Standard 4-Directory Layout Managed by Colcon Build Tool</text>

  <!-- Root Node: ~/ros2_ws -->
  <g filter="url(#wsBoxShadow)">
    <rect x="330" y="66" width="220" height="42" rx="8" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
    <text x="440" y="92" font-family="monospace" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">📁 ~/ros2_ws (Workspace)</text>
  </g>

  <!-- Connecting Trunk lines -->
  <path d="M 440 108 L 440 132" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 115 132 L 765 132" stroke="#94a3b8" stroke-width="2"/>

  <!-- Drops to the 4 main workspace directories -->
  <path d="M 115 132 L 115 155" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 330 132 L 330 155" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 550 132 L 550 155" stroke="#94a3b8" stroke-width="2"/>
  <path d="M 765 132 L 765 155" stroke="#94a3b8" stroke-width="2"/>

  <!-- Node 1: src/ -->
  <g filter="url(#wsBoxShadow)">
    <rect x="20" y="155" width="195" height="135" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="2"/>
    <rect x="28" y="163" width="179" height="26" rx="5" fill="#e0f2fe"/>
    <text x="117" y="181" font-family="monospace" font-size="14" font-weight="800" fill="#0369a1" text-anchor="middle">📁 src/</text>
    
    <rect x="52" y="196" width="130" height="18" rx="4" fill="#0284c7"/>
    <text x="117" y="209" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">✍️ USER MAINTAINED</text>
    
    <text x="117" y="230" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Source Packages &amp; Nodes</text>
    <text x="32" y="252" font-family="monospace" font-size="10" fill="#475569">├── nexus_amr_controller/</text>
    <text x="32" y="268" font-family="monospace" font-size="10" fill="#475569">└── nexus_amr_teleop/</text>
    <text x="117" y="284" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600" fill="#0284c7" text-anchor="middle">Only directory you edit</text>
  </g>

  <!-- Node 2: build/ -->
  <g filter="url(#wsBoxShadow)">
    <rect x="235" y="155" width="195" height="135" rx="8" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <rect x="243" y="163" width="179" height="26" rx="5" fill="#fef3c7"/>
    <text x="332" y="181" font-family="monospace" font-size="14" font-weight="800" fill="#b45309" text-anchor="middle">⚙️ build/</text>
    
    <rect x="267" y="196" width="130" height="18" rx="4" fill="#d97706"/>
    <text x="332" y="209" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">🤖 COLCON GENERATED</text>
    
    <text x="332" y="230" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Intermediate Caches</text>
    <text x="247" y="252" font-family="monospace" font-size="10" fill="#475569">├── nexus_amr_controller/</text>
    <text x="247" y="268" font-family="monospace" font-size="10" fill="#475569">└── CMakeCache.txt</text>
    <text x="332" y="284" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600" fill="#d97706" text-anchor="middle">Never edit manually</text>
  </g>

  <!-- Node 3: install/ -->
  <g filter="url(#wsBoxShadow)">
    <rect x="450" y="155" width="195" height="135" rx="8" fill="#ffffff" stroke="#059669" stroke-width="2"/>
    <rect x="458" y="163" width="179" height="26" rx="5" fill="#d1fae5"/>
    <text x="547" y="181" font-family="monospace" font-size="14" font-weight="800" fill="#047857" text-anchor="middle">🚀 install/</text>
    
    <rect x="482" y="196" width="130" height="18" rx="4" fill="#059669"/>
    <text x="547" y="209" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">📦 RUNTIME OVERLAY</text>
    
    <text x="547" y="230" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Executables &amp; Setup</text>
    <text x="462" y="252" font-family="monospace" font-size="10" font-weight="bold" fill="#059669">├── setup.bash (Source!)</text>
    <text x="462" y="268" font-family="monospace" font-size="10" fill="#475569">└── nexus_amr_controller/lib/</text>
    <text x="547" y="284" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600" fill="#059669" text-anchor="middle">ROS 2 executes from here</text>
  </g>

  <!-- Node 4: log/ -->
  <g filter="url(#wsBoxShadow)">
    <rect x="665" y="155" width="195" height="135" rx="8" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="673" y="163" width="179" height="26" rx="5" fill="#ede9fe"/>
    <text x="762" y="181" font-family="monospace" font-size="14" font-weight="800" fill="#6d28d9" text-anchor="middle">📊 log/</text>
    
    <rect x="697" y="196" width="130" height="18" rx="4" fill="#7c3aed"/>
    <text x="762" y="209" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">📋 BUILD DIAGNOSTICS</text>
    
    <text x="762" y="230" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" fill="#1e293b" text-anchor="middle">Build History &amp; Errors</text>
    <text x="677" y="252" font-family="monospace" font-size="10" fill="#475569">├── build_latest/</text>
    <text x="677" y="268" font-family="monospace" font-size="10" fill="#475569">└── logger_all.log</text>
    <text x="762" y="284" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="600" fill="#7c3aed" text-anchor="middle">Check if build fails</text>
  </g>

  <!-- Legend & Bottom Golden Rules Box (Identical structure to Lesson 1) -->
  <rect x="20" y="308" width="840" height="106" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
  <text x="42" y="332" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="800" fill="#0f172a">🎯 Golden Rules for ROS 2 Workspace Directories:</text>
  <text x="42" y="354" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#334155">• <tspan font-family="monospace" font-weight="bold" fill="#0284c7">src/</tspan> is the <tspan font-weight="bold">ONLY</tspan> directory you write and edit code in — all custom packages, nodes, and launch scripts reside here.</text>
  <text x="42" y="374" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#334155">• <tspan font-family="monospace" font-weight="bold" fill="#d97706">build/</tspan>, <tspan font-family="monospace" font-weight="bold" fill="#059669">install/</tspan>, and <tspan font-family="monospace" font-weight="bold" fill="#7c3aed">log/</tspan> are completely automated by <tspan font-family="monospace" font-weight="bold">colcon build</tspan> — you can safely delete them anytime for a clean rebuild.</text>
  <text x="42" y="394" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#334155">• Sourcing <tspan font-family="monospace" font-weight="bold" fill="#059669">install/setup.bash</tspan> is essential — it updates your environment variables (<tspan font-family="monospace">AMENT_PREFIX_PATH</tspan>) so ROS 2 discovers your new nodes.</text>
</svg>
