<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-3%" y="-5%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Outer Canvas Card -->
  <rect width="900" height="320" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- Header Title -->
  <g transform="translate(450, 28)" text-anchor="middle">
    <rect x="-215" y="-16" width="430" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="0" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1">NAV2 BEHAVIOR TREE (BT) RECOVERY &amp; NAVIGATION PIPELINE</text>
  </g>

  <!-- Root Sequence -->
  <g transform="translate(370, 52)" filter="url(#cardShadow)">
    <rect width="160" height="44" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <text x="80" y="27" fill="#0369a1" font-family="ui-monospace, monospace" font-size="13" font-weight="800" text-anchor="middle">Sequence (➔)</text>
  </g>

  <!-- Children -->
  <!-- ComputePathToPose -->
  <g transform="translate(100, 138)" filter="url(#cardShadow)">
    <rect width="180" height="48" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
    <text x="90" y="23" fill="#047857" font-family="ui-monospace, monospace" font-size="11" font-weight="800" text-anchor="middle">ComputePathToPose</text>
    <text x="90" y="39" fill="#475569" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Global Smac / NavFn</text>
  </g>

  <!-- FollowPath -->
  <g transform="translate(360, 138)" filter="url(#cardShadow)">
    <rect width="180" height="48" rx="8" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="90" y="23" fill="#b45309" font-family="ui-monospace, monospace" font-size="11" font-weight="800" text-anchor="middle">FollowPath (DWB)</text>
    <text x="90" y="39" fill="#475569" font-family="system-ui, sans-serif" font-size="9.5" text-anchor="middle">Local Controller 20Hz</text>
  </g>

  <!-- Recovery Fallback -->
  <g transform="translate(620, 138)" filter="url(#cardShadow)">
    <rect width="180" height="48" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.5"/>
    <text x="90" y="23" fill="#b91c1c" font-family="ui-monospace, monospace" font-size="11" font-weight="800" text-anchor="middle">Recovery Fallback (?)</text>
    <text x="90" y="39" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Triggered on Failure</text>
  </g>

  <!-- Lines from Root -->
  <line x1="410" y1="96" x2="190" y2="138" stroke="#0284c7" stroke-width="1.8"/>
  <line x1="450" y1="96" x2="450" y2="138" stroke="#0284c7" stroke-width="1.8"/>
  <line x1="490" y1="96" x2="710" y2="138" stroke="#0284c7" stroke-width="1.8"/>

  <!-- Sub-Recoveries -->
  <g transform="translate(530, 226)" filter="url(#cardShadow)">
    <rect width="110" height="38" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="55" y="23" fill="#e11d48" font-family="ui-monospace, monospace" font-size="10" font-weight="800" text-anchor="middle">ClearCostmap</text>
  </g>
  <g transform="translate(660, 226)" filter="url(#cardShadow)">
    <rect width="100" height="38" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="50" y="23" fill="#e11d48" font-family="ui-monospace, monospace" font-size="10" font-weight="800" text-anchor="middle">BackUp (0.3m)</text>
  </g>
  <g transform="translate(780, 226)" filter="url(#cardShadow)">
    <rect width="90" height="38" rx="6" fill="#ffffff" stroke="#f43f5e" stroke-width="1.2"/>
    <text x="45" y="23" fill="#e11d48" font-family="ui-monospace, monospace" font-size="10" font-weight="800" text-anchor="middle">Spin (360°)</text>
  </g>

  <line x1="710" y1="186" x2="585" y2="226" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="710" y1="186" x2="710" y2="226" stroke="#ef4444" stroke-width="1.5"/>
  <line x1="710" y1="186" x2="825" y2="226" stroke="#ef4444" stroke-width="1.5"/>

  <text x="450" y="298" fill="#475569" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Status Flow: <tspan fill="#047857" font-weight="800">SUCCESS (Green)</tspan> continues to next node; <tspan fill="#b91c1c" font-weight="800">FAILURE (Red)</tspan> trips fallback recovery behaviors.</text>
</svg>