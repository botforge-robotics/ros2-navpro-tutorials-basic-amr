<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" width="100%" height="100%">
  <defs>
    <radialGradient id="inflationGradLight" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#f97316" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#eab308" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </radialGradient>
    <filter id="cardShadow" x="-3%" y="-5%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Outer Canvas Card -->
  <rect width="900" height="300" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- Header Title -->
  <g transform="translate(450, 28)" text-anchor="middle">
    <rect x="-205" y="-16" width="410" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="0" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1">NAV2 COSTMAP 2D: MULTI-LAYER INFLATION ANATOMY</text>
  </g>

  <!-- Concentric Rings Graphic -->
  <g transform="translate(230, 165)">
    <!-- Inflation Zone (Cost 1 to 252) -->
    <circle cx="0" cy="0" r="105" fill="url(#inflationGradLight)" stroke="#eab308" stroke-width="1.5" stroke-dasharray="4,4"/>
    <!-- Inscribed Radius (Cost 253: Inscribed collision) -->
    <circle cx="0" cy="0" r="58" fill="#f97316" fill-opacity="0.25" stroke="#f97316" stroke-width="2"/>
    <!-- Lethal Obstacle (Cost 254: Wall / Pillar) -->
    <rect x="-22" y="-22" width="44" height="44" rx="4" fill="#ef4444" stroke="#b91c1c" stroke-width="2"/>
    <text x="0" y="5" fill="#ffffff" font-family="system-ui, sans-serif" font-size="9" font-weight="800" text-anchor="middle">LETHAL</text>
  </g>

  <!-- Legend & Cost Explanation -->
  <g transform="translate(460, 55)">
    <!-- Lethal Row -->
    <rect x="0" y="10" width="22" height="22" rx="4" fill="#ef4444" stroke="#b91c1c" stroke-width="1"/>
    <text x="34" y="25" fill="#b91c1c" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Lethal Obstacle (Cost 254)</text>
    <text x="34" y="42" fill="#334155" font-family="system-ui, sans-serif" font-size="11">Physical object geometry detected by LiDAR or Static Map.</text>

    <!-- Inscribed Row -->
    <rect x="0" y="65" width="22" height="22" rx="4" fill="#f97316" stroke="#ea580c" stroke-width="1"/>
    <text x="34" y="80" fill="#c2410c" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Inscribed Collision (Cost 253)</text>
    <text x="34" y="97" fill="#334155" font-family="system-ui, sans-serif" font-size="11">Radius equal to robot center-to-chassis boundary. Inevitable collision.</text>

    <!-- Inflation Row -->
    <rect x="0" y="120" width="22" height="22" rx="4" fill="#eab308" stroke="#ca8a04" stroke-width="1"/>
    <text x="34" y="135" fill="#854d0e" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Inflation Zone (Cost 1 - 252)</text>
    <text x="34" y="152" fill="#0f172a" font-family="ui-monospace, monospace" font-size="10.5" font-weight="600">Cost = 253 · exp(-α · (distance - r_inscribed))</text>

    <!-- Free Space Row -->
    <rect x="0" y="175" width="22" height="22" rx="4" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <text x="34" y="190" fill="#0369a1" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Free Space (Cost 0)</text>
    <text x="34" y="207" fill="#334155" font-family="system-ui, sans-serif" font-size="11">Safe traversable floor area where global paths prefer to plan.</text>
  </g>
</svg>