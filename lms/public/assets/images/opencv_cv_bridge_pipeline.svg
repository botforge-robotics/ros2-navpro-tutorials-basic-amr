<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <!-- Canvas Background -->
  <rect width="920" height="340" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="460" y="32" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1">ROS 2 SENSOR_MSGS &lt;-&gt; OPENCV NUMPY (CV_BRIDGE) PIPELINE</text>

  <!-- Left: ROS 2 Image Message -->
  <g transform="translate(60, 60)">
    <rect width="320" height="180" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="320" height="34" rx="12" fill="#0284c7"/>
    <rect y="22" width="320" height="12" fill="#0284c7"/>
    <text x="160" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ROS 2: sensor_msgs/msg/Image</text>
    
    <text x="20" y="65" fill="#0369a1" font-family="monospace" font-size="11" font-weight="600">• header: Header (stamp, frame_id)</text>
    <text x="20" y="90" fill="#0f172a" font-family="monospace" font-size="11">• height: 480, width: 640</text>
    <text x="20" y="115" fill="#0f172a" font-family="monospace" font-size="11">• encoding: "bgr8"</text>
    <text x="20" y="140" fill="#475569" font-family="monospace" font-size="11">• data: uint8[] (serialized bytes)</text>
    <text x="20" y="165" fill="#64748b" font-family="sans-serif" font-size="10.5" font-weight="500">DDS Network Transport Wire Format</text>
  </g>

  <!-- Middle: cv_bridge Arrows -->
  <g transform="translate(400, 110)">
    <!-- Right arrow: imgmsg_to_cv2 -->
    <line x1="0" y1="0" x2="110" y2="0" stroke="#16a34a" stroke-width="2.5"/>
    <polygon points="105,-6 117,0 105,6" fill="#16a34a"/>
    <text x="55" y="-12" fill="#15803d" font-family="monospace" font-size="10.5" font-weight="bold" text-anchor="middle">imgmsg_to_cv2()</text>

    <!-- Left arrow: cv2_to_imgmsg -->
    <line x1="110" y1="45" x2="0" y2="45" stroke="#d97706" stroke-width="2.5"/>
    <polygon points="5,39 -7,45 5,51" fill="#d97706"/>
    <text x="55" y="66" fill="#b45309" font-family="monospace" font-size="10.5" font-weight="bold" text-anchor="middle">cv2_to_imgmsg()</text>
  </g>

  <!-- Right: OpenCV NumPy Matrix -->
  <g transform="translate(540, 60)">
    <rect width="320" height="180" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <rect width="320" height="34" rx="12" fill="#16a34a"/>
    <rect y="22" width="320" height="12" fill="#16a34a"/>
    <text x="160" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">OpenCV: cv2.Mat (NumPy ndarray)</text>
    
    <text x="20" y="65" fill="#15803d" font-family="monospace" font-size="11" font-weight="600">• shape: (480, 640, 3)</text>
    <text x="20" y="90" fill="#0f172a" font-family="monospace" font-size="11">• dtype: np.uint8</text>
    <text x="20" y="115" fill="#0f172a" font-family="monospace" font-size="11">• cv2.cvtColor(img, COLOR_BGR2GRAY)</text>
    <text x="20" y="140" fill="#0f172a" font-family="monospace" font-size="11">• cv2.Canny(), cv2.findContours()</text>
    <text x="20" y="165" fill="#64748b" font-family="sans-serif" font-size="10.5" font-weight="500">High-performance Computer Vision</text>
  </g>

  <!-- Bottom workflow caption -->
  <g transform="translate(60, 260)">
    <rect width="800" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
    <text x="400" y="24" fill="#0369a1" font-family="system-ui, sans-serif" font-size="11.5" font-weight="bold" text-anchor="middle">Zero-Copy Memory Interop</text>
    <text x="400" y="42" fill="#334155" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">cv_bridge unpacks contiguous raw bytes into structured NumPy memory buffers ready for OpenCV algorithms.</text>
  </g>
</svg>
