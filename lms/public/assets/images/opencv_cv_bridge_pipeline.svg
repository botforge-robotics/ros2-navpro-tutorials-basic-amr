<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <rect width="920" height="340" rx="16" fill="#0f172a"/>
  <text x="460" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">ROS 2 SENSOR_MSGS &lt;-&gt; OPENCV NUMPY (CV_BRIDGE) PIPELINE</text>

  <!-- Left: ROS 2 Image Message -->
  <g transform="translate(60, 60)">
    <rect width="320" height="180" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect width="320" height="34" rx="12" fill="#0284c7"/>
    <rect y="22" width="320" height="12" fill="#0284c7"/>
    <text x="160" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ROS 2: sensor_msgs/msg/Image</text>
    
    <text x="20" y="65" fill="#38bdf8" font-family="monospace" font-size="11">• header: Header (stamp, frame_id)</text>
    <text x="20" y="90" fill="#e2e8f0" font-family="monospace" font-size="11">• height: 480, width: 640</text>
    <text x="20" y="115" fill="#e2e8f0" font-family="monospace" font-size="11">• encoding: "bgr8"</text>
    <text x="20" y="140" fill="#94a3b8" font-family="monospace" font-size="11">• data: uint8[] (serialized bytes)</text>
    <text x="20" y="165" fill="#64748b" font-family="sans-serif" font-size="10">DDS Network Transport Wire Format</text>
  </g>

  <!-- Middle: cv_bridge Arrows -->
  <g transform="translate(400, 110)">
    <!-- Right arrow: imgmsg_to_cv2 -->
    <line x1="0" y1="0" x2="110" y2="0" stroke="#10b981" stroke-width="2.5"/>
    <polygon points="105,-6 117,0 105,6" fill="#10b981"/>
    <text x="55" y="-12" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">imgmsg_to_cv2()</text>

    <!-- Left arrow: cv2_to_imgmsg -->
    <line x1="110" y1="45" x2="0" y2="45" stroke="#f59e0b" stroke-width="2.5"/>
    <polygon points="5,39 -7,45 5,51" fill="#f59e0b"/>
    <text x="55" y="66" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold" text-anchor="middle">cv2_to_imgmsg()</text>
  </g>

  <!-- Right: OpenCV NumPy Matrix -->
  <g transform="translate(540, 60)">
    <rect width="320" height="180" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect width="320" height="34" rx="12" fill="#059669"/>
    <rect y="22" width="320" height="12" fill="#059669"/>
    <text x="160" y="23" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">OpenCV: cv2.Mat (NumPy ndarray)</text>
    
    <text x="20" y="65" fill="#10b981" font-family="monospace" font-size="11">• shape: (480, 640, 3)</text>
    <text x="20" y="90" fill="#e2e8f0" font-family="monospace" font-size="11">• dtype: np.uint8</text>
    <text x="20" y="115" fill="#e2e8f0" font-family="monospace" font-size="11">• cv2.cvtColor(img, COLOR_BGR2GRAY)</text>
    <text x="20" y="140" fill="#e2e8f0" font-family="monospace" font-size="11">• cv2.Canny(), cv2.findContours()</text>
    <text x="20" y="165" fill="#64748b" font-family="sans-serif" font-size="10">High-performance Computer Vision</text>
  </g>

  <!-- Bottom workflow caption -->
  <g transform="translate(60, 260)">
    <rect width="800" height="54" rx="8" fill="#0f172a" stroke="#334155"/>
    <text x="400" y="24" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">Zero-Copy Memory Interop</text>
    <text x="400" y="42" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">cv_bridge unpacks contiguous raw bytes into structured NumPy memory buffers ready for OpenCV algorithms.</text>
  </g>
</svg>
