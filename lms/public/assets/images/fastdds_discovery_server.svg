<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 320" width="100%" height="100%">
  <rect width="920" height="320" rx="16" fill="#0f172a"/>
  <text x="460" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">ENTERPRISE DDS ARCHITECTURE: FASTDDS DISCOVERY SERVER</text>

  <!-- Static Discovery Server (Top) -->
  <g transform="translate(260, 50)">
    <rect width="400" height="64" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="16" y="14" width="130" height="36" rx="6" fill="#0284c7"/>
    <text x="81" y="37" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">DISCOVERY SERVER</text>
    <text x="165" y="32" fill="#38bdf8" font-family="monospace" font-size="12" font-weight="bold">IP: 192.168.1.100 : 11811</text>
    <text x="165" y="48" fill="#94a3b8" font-family="sans-serif" font-size="10">Centralized Participant Directory (FastDDS)</text>
  </g>

  <!-- Unicast Arrows down -->
  <line x1="360" y1="114" x2="230" y2="175" stroke="#10b981" stroke-width="2"/>
  <polygon points="225,167 235,173 227,181" fill="#10b981"/>
  <text x="250" y="140" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold">Unicast TCP/UDP</text>

  <line x1="560" y1="114" x2="690" y2="175" stroke="#10b981" stroke-width="2"/>
  <polygon points="693,167 685,173 695,181" fill="#10b981"/>
  <text x="630" y="140" fill="#10b981" font-family="monospace" font-size="10" font-weight="bold">Unicast TCP/UDP</text>

  <!-- AMR 1 Box -->
  <g transform="translate(100, 185)">
    <rect width="280" height="70" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="140" y="26" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">🤖 AMR Fleet Unit 01</text>
    <text x="140" y="44" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">ROS_DISCOVERY_SERVER=192.168.1.100:11811</text>
    <text x="140" y="58" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Subnet: Warehouse Zone A</text>
  </g>

  <!-- AMR 2 Box -->
  <g transform="translate(540, 185)">
    <rect width="280" height="70" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="140" y="26" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">🤖 AMR Fleet Unit 02</text>
    <text x="140" y="44" fill="#cbd5e1" font-family="monospace" font-size="10" text-anchor="middle">ROS_DISCOVERY_SERVER=192.168.1.100:11811</text>
    <text x="140" y="58" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">Subnet: Warehouse Zone B</text>
  </g>

  <!-- Bottom Explanatory Banner -->
  <g transform="translate(100, 270)">
    <rect width="720" height="34" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="360" y="22" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="11" text-anchor="middle">Zero Multicast Flooding: Eliminates dropped packets on corporate Wi-Fi and scales to 100+ robots.</text>
  </g>
</svg>
