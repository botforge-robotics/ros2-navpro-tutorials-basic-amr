<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <rect width="920" height="340" rx="16" fill="#0f172a"/>
  <text x="460" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">ROS 2 MANAGED LIFECYCLE NODE STATE MACHINE</text>

  <!-- State 1: Unconfigured -->
  <g transform="translate(60, 110)">
    <rect width="180" height="70" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="90" y="34" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Unconfigured</text>
    <text x="90" y="52" fill="#64748b" font-family="sans-serif" font-size="10" text-anchor="middle">Node created, unallocated</text>
  </g>

  <!-- Transition 1: configure() -->
  <line x1="240" y1="135" x2="360" y2="135" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="355,130 365,135 355,140" fill="#38bdf8"/>
  <text x="300" y="125" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">configure()</text>

  <!-- Transition Reverse: cleanup() -->
  <line x1="360" y1="155" x2="240" y2="155" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="245,150 235,155 245,160" fill="#94a3b8"/>
  <text x="300" y="172" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">cleanup()</text>

  <!-- State 2: Inactive -->
  <g transform="translate(370, 110)">
    <rect width="180" height="70" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <text x="90" y="34" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Inactive</text>
    <text x="90" y="52" fill="#94a3b8" font-family="sans-serif" font-size="10" text-anchor="middle">Configured, hold state</text>
  </g>

  <!-- Transition 2: activate() -->
  <line x1="550" y1="135" x2="670" y2="135" stroke="#10b981" stroke-width="2"/>
  <polygon points="665,130 675,135 665,140" fill="#10b981"/>
  <text x="610" y="125" fill="#10b981" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">activate()</text>

  <!-- Transition Reverse: deactivate() -->
  <line x1="670" y1="155" x2="550" y2="155" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <polygon points="555,150 545,155 555,160" fill="#94a3b8"/>
  <text x="610" y="172" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">deactivate()</text>

  <!-- State 3: Active -->
  <g transform="translate(680, 110)">
    <rect width="180" height="70" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="2.5"/>
    <text x="90" y="34" fill="#10b981" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">Active ⚡</text>
    <text x="90" y="52" fill="#ffffff" font-family="sans-serif" font-size="10" text-anchor="middle">Real-time processing active</text>
  </g>

  <!-- Bottom Explanatory Banner -->
  <g transform="translate(60, 230)">
    <rect width="800" height="70" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="24" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12" font-weight="700">Role of Nav2 Lifecycle Manager:</text>
    <text x="24" y="48" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Guarantees deterministic bringup sequence: Map Server loads first → AMCL localizes → Costmaps build → Planner &amp; Controller activate.</text>
  </g>
</svg>
