<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <rect width="920" height="340" rx="16" fill="#0f172a"/>
  <text x="460" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">NAV2 SIMPLE COMMANDER PYTHON CLIENT ARCHITECTURE</text>

  <!-- Python Script Box -->
  <g transform="translate(310, 50)">
    <rect width="300" height="60" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <text x="150" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">🐍 BasicNavigator Python API</text>
    <text x="150" y="46" fill="#e2e8f0" font-family="monospace" font-size="11" text-anchor="middle">from nav2_simple_commander.robot_navigator import BasicNavigator</text>
  </g>

  <!-- Split Connectors -->
  <line x1="460" y1="110" x2="460" y2="135" stroke="#38bdf8" stroke-width="2"/>
  <line x1="230" y1="135" x2="690" y2="135" stroke="#38bdf8" stroke-width="2"/>

  <line x1="230" y1="135" x2="230" y2="165" stroke="#10b981" stroke-width="2"/>
  <polygon points="225,163 235,163 230,171" fill="#10b981"/>

  <line x1="690" y1="135" x2="690" y2="165" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="685,163 695,163 690,171" fill="#f59e0b"/>

  <!-- Left: Single Goal Action Client -->
  <g transform="translate(100, 172)">
    <rect width="260" height="85" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
    <text x="130" y="26" fill="#10b981" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">goToPose(target_pose)</text>
    <text x="130" y="46" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Action: /navigate_to_pose</text>
    <text x="130" y="66" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Single Waypoint Autonomous Transit</text>
  </g>

  <!-- Right: Multi-Goal Action Client -->
  <g transform="translate(560, 172)">
    <rect width="260" height="85" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="130" y="26" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">followWaypoints(poses)</text>
    <text x="130" y="46" fill="#94a3b8" font-family="monospace" font-size="10" text-anchor="middle">Action: /follow_waypoints</text>
    <text x="130" y="66" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Continuous Route Inspection Loop</text>
  </g>

  <!-- Non-blocking feedback loops -->
  <g transform="translate(100, 275)">
    <rect width="720" height="42" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="360" y="26" fill="#38bdf8" font-family="monospace" font-size="11" text-anchor="middle">while not nav.isTaskComplete(): feedback = nav.getFeedback() # Non-blocking execution</text>
  </g>
</svg>
