<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 690" width="100%" height="100%">
  <defs>
    <!-- Header Gradients -->
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="serverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="cardShadow" x="-3%" y="-3%" width="106%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Outer Canvas Card -->
  <rect width="1060" height="690" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Top Banner Header -->
  <g transform="translate(0, 0)">
    <rect x="35" y="20" width="990" height="52" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="60" cy="46" r="7" fill="#0284c7"/>
    <text x="80" y="51" fill="#0f172a" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" letter-spacing="0.5">ROS 2 ACTION PROTOCOL &amp; GOAL LIFECYCLE ARCHITECTURE</text>
    <rect x="795" y="33" width="215" height="26" rx="6" fill="#f0f9ff" stroke="#bae6fd" stroke-width="1"/>
    <text x="902" y="50" fill="#0284c7" font-family="ui-monospace, monospace" font-size="11" font-weight="700" text-anchor="middle">rcl_action · 5 Coordinated Streams</text>
  </g>

  <!-- ========================================================================= -->
  <!-- SECTION 1: THE 5 UNDERLYING COMMUNICATION CHANNELS (TOP HALF)            -->
  <!-- ========================================================================= -->

  <!-- Left Card: Action Client Node -->
  <g transform="translate(35, 90)" filter="url(#cardShadow)">
    <rect width="215" height="290" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="1.5"/>
    <!-- Card Header -->
    <rect width="215" height="38" rx="12" fill="url(#clientGrad)"/>
    <rect y="26" width="215" height="12" fill="url(#clientGrad)"/>
    <text x="107" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.5">ACTION CLIENT</text>
    
    <!-- Code Snip & Roles -->
    <text x="16" y="64" fill="#0369a1" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Role: Goal Requester (Caller)</text>
    <text x="16" y="80" fill="#0c4a6e" font-family="ui-monospace, monospace" font-size="10" font-weight="700">ActionClient(Node, type, '/nav')</text>

    <!-- Methods List -->
    <rect x="12" y="94" width="191" height="178" rx="6" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
    <text x="20" y="116" fill="#0284c7" font-family="ui-monospace, monospace" font-size="10" font-weight="700">• send_goal_async()</text>
    <text x="28" y="130" fill="#475569" font-family="system-ui, sans-serif" font-size="9">Dispatches target request</text>

    <text x="20" y="154" fill="#d97706" font-family="ui-monospace, monospace" font-size="10" font-weight="700">• feedback_callback()</text>
    <text x="28" y="168" fill="#475569" font-family="system-ui, sans-serif" font-size="9">Streams live progress</text>

    <text x="20" y="192" fill="#dc2626" font-family="ui-monospace, monospace" font-size="10" font-weight="700">• cancel_goal_async()</text>
    <text x="28" y="206" fill="#475569" font-family="system-ui, sans-serif" font-size="9">Requests goal preemption</text>

    <text x="20" y="230" fill="#059669" font-family="ui-monospace, monospace" font-size="10" font-weight="700">• get_result_async()</text>
    <text x="28" y="244" fill="#475569" font-family="system-ui, sans-serif" font-size="9">Resolves final outcome</text>
  </g>

  <!-- Center Card: Coordinated 5 DDS Communication Streams -->
  <g transform="translate(265, 90)" filter="url(#cardShadow)">
    <rect width="530" height="290" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="265" y="22" fill="#334155" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle" letter-spacing="1">COORDINATED ACTION BUS (UNDER THE HOOD)</text>

    <!-- Lane 1: Send Goal (Service) -->
    <g transform="translate(15, 32)">
      <rect width="500" height="44" rx="6" fill="#ffffff" stroke="#38bdf8" stroke-width="1.2"/>
      <text x="12" y="17" fill="#0284c7" font-family="ui-monospace, monospace" font-size="10" font-weight="800">1. /_action/send_goal</text>
      <rect x="175" y="5" width="55" height="16" rx="3" fill="#e0f2fe"/>
      <text x="202" y="17" fill="#0284c7" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">SERVICE</text>
      <text x="488" y="17" fill="#475569" font-family="ui-monospace, monospace" font-size="9" font-weight="600" text-anchor="end">Goal Payload (Request)</text>
      <!-- Arrow Line (Left-to-Right) -->
      <path d="M 14 31 L 472 31" stroke="#0284c7" stroke-width="2" stroke-dasharray="4,3"/>
      <polygon points="472,27 482,31 472,35" fill="#0284c7"/>
    </g>

    <!-- Lane 2: GoalResponse (Service Return) -->
    <g transform="translate(15, 82)">
      <rect width="500" height="44" rx="6" fill="#ffffff" stroke="#0284c7" stroke-width="1.2"/>
      <text x="12" y="17" fill="#0369a1" font-family="ui-monospace, monospace" font-size="10" font-weight="800">2. GoalResponse</text>
      <rect x="150" y="5" width="65" height="16" rx="3" fill="#e0f2fe"/>
      <text x="182" y="17" fill="#0369a1" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">RESPONSE</text>
      <text x="488" y="17" fill="#0369a1" font-family="ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="end">ACCEPT / REJECT Confirmation</text>
      <!-- Arrow Line (Right-to-Left) -->
      <path d="M 482 31 L 24 31" stroke="#0369a1" stroke-width="2"/>
      <polygon points="24,27 14,31 24,35" fill="#0369a1"/>
    </g>

    <!-- Lane 3: Periodic Feedback Stream (Topic) -->
    <g transform="translate(15, 132)">
      <rect width="500" height="46" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.4"/>
      <text x="12" y="18" fill="#b45309" font-family="ui-monospace, monospace" font-size="10" font-weight="800">3. /_action/feedback</text>
      <rect x="175" y="5" width="46" height="16" rx="3" fill="#fef3c7"/>
      <text x="198" y="17" fill="#b45309" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">TOPIC</text>
      <text x="488" y="18" fill="#92400e" font-family="ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="end">~10Hz Real-Time Traversal Progress</text>
      <!-- Arrow Line (Right-to-Left Streaming) -->
      <path d="M 482 33 L 24 33" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,4"/>
      <polygon points="24,29 14,33 24,37" fill="#f59e0b"/>
    </g>

    <!-- Lane 4: Cancel Goal (Service) -->
    <g transform="translate(15, 184)">
      <rect width="500" height="44" rx="6" fill="#fff1f2" stroke="#f43f5e" stroke-width="1.2"/>
      <text x="12" y="17" fill="#e11d48" font-family="ui-monospace, monospace" font-size="10" font-weight="800">4. /_action/cancel_goal</text>
      <rect x="180" y="5" width="55" height="16" rx="3" fill="#ffe4e6"/>
      <text x="207" y="17" fill="#e11d48" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">SERVICE</text>
      <text x="488" y="17" fill="#be123c" font-family="ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="end">Preempt Request (Optional)</text>
      <!-- Arrow Line (Left-to-Right) -->
      <path d="M 14 31 L 472 31" stroke="#e11d48" stroke-width="1.8" stroke-dasharray="4,3"/>
      <polygon points="472,27 482,31 472,35" fill="#e11d48"/>
    </g>

    <!-- Lane 5: Get Result (Service) -->
    <g transform="translate(15, 234)">
      <rect width="500" height="46" rx="6" fill="#f0fdf4" stroke="#10b981" stroke-width="1.4"/>
      <text x="12" y="18" fill="#047857" font-family="ui-monospace, monospace" font-size="10" font-weight="800">5. /_action/get_result</text>
      <rect x="175" y="5" width="55" height="16" rx="3" fill="#dcfce7"/>
      <text x="202" y="17" fill="#047857" font-family="system-ui, sans-serif" font-size="8.5" font-weight="800" text-anchor="middle">SERVICE</text>
      <text x="488" y="18" fill="#065f46" font-family="ui-monospace, monospace" font-size="9" font-weight="700" text-anchor="end">Final Result Payload &amp; Status</text>
      <!-- Arrow Line (Right-to-Left) -->
      <path d="M 482 33 L 24 33" stroke="#10b981" stroke-width="2.5"/>
      <polygon points="24,29 14,33 24,37" fill="#10b981"/>
    </g>
  </g>

  <!-- Right Card: Action Server Node -->
  <g transform="translate(810, 90)" filter="url(#cardShadow)">
    <rect width="215" height="290" rx="12" fill="#f0fdf4" stroke="#10b981" stroke-width="1.5"/>
    <!-- Card Header -->
    <rect width="215" height="38" rx="12" fill="url(#serverGrad)"/>
    <rect y="26" width="215" height="12" fill="url(#serverGrad)"/>
    <text x="107" y="24" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.5">ACTION SERVER</text>
    
    <!-- Code Snip & Roles -->
    <text x="16" y="64" fill="#047857" font-family="system-ui, sans-serif" font-size="10" font-weight="700">Role: Task Executor</text>
    <text x="16" y="80" fill="#065f46" font-family="ui-monospace, monospace" font-size="10" font-weight="700">ActionServer(Node, '/nav', cb)</text>

    <!-- Methods List -->
    <rect x="12" y="94" width="191" height="178" rx="6" fill="#ffffff" stroke="#a7f3d0" stroke-width="1"/>
    <text x="20" y="116" fill="#0284c7" font-family="ui-monospace, monospace" font-size="10" font-weight="700">• goal_callback()</text>
    <text x="28" y="130" fill="#475569" font-family="system-ui, sans-serif" font-size="9">Accepts or rejects goal</text>

    <text x="20" y="154" fill="#d97706" font-family="ui-monospace, monospace" font-size="10" font-weight="700">• publish_feedback()</text>
    <text x="28" y="168" fill="#475569" font-family="system-ui, sans-serif" font-size="9">Emits progress telemetry</text>

    <text x="20" y="192" fill="#dc2626" font-family="ui-monospace, monospace" font-size="10" font-weight="700">• is_cancel_requested</text>
    <text x="28" y="206" fill="#475569" font-family="system-ui, sans-serif" font-size="9">Monitors preempt events</text>

    <text x="20" y="230" fill="#059669" font-family="ui-monospace, monospace" font-size="10" font-weight="700">• succeed() / abort()</text>
    <text x="28" y="244" fill="#475569" font-family="system-ui, sans-serif" font-size="9">Finalizes goal lifecycle</text>
  </g>

  <!-- ========================================================================= -->
  <!-- SECTION 2: GOAL LIFECYCLE STATE MACHINE (BOTTOM HALF)                    -->
  <!-- ========================================================================= -->

  <g transform="translate(35, 395)" filter="url(#cardShadow)">
    <rect width="990" height="265" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- State Machine Header -->
    <rect width="990" height="34" rx="12" fill="#f1f5f9"/>
    <rect y="22" width="990" height="12" fill="#f1f5f9"/>
    <text x="24" y="22" fill="#0f172a" font-family="system-ui, sans-serif" font-size="12" font-weight="800" letter-spacing="0.5">GOAL LIFECYCLE STATE TRANSITION GRAPH</text>
    <text x="966" y="22" fill="#475569" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="end">Standard ROS 2 Goal Status Enum</text>

    <!-- State 1: Goal Received (Entry) -->
    <g transform="translate(25, 75)">
      <circle cx="24" cy="35" r="16" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
      <text x="24" y="39" fill="#ffffff" font-family="system-ui, sans-serif" font-size="10" font-weight="800" text-anchor="middle">START</text>
      <text x="24" y="68" fill="#475569" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">Goal Sent</text>
    </g>

    <!-- Transition from START to STATUS_ACCEPTED -->
    <line x1="70" y1="110" x2="130" y2="110" stroke="#0284c7" stroke-width="2"/>
    <polygon points="130,106 138,110 130,114" fill="#0284c7"/>
    <!-- Text Pill -->
    <rect x="75" y="90" width="50" height="16" rx="3" fill="#ffffff" stroke="#0284c7" stroke-width="1"/>
    <text x="100" y="102" fill="#0284c7" font-family="ui-monospace, monospace" font-size="8.5" font-weight="bold" text-anchor="middle">ACCEPT</text>

    <!-- State 2: STATUS_ACCEPTED -->
    <g transform="translate(142, 85)">
      <rect width="136" height="52" rx="8" fill="#ffffff" stroke="#0284c7" stroke-width="1.5"/>
      <text x="68" y="24" fill="#0369a1" font-family="ui-monospace, monospace" font-size="10" font-weight="800" text-anchor="middle">STATUS_ACCEPTED</text>
      <text x="68" y="41" fill="#475569" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Goal verified valid</text>
    </g>

    <!-- Transition from STATUS_ACCEPTED to STATUS_EXECUTING -->
    <line x1="278" y1="110" x2="345" y2="110" stroke="#d97706" stroke-width="2"/>
    <polygon points="345,106 353,110 345,114" fill="#d97706"/>
    <!-- Text Pill -->
    <rect x="285" y="90" width="56" height="16" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="1"/>
    <text x="313" y="102" fill="#d97706" font-family="ui-monospace, monospace" font-size="8.5" font-weight="bold" text-anchor="middle">EXECUTE</text>

    <!-- State 3: STATUS_EXECUTING (Central active state with feedback loop) -->
    <g transform="translate(355, 75)">
      <rect width="165" height="72" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
      <text x="82" y="24" fill="#b45309" font-family="ui-monospace, monospace" font-size="11" font-weight="800" text-anchor="middle">STATUS_EXECUTING</text>
      <text x="82" y="42" fill="#92400e" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">Control Loop Active</text>
      <!-- Feedback Badge -->
      <rect x="18" y="48" width="129" height="16" rx="4" fill="#fef3c7"/>
      <text x="82" y="60" fill="#b45309" font-family="ui-monospace, monospace" font-size="8.5" font-weight="700" text-anchor="middle">⟳ Feedback Streaming</text>
    </g>

    <!-- ======================================================== -->
    <!-- 3 SEPARATE DEDICATED TERMINAL PATHWAYS                   -->
    <!-- ======================================================== -->

    <!-- BRANCH 1: CLEAN SUCCESS (TOP CORRIDOR, Y=90) -->
    <path d="M 520 90 L 685 90" stroke="#10b981" stroke-width="2"/>
    <polygon points="685,86 695,90 685,94" fill="#10b981"/>
    <rect x="545" y="72" width="110" height="18" rx="3" fill="#ffffff" stroke="#10b981" stroke-width="1"/>
    <text x="600" y="85" fill="#047857" font-family="ui-monospace, monospace" font-size="9" font-weight="bold" text-anchor="middle">goal.succeed()</text>

    <!-- Terminal State 1: SUCCEEDED (Top Row) -->
    <g transform="translate(697, 66)">
      <rect width="160" height="48" rx="8" fill="#f0fdf4" stroke="#10b981" stroke-width="1.8"/>
      <text x="80" y="22" fill="#047857" font-family="ui-monospace, monospace" font-size="10" font-weight="800" text-anchor="middle">STATUS_SUCCEEDED ✅</text>
      <text x="80" y="38" fill="#065f46" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">Target reached cleanly</text>
    </g>

    <!-- BRANCH 2: FAULT / ABORT (MIDDLE CORRIDOR, Y=145) -->
    <path d="M 520 125 L 565 125 L 565 145 L 685 145" stroke="#ef4444" stroke-width="1.8" fill="none"/>
    <polygon points="685,141 695,145 685,149" fill="#ef4444"/>
    <rect x="575" y="136" width="98" height="18" rx="3" fill="#ffffff" stroke="#ef4444" stroke-width="1"/>
    <text x="624" y="149" fill="#b91c1c" font-family="ui-monospace, monospace" font-size="9" font-weight="bold" text-anchor="middle">goal.abort()</text>

    <!-- Terminal State 2: ABORTED (Middle Row) -->
    <g transform="translate(697, 122)">
      <rect width="160" height="46" rx="8" fill="#fff1f2" stroke="#ef4444" stroke-width="1.6"/>
      <text x="80" y="21" fill="#b91c1c" font-family="ui-monospace, monospace" font-size="10" font-weight="800" text-anchor="middle">STATUS_ABORTED 🛑</text>
      <text x="80" y="37" fill="#991b1b" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">Obstacle stuck / Safety abort</text>
    </g>

    <!-- BRANCH 3: CLIENT CANCELLATION (BOTTOM CORRIDOR, Y=205) -->
    <path d="M 435 147 L 435 205 L 525 205" stroke="#f97316" stroke-width="1.8" fill="none"/>
    <polygon points="525,201 535,205 525,209" fill="#f97316"/>
    <rect x="445" y="196" width="75" height="18" rx="3" fill="#ffffff" stroke="#f97316" stroke-width="1"/>
    <text x="482" y="209" fill="#c2410c" font-family="ui-monospace, monospace" font-size="9" font-weight="bold" text-anchor="middle">cancel_goal()</text>

    <!-- State: CANCELING -->
    <g transform="translate(537, 182)">
      <rect width="138" height="46" rx="7" fill="#fff7ed" stroke="#f97316" stroke-width="1.3"/>
      <text x="69" y="21" fill="#c2410c" font-family="ui-monospace, monospace" font-size="9.5" font-weight="700" text-anchor="middle">STATUS_CANCELING</text>
      <text x="69" y="36" fill="#9a3412" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Decelerating to halt...</text>
    </g>

    <!-- Transition to CANCELED -->
    <line x1="675" y1="205" x2="708" y2="205" stroke="#f97316" stroke-width="1.8"/>
    <polygon points="708,201 718,205 708,209" fill="#f97316"/>

    <!-- Terminal State 3: CANCELED (Bottom Row) -->
    <g transform="translate(720, 182)">
      <rect width="155" height="46" rx="7" fill="#fff7ed" stroke="#f97316" stroke-width="1.8"/>
      <text x="77" y="21" fill="#c2410c" font-family="ui-monospace, monospace" font-size="10" font-weight="800" text-anchor="middle">STATUS_CANCELED ⚠️</text>
      <text x="77" y="36" fill="#9a3412" font-family="system-ui, sans-serif" font-size="8" text-anchor="middle">Safely preempted by client</text>
    </g>
  </g>
</svg>