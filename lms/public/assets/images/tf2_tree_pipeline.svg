<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="100%">
  <defs>
    <linearGradient id="frameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="900" height="340" rx="16" fill="#0b1120"/>

  <text x="450" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">REP-105 ROBOT SPATIAL TF2 TRANSFORM TREE HIERARCHY</text>

  <!-- Frames -->
  <!-- map -->
  <g transform="translate(370, 50)" filter="url(#shadow)">
    <rect width="160" height="48" rx="8" fill="url(#frameGrad)" stroke="#38bdf8" stroke-width="2"/>
    <text x="80" y="24" fill="#38bdf8" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">map</text>
    <text x="80" y="40" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Global Fixed Frame (SLAM)</text>
  </g>

  <!-- odom -->
  <g transform="translate(370, 130)" filter="url(#shadow)">
    <rect width="160" height="48" rx="8" fill="url(#frameGrad)" stroke="#818cf8" stroke-width="2"/>
    <text x="80" y="24" fill="#818cf8" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">odom</text>
    <text x="80" y="40" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Continuous Dead-Reckoning</text>
  </g>

  <!-- base_footprint -->
  <g transform="translate(370, 210)" filter="url(#shadow)">
    <rect width="160" height="48" rx="8" fill="url(#frameGrad)" stroke="#34d399" stroke-width="2"/>
    <text x="80" y="24" fill="#34d399" font-family="monospace" font-size="14" font-weight="700" text-anchor="middle">base_footprint</text>
    <text x="80" y="40" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Ground Projection (Z = 0)</text>
  </g>

  <!-- base_link -->
  <g transform="translate(370, 280)" filter="url(#shadow)">
    <rect width="160" height="44" rx="8" fill="url(#frameGrad)" stroke="#f59e0b" stroke-width="2"/>
    <text x="80" y="22" fill="#f59e0b" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">base_link</text>
    <text x="80" y="36" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Chassis Origin (Center)</text>
  </g>

  <!-- Children of base_link -->
  <!-- laser_frame -->
  <g transform="translate(80, 280)" filter="url(#shadow)">
    <rect width="140" height="44" rx="8" fill="url(#frameGrad)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="70" y="22" fill="#f87171" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">laser_frame</text>
    <text x="70" y="36" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">2D LiDAR Sensor</text>
  </g>

  <!-- camera_link -->
  <g transform="translate(680, 240)" filter="url(#shadow)">
    <rect width="140" height="44" rx="8" fill="url(#frameGrad)" stroke="#ec4899" stroke-width="1.5"/>
    <text x="70" y="22" fill="#f472b6" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">camera_link</text>
    <text x="70" y="36" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">Front Optical Sensor</text>
  </g>

  <!-- imu_link -->
  <g transform="translate(680, 290)" filter="url(#shadow)">
    <rect width="140" height="44" rx="8" fill="url(#frameGrad)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="70" y="22" fill="#c084fc" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">imu_link</text>
    <text x="70" y="36" fill="#64748b" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">9-DOF Inertial Sensor</text>
  </g>

  <!-- Connecting Lines -->
  <!-- map -> odom -->
  <line x1="450" y1="98" x2="450" y2="130" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="450,130 445,122 455,122" fill="#38bdf8"/>
  <text x="495" y="117" fill="#38bdf8" font-family="monospace" font-size="10">slam_toolbox</text>

  <!-- odom -> base_footprint -->
  <line x1="450" y1="178" x2="450" y2="210" stroke="#818cf8" stroke-width="2"/>
  <polygon points="450,210 445,202 455,202" fill="#818cf8"/>
  <text x="495" y="197" fill="#818cf8" font-family="monospace" font-size="10">diff_drive_odom</text>

  <!-- base_footprint -> base_link -->
  <line x1="450" y1="258" x2="450" y2="280" stroke="#34d399" stroke-width="2"/>
  <polygon points="450,280 445,272 455,272" fill="#34d399"/>

  <!-- base_link -> laser_frame -->
  <path d="M 370 302 L 220 302" stroke="#ef4444" stroke-width="1.5" fill="none"/>
  <polygon points="220,302 228,298 228,306" fill="#ef4444"/>
  <text x="295" y="295" fill="#ef4444" font-family="monospace" font-size="9" text-anchor="middle">static TF (URDF)</text>

  <!-- base_link -> camera_link -->
  <path d="M 530 302 L 600 302 L 600 262 L 680 262" stroke="#ec4899" stroke-width="1.5" fill="none"/>
  <polygon points="680,262 672,258 672,266" fill="#ec4899"/>

  <!-- base_link -> imu_link -->
  <path d="M 530 302 L 680 312" stroke="#a855f7" stroke-width="1.5" fill="none"/>
  <polygon points="680,312 672,308 672,316" fill="#a855f7"/>
</svg>
