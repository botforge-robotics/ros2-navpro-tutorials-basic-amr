<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="100%" height="100%">
  <!-- Canvas Background -->
  <rect width="900" height="340" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="450" y="32" fill="#475569" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="800" text-anchor="middle" letter-spacing="1">REP-105 ROBOT SPATIAL TF2 TRANSFORM TREE HIERARCHY</text>

  <!-- Frames -->
  <!-- map -->
  <g transform="translate(370, 50)">
    <rect width="160" height="48" rx="8" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
    <text x="80" y="24" fill="#0369a1" font-family="monospace" font-size="13.5" font-weight="700" text-anchor="middle">map</text>
    <text x="80" y="40" fill="#475569" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Global Fixed Frame (SLAM)</text>
  </g>

  <!-- odom -->
  <g transform="translate(370, 130)">
    <rect width="160" height="48" rx="8" fill="#faf5ff" stroke="#6366f1" stroke-width="2"/>
    <text x="80" y="24" fill="#4f46e5" font-family="monospace" font-size="13.5" font-weight="700" text-anchor="middle">odom</text>
    <text x="80" y="40" fill="#475569" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Continuous Dead-Reckoning</text>
  </g>

  <!-- base_footprint -->
  <g transform="translate(370, 210)">
    <rect width="160" height="48" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <text x="80" y="24" fill="#15803d" font-family="monospace" font-size="13.5" font-weight="700" text-anchor="middle">base_footprint</text>
    <text x="80" y="40" fill="#475569" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Ground Projection (Z = 0)</text>
  </g>

  <!-- base_link -->
  <g transform="translate(370, 280)">
    <rect width="160" height="44" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
    <text x="80" y="22" fill="#b45309" font-family="monospace" font-size="13" font-weight="700" text-anchor="middle">base_link</text>
    <text x="80" y="36" fill="#475569" font-family="system-ui, sans-serif" font-size="10" font-weight="600" text-anchor="middle">Chassis Origin (Center)</text>
  </g>

  <!-- Children of base_link -->
  <!-- laser_frame -->
  <g transform="translate(80, 280)">
    <rect width="140" height="44" rx="8" fill="#fff1f2" stroke="#e11d48" stroke-width="1.5"/>
    <text x="70" y="22" fill="#be123c" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">laser_frame</text>
    <text x="70" y="36" fill="#475569" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">2D LiDAR Sensor</text>
  </g>

  <!-- camera_link -->
  <g transform="translate(680, 240)">
    <rect width="140" height="44" rx="8" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
    <text x="70" y="22" fill="#be185d" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">camera_link</text>
    <text x="70" y="36" fill="#475569" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">Front Optical Sensor</text>
  </g>

  <!-- imu_link -->
  <g transform="translate(680, 290)">
    <rect width="140" height="44" rx="8" fill="#faf5ff" stroke="#9333ea" stroke-width="1.5"/>
    <text x="70" y="22" fill="#7e22ce" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">imu_link</text>
    <text x="70" y="36" fill="#475569" font-family="system-ui, sans-serif" font-size="9" font-weight="600" text-anchor="middle">9-DOF Inertial Sensor</text>
  </g>

  <!-- Connecting Lines -->
  <!-- map -> odom -->
  <line x1="450" y1="98" x2="450" y2="130" stroke="#0284c7" stroke-width="2"/>
  <polygon points="450,130 445,122 455,122" fill="#0284c7"/>
  <text x="495" y="117" fill="#0284c7" font-family="monospace" font-size="10" font-weight="700">slam_toolbox</text>

  <!-- odom -> base_footprint -->
  <line x1="450" y1="178" x2="450" y2="210" stroke="#6366f1" stroke-width="2"/>
  <polygon points="450,210 445,202 455,202" fill="#6366f1"/>
  <text x="495" y="197" fill="#6366f1" font-family="monospace" font-size="10" font-weight="700">diff_drive_odom</text>

  <!-- base_footprint -> base_link -->
  <line x1="450" y1="258" x2="450" y2="280" stroke="#16a34a" stroke-width="2"/>
  <polygon points="450,280 445,272 455,272" fill="#16a34a"/>

  <!-- base_link -> laser_frame -->
  <path d="M 370 302 L 220 302" stroke="#e11d48" stroke-width="1.5" fill="none"/>
  <polygon points="220,302 228,298 228,306" fill="#e11d48"/>
  <text x="295" y="295" fill="#e11d48" font-family="monospace" font-size="9" font-weight="700" text-anchor="middle">static TF (URDF)</text>

  <!-- base_link -> camera_link -->
  <path d="M 530 302 L 600 302 L 600 262 L 680 262" stroke="#db2777" stroke-width="1.5" fill="none"/>
  <polygon points="680,262 672,258 672,266" fill="#db2777"/>

  <!-- base_link -> imu_link -->
  <path d="M 530 302 L 680 312" stroke="#9333ea" stroke-width="1.5" fill="none"/>
  <polygon points="680,312 672,308 672,316" fill="#9333ea"/>
</svg>
