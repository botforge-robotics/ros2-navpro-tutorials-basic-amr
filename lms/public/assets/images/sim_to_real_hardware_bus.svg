<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="440" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Title -->
  <rect x="20" y="16" width="920" height="38" rx="6" fill="#0f172a"/>
  <text x="480" y="41" font-family="system-ui, sans-serif" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">
    SIM-TO-REAL HARDWARE DEPLOYMENT: ONBOARD INDUSTRIAL PC &lt;---&gt; EMBEDDED MOTOR ACTUATORS
  </text>

  <!-- Block 1: Onboard Industrial PC -->
  <g transform="translate(30, 75)" filter="url(#shadow)">
    <rect width="280" height="335" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
    <rect x="0" y="0" width="280" height="34" rx="6" fill="#2563eb"/>
    <text x="140" y="22" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">ONBOARD INDUSTRIAL PC (Ubuntu 24.04)</text>

    <g transform="translate(15, 50)">
      <rect width="250" height="55" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="125" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">Nav2 Autonomous Stack (L19-L22)</text>
      <text x="125" y="38" font-family="system-ui, sans-serif" font-size="8.5" fill="#2563eb" text-anchor="middle">Generates /cmd_vel velocity commands</text>
    </g>

    <g transform="translate(15, 120)">
      <rect width="250" height="55" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="125" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">AMCL Relocalization (L23)</text>
      <text x="125" y="38" font-family="system-ui, sans-serif" font-size="8.5" fill="#15803d" text-anchor="middle">Matches real LiDAR to warehouse map</text>
    </g>

    <g transform="translate(15, 190)">
      <rect width="250" height="55" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="125" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#0f172a" text-anchor="middle">Robot State Publisher (L15)</text>
      <text x="125" y="38" font-family="system-ui, sans-serif" font-size="8.5" fill="#0369a1" text-anchor="middle">nexus_amr.urdf.xacro TF broadcaster</text>
    </g>

    <g transform="translate(15, 260)">
      <rect width="250" height="55" rx="4" fill="#ffffff" stroke="#16a34a"/>
      <text x="125" y="20" font-family="monospace" font-size="10" font-weight="700" fill="#15803d" text-anchor="middle">micro_ros_agent</text>
      <text x="125" y="38" font-family="system-ui, sans-serif" font-size="8.5" fill="#475569" text-anchor="middle">Serial /dev/ttyUSB0 @ 115200 baud</text>
    </g>
  </g>

  <!-- Center Arrow / Physical USB Cable -->
  <g transform="translate(320, 200)">
    <rect width="100" height="40" rx="4" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <text x="50" y="18" font-family="monospace" font-size="9" font-weight="700" fill="#0f172a" text-anchor="middle">UART / USB</text>
    <text x="50" y="32" font-family="system-ui, sans-serif" font-size="7.5" fill="#64748b" text-anchor="middle">115200 Baud</text>
    <line x1="-10" y1="20" x2="0" y2="20" stroke="#64748b" stroke-width="2"/>
    <line x1="100" y1="20" x2="110" y2="20" stroke="#64748b" stroke-width="2"/>
  </g>

  <!-- Block 2: Low-Level Microcontroller -->
  <g transform="translate(430, 75)" filter="url(#shadow)">
    <rect width="250" height="335" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
    <rect x="0" y="0" width="250" height="34" rx="6" fill="#16a34a"/>
    <text x="125" y="22" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">MOTOR CONTROLLER (ESP32)</text>

    <g transform="translate(15, 50)">
      <rect width="220" height="60" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="110" y="20" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Micro-ROS Client Firmware</text>
      <text x="110" y="36" font-family="system-ui, sans-serif" font-size="8" fill="#475569" text-anchor="middle">Subscribes: /cmd_vel</text>
      <text x="110" y="48" font-family="system-ui, sans-serif" font-size="8" fill="#475569" text-anchor="middle">Publishes: /wheel_ticks</text>
    </g>

    <g transform="translate(15, 130)">
      <rect width="220" height="60" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="110" y="20" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Differential Drive Kinematics</text>
      <text x="110" y="36" font-family="system-ui, sans-serif" font-size="8" fill="#475569" text-anchor="middle">vL = v - (w * L / 2)</text>
      <text x="110" y="48" font-family="system-ui, sans-serif" font-size="8" fill="#475569" text-anchor="middle">vR = v + (w * L / 2)</text>
    </g>

    <g transform="translate(15, 210)">
      <rect width="220" height="60" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="110" y="20" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Dual PID Speed Loops (100 Hz)</text>
      <text x="110" y="36" font-family="system-ui, sans-serif" font-size="8" fill="#475569" text-anchor="middle">Computes PWM duty cycle</text>
      <text x="110" y="48" font-family="system-ui, sans-serif" font-size="8" fill="#475569" text-anchor="middle">Tracks target RPM from encoders</text>
    </g>
  </g>

  <!-- Right Block: Physical Hardware Actuators -->
  <g transform="translate(710, 75)" filter="url(#shadow)">
    <rect width="220" height="335" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
    <rect x="0" y="0" width="220" height="34" rx="6" fill="#334155"/>
    <text x="110" y="22" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">PHYSICAL ACTUATORS</text>

    <!-- Left Motor -->
    <g transform="translate(15, 50)">
      <rect width="190" height="75" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="95" y="20" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Port Drive Wheel (Left)</text>
      <text x="95" y="38" font-family="system-ui, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Brushless Hub Motor (r = 0.06m)</text>
      <text x="95" y="52" font-family="system-ui, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Optical Hall Quadrature Encoder</text>
    </g>

    <!-- Right Motor -->
    <g transform="translate(15, 140)">
      <rect width="190" height="75" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="95" y="20" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Starboard Drive Wheel (Right)</text>
      <text x="95" y="38" font-family="system-ui, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Brushless Hub Motor (r = 0.06m)</text>
      <text x="95" y="52" font-family="system-ui, sans-serif" font-size="8" fill="#64748b" text-anchor="middle">Optical Hall Quadrature Encoder</text>
    </g>

    <!-- Sensors -->
    <g transform="translate(15, 230)">
      <rect width="190" height="75" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
      <text x="95" y="20" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#0f172a" text-anchor="middle">Sensors on Hardware Chassis</text>
      <text x="95" y="38" font-family="system-ui, sans-serif" font-size="8" fill="#f97316" text-anchor="middle">• RPLiDAR A1/A2 (USB)</text>
      <text x="95" y="52" font-family="system-ui, sans-serif" font-size="8" fill="#9333ea" text-anchor="middle">• Intel RealSense / USB Cam</text>
    </g>
  </g>
</svg>
