<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <defs>
    <filter id="cardShadow" x="-3%" y="-5%" width="106%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
  </defs>

  <!-- Outer Canvas Card -->
  <rect width="920" height="340" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  
  <!-- Header Title -->
  <g transform="translate(460, 28)" text-anchor="middle">
    <rect x="-215" y="-16" width="430" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="0" y="0" fill="#334155" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1">GRAPH SLAM ARCHITECTURE: SCAN MATCHING &amp; LOOP CLOSURE</text>
  </g>

  <!-- Node k-1 -->
  <g transform="translate(100, 56)" filter="url(#cardShadow)">
    <circle cx="50" cy="50" r="38" fill="#f0f9ff" stroke="#0284c7" stroke-width="2.5"/>
    <text x="50" y="46" fill="#0369a1" font-family="ui-monospace, monospace" font-size="12" font-weight="800" text-anchor="middle">Pose k-1</text>
    <text x="50" y="62" fill="#475569" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">(x₁, y₁, θ₁)</text>
  </g>

  <!-- Odometry / Scan matching edge -->
  <g transform="translate(195, 106)">
    <line x1="0" y1="0" x2="200" y2="0" stroke="#0284c7" stroke-width="2"/>
    <polygon points="195,-5 205,0 195,5" fill="#0284c7"/>
    <rect x="25" y="-22" width="155" height="18" rx="4" fill="#ffffff" stroke="#bae6fd" stroke-width="1"/>
    <text x="102" y="-9" fill="#0284c7" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">Incremental Scan Match</text>
    <text x="100" y="16" fill="#64748b" font-family="ui-monospace, monospace" font-size="10" font-weight="600" text-anchor="middle">Δx, Δy, Δθ (Front-End)</text>
  </g>

  <!-- Intermediate Drifting Node k -->
  <g transform="translate(410, 56)" filter="url(#cardShadow)">
    <circle cx="50" cy="50" r="38" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5"/>
    <text x="50" y="46" fill="#b45309" font-family="ui-monospace, monospace" font-size="12" font-weight="800" text-anchor="middle">Pose k</text>
    <text x="50" y="62" fill="#b45309" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">(Drifted Accum.)</text>
  </g>

  <!-- Trajectory edge to Node N -->
  <g transform="translate(505, 106)">
    <line x1="0" y1="0" x2="200" y2="0" stroke="#f59e0b" stroke-width="2"/>
    <polygon points="195,-5 205,0 195,5" fill="#f59e0b"/>
    <rect x="35" y="-22" width="135" height="18" rx="4" fill="#ffffff" stroke="#fde68a" stroke-width="1"/>
    <text x="102" y="-9" fill="#b45309" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" text-anchor="middle">Exploration Loop</text>
    <text x="100" y="16" fill="#64748b" font-family="ui-monospace, monospace" font-size="10" font-weight="600" text-anchor="middle">Cumulative Dead-Reckoning</text>
  </g>

  <!-- Node N (Revisited area) -->
  <g transform="translate(720, 56)" filter="url(#cardShadow)">
    <circle cx="50" cy="50" r="38" fill="#f0fdf4" stroke="#10b981" stroke-width="2.5"/>
    <text x="50" y="46" fill="#047857" font-family="ui-monospace, monospace" font-size="12" font-weight="800" text-anchor="middle">Pose N</text>
    <text x="50" y="62" fill="#059669" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" text-anchor="middle">(Recognized)</text>
  </g>

  <!-- Loop Closure Curved Constraint (Back-End) -->
  <path d="M 770 145 C 770 230, 150 230, 150 145" fill="none" stroke="#10b981" stroke-width="2.5" stroke-dasharray="6,4"/>
  <polygon points="144,152 150,140 156,152" fill="#10b981"/>
  <g filter="url(#cardShadow)">
    <rect x="350" y="194" width="220" height="32" rx="16" fill="#f0fdf4" stroke="#10b981" stroke-width="1.8"/>
    <text x="460" y="215" fill="#047857" font-family="system-ui, sans-serif" font-size="11" font-weight="800" text-anchor="middle">⚡ Ceres Loop Closure Constraint</text>
  </g>

  <!-- Bottom Global Map Output -->
  <g transform="translate(100, 260)" filter="url(#cardShadow)">
    <rect width="720" height="56" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="360" y="24" fill="#0284c7" font-family="system-ui, sans-serif" font-size="12" font-weight="800" text-anchor="middle">Global Occupancy Grid Map (/map)</text>
    <text x="360" y="43" fill="#475569" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" text-anchor="middle">Graph Optimization snaps intermediate poses straight, removing drift across entire warehouse map</text>
  </g>
</svg>