<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" width="100%" height="100%">
  <rect width="920" height="340" rx="16" fill="#0f172a"/>
  <text x="460" y="32" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="14" font-weight="600" text-anchor="middle" letter-spacing="1">GAZEBO PHYSICS SIMULATION &amp; ROS 2 BRIDGE ARCHITECTURE</text>

  <!-- Level 1: ROS 2 Bus (Top) -->
  <g transform="translate(100, 55)">
    <rect width="720" height="56" rx="10" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/>
    <rect x="16" y="14" width="140" height="28" rx="6" fill="#0284c7"/>
    <text x="86" y="32" fill="#ffffff" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle">ROS 2 DDS BUS</text>
    <text x="180" y="34" fill="#38bdf8" font-family="monospace" font-size="11">Topics: /cmd_vel (Commands)  &lt;====&gt;  /odom, /scan, /imu (Telemetry)</text>
  </g>

  <!-- Bidirectional arrows to gzserver -->
  <g transform="translate(430, 111)">
    <line x1="0" y1="0" x2="0" y2="45" stroke="#10b981" stroke-width="2.5"/>
    <polygon points="-5,8 5,8 0,0" fill="#10b981"/>
    <polygon points="-5,37 5,37 0,45" fill="#10b981"/>
    <text x="15" y="26" fill="#10b981" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">gazebo_ros_pkgs Plugins</text>
  </g>

  <!-- Level 2: GZSERVER Physics Engine -->
  <g transform="translate(100, 158)">
    <rect width="720" height="70" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="16" y="16" width="120" height="38" rx="6" fill="#d97706"/>
    <text x="76" y="39" fill="#ffffff" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">GZSERVER</text>
    <text x="160" y="34" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="12" font-weight="700">ODE / Bullet Rigid-Body Physics Engine (1000 Hz Integration)</text>
    <text x="160" y="52" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10">Surface contact friction (mu1/mu2), motor inertia, gravity -9.81 m/s², ray-tracing LiDAR</text>
  </g>

  <!-- Arrow down to GZCLIENT -->
  <g transform="translate(460, 228)">
    <line x1="0" y1="0" x2="0" y2="30" stroke="#8b5cf6" stroke-width="2"/>
    <polygon points="-5,22 5,22 0,30" fill="#8b5cf6"/>
    <text x="15" y="18" fill="#8b5cf6" font-family="system-ui, sans-serif" font-size="9">OpenGL Scene Graph</text>
  </g>

  <!-- Level 3: GZCLIENT GUI -->
  <g transform="translate(100, 260)">
    <rect width="720" height="56" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
    <rect x="16" y="14" width="120" height="28" rx="6" fill="#7c3aed"/>
    <text x="76" y="32" fill="#ffffff" font-family="monospace" font-size="12" font-weight="700" text-anchor="middle">GZCLIENT</text>
    <text x="160" y="34" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="11">Interactive Qt 3D Viewport GUI (Robot Model, Shadows, Sensor Rays, Orbit Camera)</text>
  </g>
</svg>
